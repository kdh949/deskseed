map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $deskseed_route {
    default "other";
    =/api/v1/requests "/api/v1/requests";
    =/api/v1/customer/consent-policies "/api/v1/customer/consent-policies";
    =/api/v1/customer/ticket-forms "/api/v1/customer/ticket-forms";
    =/api/v1/customer/ticket-form-projections "/api/v1/customer/ticket-form-projections";
    =/api/v1/customer/auth/password-sessions "/api/v1/customer/auth/password-sessions";
    =/api/v1/agent/search "/api/v1/agent/search";
    =/ws/agent/collaboration "/ws/agent/collaboration";
    =/actuator/health "/actuator/health";
    ~^/actuator/health/ "/actuator/health/{component}";
    ~^/api/v1/agent/views/[^/]+/tickets$ "/api/v1/agent/views/{viewKey}/tickets";
    ~^/api/v1/agent/tickets/[0-9]+$ "/api/v1/agent/tickets/{ticketNumber}";
    ~^/_staff/ "/_staff/{asset}";
    ~^/_customer/ "/_customer/{asset}";
}

log_format deskseed_observability escape=json
    '{"event":"http_access","service":"deskseed-frontend","route":"$deskseed_route",'
    '"method":"$request_method","status":$status,"requestDurationSeconds":$request_time,'
    '"upstreamDurationSeconds":"$upstream_response_time","responseBytes":$bytes_sent}';

server {
    listen 80;
    server_name _;
    client_max_body_size 105m;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout deskseed_observability;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location ^~ /actuator/health/ {
        proxy_pass http://backend:8080;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /ws/agent/collaboration {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /_staff/ {
        try_files $uri /_staff/index.html;
    }

    location ~ ^/(agent|admin)(/|$) {
        try_files $uri /_staff/index.html;
    }

    location ^~ /_customer/ {
        try_files $uri /_customer/index.html;
    }

    location / {
        try_files $uri /_customer/index.html;
    }
}
