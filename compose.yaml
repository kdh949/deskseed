services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskseed}
      POSTGRES_USER: ${POSTGRES_USER:-deskseed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskseed-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskseed} -d ${POSTGRES_DB:-deskseed}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - deskseed-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/deskseed}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-deskseed}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-deskseed-local-only}
      DESKSEED_CORS_ALLOWED_ORIGINS: ${DESKSEED_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DESKSEED_AGENT_TICKET_CURSOR_ACTIVE_KEY_ID: ${DESKSEED_AGENT_TICKET_CURSOR_ACTIVE_KEY_ID:-v1}
      DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY:-deskseed-local-development-cursor-signing-key-change-before-production}
      DESKSEED_ACCESS_AUDIT_ENABLED: ${DESKSEED_ACCESS_AUDIT_ENABLED:-true}
      DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION: ${DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION:-local-v1}
      DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1: ${DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      DESKSEED_ACCESS_AUDIT_KEY_V1: ${DESKSEED_ACCESS_AUDIT_KEY_V1:-}
      DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION: ${DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION:-30d}
      DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE: ${DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE:-1000}
      DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL:-1h}
      DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY:-10m}
      DESKSEED_BOOTSTRAP_ADMIN_ENABLED: ${DESKSEED_BOOTSTRAP_ADMIN_ENABLED:-false}
      DESKSEED_BOOTSTRAP_ADMIN_EMAIL: ${DESKSEED_BOOTSTRAP_ADMIN_EMAIL:-}
      DESKSEED_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${DESKSEED_BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      DESKSEED_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/deskseed-first-admin-password
    secrets:
      - deskseed-first-admin-password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DESKSEED_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${DESKSEED_FRONTEND_PORT:-5173}:80"

volumes:
  deskseed-postgres:

secrets:
  deskseed-first-admin-password:
    file: ${DESKSEED_BOOTSTRAP_ADMIN_PASSWORD_FILE:-/dev/null}
