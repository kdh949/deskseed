services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskseed}
      POSTGRES_USER: ${POSTGRES_USER:-deskseed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskseed-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskseed} -d ${POSTGRES_DB:-deskseed}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - deskseed-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/deskseed}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-deskseed}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-deskseed-local-only}
      DESKSEED_CORS_ALLOWED_ORIGINS: ${DESKSEED_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DESKSEED_BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${DESKSEED_FRONTEND_PORT:-5173}:80"

volumes:
  deskseed-postgres:
