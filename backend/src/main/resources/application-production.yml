spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_RUNTIME_USERNAME}
    password: ${DATABASE_RUNTIME_PASSWORD}
  flyway:
    url: ${DATABASE_MIGRATION_URL:${DATABASE_URL}}
    user: ${DATABASE_MIGRATION_USERNAME}
    password: ${DATABASE_MIGRATION_PASSWORD}
  mail:
    host: ${DESKSEED_MAIL_SMTP_HOST:}
    port: ${DESKSEED_MAIL_SMTP_PORT:}
    username: ${DESKSEED_MAIL_SMTP_USERNAME:}
    password: ${DESKSEED_MAIL_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${DESKSEED_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${DESKSEED_MAIL_SMTP_STARTTLS_ENABLE:false}
      "[mail.smtp.starttls.required]": ${DESKSEED_MAIL_SMTP_STARTTLS_REQUIRED:false}
      "[mail.smtp.ssl.enable]": ${DESKSEED_MAIL_SMTP_SSL_ENABLE:false}

springdoc:
  api-docs:
    enabled: ${DESKSEED_API_DOCS_ENABLED:false}

scalar:
  enabled: ${DESKSEED_API_DOCS_ENABLED:false}
  hide-test-request-button: true
  hide-client-button: true

server:
  servlet:
    session:
      cookie:
        secure: true

deskseed:
  api-docs:
    require-admin: true
  platform:
    network:
      allowed-client-cidrs: ${DESKSEED_PLATFORM_ALLOWED_CLIENT_CIDRS}
      trusted-proxy-cidrs: ${DESKSEED_PLATFORM_TRUSTED_PROXY_CIDRS}
  mail:
    # Delivery remains opt-in. When enabled, startup validates SMTP auth, TLS, sender, HTTPS URL, and key material.
    delivery-enabled: ${DESKSEED_MAIL_DELIVERY_ENABLED:false}
    scheduling-enabled: ${DESKSEED_MAIL_SCHEDULING_ENABLED:true}
    transport: ${DESKSEED_MAIL_TRANSPORT:disabled}
    from-address: ${DESKSEED_MAIL_FROM_ADDRESS:}
    public-base-url: ${DESKSEED_MAIL_PUBLIC_BASE_URL:}
    protected-content:
      active-key-version: ${DESKSEED_MAIL_PROTECTED_ACTIVE_KEY_VERSION:v1}
      keys:
        v1: ${DESKSEED_MAIL_PROTECTED_KEY_V1}
    operations:
      cursor:
        active-key-id: ${DESKSEED_MAIL_OPERATIONS_CURSOR_ACTIVE_KEY_ID:v1}
        signing-keys:
          v1: ${DESKSEED_MAIL_OPERATIONS_CURSOR_SIGNING_KEY}
  customer-auth:
    fingerprint-key: ${DESKSEED_CUSTOMER_AUTH_FINGERPRINT_KEY}
    csrf-key: ${DESKSEED_CUSTOMER_AUTH_CSRF_KEY}
    consume-url: ${DESKSEED_CUSTOMER_MAGIC_LINK_CONSUME_URL}
  portal:
    public-request-rate-limit:
      fingerprint-key: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_FINGERPRINT_KEY}
      # An empty value safely ignores X-Forwarded-For; configure only deployed reverse proxies here.
      trusted-proxy-cidrs: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
  customer-portal:
    claim-grant-ttl: ${DESKSEED_CUSTOMER_CLAIM_GRANT_TTL:15m}
    claim-signing-key: ${DESKSEED_CUSTOMER_CLAIM_SIGNING_KEY}
    claim-fingerprint-key: ${DESKSEED_CUSTOMER_CLAIM_FINGERPRINT_KEY}
    request-cursor-signing-key: ${DESKSEED_CUSTOMER_REQUEST_CURSOR_SIGNING_KEY}
  audit:
    access:
      enabled: ${DESKSEED_ACCESS_AUDIT_ENABLED:true}
      active-key-version: ${DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION:v1}
      session-fingerprint-key: ${DESKSEED_ACCESS_AUDIT_SESSION_FINGERPRINT_KEY}
      ciphertext-retention: ${DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION:30d}
      retention-batch-size: ${DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE:1000}
      retention-job-interval: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL:1h}
      retention-job-initial-delay: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY:10m}
      keys:
        v1: ${DESKSEED_ACCESS_AUDIT_KEY_V1}
    explorer:
      reveal:
        recent-authentication: ${DESKSEED_AUDIT_REVEAL_RECENT_AUTHENTICATION:15m}
        mfa-required: ${DESKSEED_AUDIT_REVEAL_MFA_REQUIRED:false}
      cursor:
        active-key-id: ${DESKSEED_AUDIT_CURSOR_ACTIVE_KEY_ID:v1}
        signing-keys:
          v1: ${DESKSEED_AUDIT_CURSOR_SIGNING_KEY}
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS}
  agent-ticket-read:
    cursor:
      signing-keys:
        v1: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY}
