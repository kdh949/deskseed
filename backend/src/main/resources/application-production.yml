spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_RUNTIME_USERNAME}
    password: ${DATABASE_RUNTIME_PASSWORD}
  flyway:
    url: ${DATABASE_MIGRATION_URL:${DATABASE_URL}}
    user: ${DATABASE_MIGRATION_USERNAME}
    password: ${DATABASE_MIGRATION_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

deskseed:
  audit:
    access:
      enabled: ${DESKSEED_ACCESS_AUDIT_ENABLED:true}
      active-key-version: ${DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION:v1}
      ciphertext-retention: ${DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION:30d}
      retention-batch-size: ${DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE:1000}
      retention-job-interval: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL:1h}
      retention-job-initial-delay: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY:10m}
      keys:
        v1: ${DESKSEED_ACCESS_AUDIT_KEY_V1}
    explorer:
      reveal:
        recent-authentication: ${DESKSEED_AUDIT_REVEAL_RECENT_AUTHENTICATION:15m}
        mfa-required: ${DESKSEED_AUDIT_REVEAL_MFA_REQUIRED:false}
      cursor:
        active-key-id: ${DESKSEED_AUDIT_CURSOR_ACTIVE_KEY_ID:v1}
        signing-keys:
          v1: ${DESKSEED_AUDIT_CURSOR_SIGNING_KEY}
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS}
  agent-ticket-read:
    cursor:
      signing-keys:
        v1: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY}
