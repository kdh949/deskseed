spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_RUNTIME_USERNAME}
    password: ${DATABASE_RUNTIME_PASSWORD}
  flyway:
    url: ${DATABASE_MIGRATION_URL:${DATABASE_URL}}
    user: ${DATABASE_MIGRATION_USERNAME}
    password: ${DATABASE_MIGRATION_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

deskseed:
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS}
