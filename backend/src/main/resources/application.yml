spring:
  application:
    name: deskseed
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deskseed}
    username: ${DATABASE_USERNAME:deskseed}
    password: ${DATABASE_PASSWORD:deskseed-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

deskseed:
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS:http://localhost:5173}
