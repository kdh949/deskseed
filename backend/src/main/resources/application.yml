spring:
  application:
    name: deskseed
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deskseed}
    username: ${DATABASE_USERNAME:deskseed}
    password: ${DATABASE_PASSWORD:deskseed-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${DESKSEED_AUTH_SESSION_IDLE:60m}
      cookie:
        name: DESKSEED_SESSION
        http-only: true
        secure: false
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${DESKSEED_API_DOCS_ENABLED:true}

scalar:
  enabled: ${DESKSEED_API_DOCS_ENABLED:true}
  path: /docs/api
  url: /api-docs/specs/core-api-outline-v1.yaml
  page-title: Deskseed API 문서
  layout: modern
  show-sidebar: true
  hide-models: false
  hide-search: false
  hide-test-request-button: false
  hide-client-button: false
  with-default-fonts: false
  persist-auth: false
  telemetry: false
  show-operation-id: true
  operation-title-source: summary
  document-download-type: yaml
  agent:
    disabled: true
  sources:
    - url: /api-docs/specs/core-api-outline-v1.yaml
      title: Deskseed Core API
      slug: core
      is-default: true
      agent:
        disabled: true
    - url: /api-docs/specs/customer-identity-api-v1.yaml
      title: Deskseed Customer Identity API
      slug: customer-identity
      agent:
        disabled: true
    - url: /api-docs/specs/platform-api-outline-v1.yaml
      title: Deskseed Platform API
      slug: platform
      agent:
        disabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

deskseed:
  api-docs:
    require-admin: false
  platform:
    network:
      # Production must set both values. Empty values use loopback/RFC1918 development defaults outside prod.
      allowed-client-cidrs: ${DESKSEED_PLATFORM_ALLOWED_CLIENT_CIDRS:}
      trusted-proxy-cidrs: ${DESKSEED_PLATFORM_TRUSTED_PROXY_CIDRS:}
    rate-limit:
      requests-per-minute: ${DESKSEED_PLATFORM_RATE_LIMIT_PER_MINUTE:60}
      max-clients: ${DESKSEED_PLATFORM_RATE_LIMIT_MAX_CLIENTS:10000}
      stale-after: ${DESKSEED_PLATFORM_RATE_LIMIT_STALE_AFTER:2m}
    idempotency:
      retention: ${DESKSEED_PLATFORM_IDEMPOTENCY_RETENTION:7d}
      in-progress-grace: ${DESKSEED_PLATFORM_IDEMPOTENCY_IN_PROGRESS_GRACE:1h}
      cleanup-batch-size: ${DESKSEED_PLATFORM_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}
      cleanup-interval: ${DESKSEED_PLATFORM_IDEMPOTENCY_CLEANUP_INTERVAL:1h}
      cleanup-initial-delay: ${DESKSEED_PLATFORM_IDEMPOTENCY_CLEANUP_INITIAL_DELAY:10m}
  mail:
    # Delivery is opt-in. The local Compose topology enables the Mailpit SMTP adapter.
    delivery-enabled: ${DESKSEED_MAIL_DELIVERY_ENABLED:false}
    scheduling-enabled: ${DESKSEED_MAIL_SCHEDULING_ENABLED:true}
    transport: ${DESKSEED_MAIL_TRANSPORT:disabled}
    from-address: ${DESKSEED_MAIL_FROM_ADDRESS:no-reply@deskseed.local}
    public-base-url: ${DESKSEED_MAIL_PUBLIC_BASE_URL:http://localhost:5173}
    retry-backoff: ${DESKSEED_MAIL_RETRY_BACKOFF:0s,1m,5m,30m,2h}
    worker-fixed-delay: ${DESKSEED_MAIL_WORKER_FIXED_DELAY:5s}
    worker-initial-delay: ${DESKSEED_MAIL_WORKER_INITIAL_DELAY:5s}
    lease-duration: ${DESKSEED_MAIL_LEASE_DURATION:2m}
    batch-size: ${DESKSEED_MAIL_BATCH_SIZE:20}
    protected-content:
      active-key-version: ${DESKSEED_MAIL_PROTECTED_ACTIVE_KEY_VERSION:local-v1}
      keys:
        # Public local-development material only. Production must provision its own 32-byte key.
        local-v1: ${DESKSEED_MAIL_PROTECTED_KEY_LOCAL_V1:AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=}
    operations:
      cursor:
        active-key-id: ${DESKSEED_MAIL_OPERATIONS_CURSOR_ACTIVE_KEY_ID:local-v1}
        signing-keys:
          # Local-only development value. Production overrides this with a purpose-specific secret.
          local-v1: ${DESKSEED_MAIL_OPERATIONS_CURSOR_SIGNING_KEY:deskseed-local-outbound-mail-operations-cursor-signing-key-change-before-production}
  audit:
    access:
      enabled: ${DESKSEED_ACCESS_AUDIT_ENABLED:true}
      active-key-version: ${DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION:local-v1}
      # Independent from raw-query encryption rotation. Public development-only material.
      session-fingerprint-key: ${DESKSEED_ACCESS_AUDIT_SESSION_FINGERPRINT_KEY:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
      ciphertext-retention: ${DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION:30d}
      retention-batch-size: ${DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE:1000}
      retention-job-interval: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL:1h}
      retention-job-initial-delay: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY:10m}
      keys:
        # Public local-development material only. Production must provision its own 32-byte base64 key.
        local-v1: ${DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    explorer:
      reveal:
        recent-authentication: ${DESKSEED_AUDIT_REVEAL_RECENT_AUTHENTICATION:15m}
        mfa-required: ${DESKSEED_AUDIT_REVEAL_MFA_REQUIRED:false}
      cursor:
        active-key-id: ${DESKSEED_AUDIT_CURSOR_ACTIVE_KEY_ID:v1}
        signing-keys:
          # Local-only development value. Production overrides this with a provisioned secret.
          v1: ${DESKSEED_AUDIT_CURSOR_SIGNING_KEY:deskseed-local-audit-explorer-cursor-signing-key-change-before-production}
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  portal:
    request-access-token:
      ttl: ${DESKSEED_REQUEST_ACCESS_TOKEN_TTL:30d}
    public-request-rate-limit:
      enabled: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_ENABLED:true}
      window: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_WINDOW:1m}
      destination-limit: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_DESTINATION_LIMIT:5}
      client-limit: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_CLIENT_LIMIT:100}
      global-limit: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_GLOBAL_LIMIT:1000}
      # Local-only development key. Production must provision a purpose-specific secret.
      fingerprint-key: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_FINGERPRINT_KEY:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=}
      trusted-proxy-cidrs: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_TRUSTED_PROXY_CIDRS:127.0.0.0/8,::1/128}
      max-forwarded-hops: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_MAX_FORWARDED_HOPS:10}
      cleanup-batch-size: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_CLEANUP_BATCH_SIZE:500}
      cleanup-interval: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_CLEANUP_INTERVAL:1h}
      cleanup-initial-delay: ${DESKSEED_PUBLIC_REQUEST_RATE_LIMIT_CLEANUP_INITIAL_DELAY:10m}
  agent-ticket-read:
    cursor:
      active-key-id: ${DESKSEED_AGENT_TICKET_CURSOR_ACTIVE_KEY_ID:v1}
      signing-keys:
        # Local-only development value. Production overrides this with a provisioned secret.
        v1: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY:deskseed-local-development-cursor-signing-key-change-before-production}
  staff-auth:
    password-cost: ${DESKSEED_AUTH_PASSWORD_COST:12}
    session-idle: ${DESKSEED_AUTH_SESSION_IDLE:60m}
    session-absolute: ${DESKSEED_AUTH_SESSION_ABSOLUTE:12h}
    login-failure-limit: ${DESKSEED_AUTH_LOGIN_FAILURE_LIMIT:10}
    login-failure-window: ${DESKSEED_AUTH_LOGIN_FAILURE_WINDOW:15m}
    bootstrap:
      enabled: ${DESKSEED_BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${DESKSEED_BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${DESKSEED_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password-file: ${DESKSEED_BOOTSTRAP_ADMIN_PASSWORD_FILE:}
  sla:
    breach-scanner:
      batch-size: ${DESKSEED_SLA_BREACH_SCAN_BATCH_SIZE:100}
      interval: ${DESKSEED_SLA_BREACH_SCAN_INTERVAL:30s}
      initial-delay: ${DESKSEED_SLA_BREACH_SCAN_INITIAL_DELAY:30s}
  customer-auth:
    magic-link-ttl: ${DESKSEED_CUSTOMER_MAGIC_LINK_TTL:15m}
    request-limit: ${DESKSEED_CUSTOMER_MAGIC_LINK_REQUEST_LIMIT:5}
    request-window: ${DESKSEED_CUSTOMER_MAGIC_LINK_REQUEST_WINDOW:15m}
    response-min-duration: ${DESKSEED_CUSTOMER_MAGIC_LINK_RESPONSE_MIN_DURATION:100ms}
    session-idle: ${DESKSEED_CUSTOMER_SESSION_IDLE:30m}
    session-absolute: ${DESKSEED_CUSTOMER_SESSION_ABSOLUTE:12h}
    # Independent local-development keys. Production must provision unique secrets.
    fingerprint-key: ${DESKSEED_CUSTOMER_AUTH_FINGERPRINT_KEY:AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=}
    csrf-key: ${DESKSEED_CUSTOMER_AUTH_CSRF_KEY:AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=}
    consume-url: ${DESKSEED_CUSTOMER_MAGIC_LINK_CONSUME_URL:http://localhost:5173/customer/sign-in/consume}
  customer-portal:
    claim-grant-ttl: ${DESKSEED_CUSTOMER_CLAIM_GRANT_TTL:15m}
    # Independent public local-development keys. Production requires provisioned secrets.
    claim-signing-key: ${DESKSEED_CUSTOMER_CLAIM_SIGNING_KEY:BAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=}
    claim-fingerprint-key: ${DESKSEED_CUSTOMER_CLAIM_FINGERPRINT_KEY:BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=}
    request-cursor-signing-key: ${DESKSEED_CUSTOMER_REQUEST_CURSOR_SIGNING_KEY:BgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgY=}
