spring:
  application:
    name: deskseed
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deskseed}
    username: ${DATABASE_USERNAME:deskseed}
    password: ${DATABASE_PASSWORD:deskseed-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${DESKSEED_AUTH_SESSION_IDLE:60m}
      cookie:
        name: DESKSEED_SESSION
        http-only: true
        secure: false
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

deskseed:
  audit:
    access:
      enabled: ${DESKSEED_ACCESS_AUDIT_ENABLED:true}
      active-key-version: ${DESKSEED_ACCESS_AUDIT_ACTIVE_KEY_VERSION:local-v1}
      ciphertext-retention: ${DESKSEED_ACCESS_AUDIT_QUERY_CIPHERTEXT_RETENTION:30d}
      retention-batch-size: ${DESKSEED_ACCESS_AUDIT_RETENTION_BATCH_SIZE:1000}
      retention-job-interval: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INTERVAL:1h}
      retention-job-initial-delay: ${DESKSEED_ACCESS_AUDIT_RETENTION_JOB_INITIAL_DELAY:10m}
      keys:
        # Public local-development material only. Production must provision its own 32-byte base64 key.
        local-v1: ${DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  cors:
    allowed-origins: ${DESKSEED_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  portal:
    request-access-token:
      ttl: ${DESKSEED_REQUEST_ACCESS_TOKEN_TTL:30d}
  agent-ticket-read:
    cursor:
      active-key-id: ${DESKSEED_AGENT_TICKET_CURSOR_ACTIVE_KEY_ID:v1}
      signing-keys:
        # Local-only development value. Production overrides this with a provisioned secret.
        v1: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY:deskseed-local-development-cursor-signing-key-change-before-production}
  staff-auth:
    password-cost: ${DESKSEED_AUTH_PASSWORD_COST:12}
    session-idle: ${DESKSEED_AUTH_SESSION_IDLE:60m}
    session-absolute: ${DESKSEED_AUTH_SESSION_ABSOLUTE:12h}
    login-failure-limit: ${DESKSEED_AUTH_LOGIN_FAILURE_LIMIT:10}
    login-failure-window: ${DESKSEED_AUTH_LOGIN_FAILURE_WINDOW:15m}
    bootstrap:
      enabled: ${DESKSEED_BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${DESKSEED_BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${DESKSEED_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password-file: ${DESKSEED_BOOTSTRAP_ADMIN_PASSWORD_FILE:}
