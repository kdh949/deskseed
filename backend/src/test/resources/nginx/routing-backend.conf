events {}

http {
    server {
        listen 8080;

        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","source":"application-8080"}';
        }
    }

    server {
        listen 9090;

        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","source":"management-9090"}';
        }

        location = /actuator/prometheus {
            default_type text/plain;
            return 200 '# HELP deskseed_test_metric test';
        }
    }
}
