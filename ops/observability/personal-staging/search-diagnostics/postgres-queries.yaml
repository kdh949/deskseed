# PostgreSQL 17. SQL text is read only for classification and never returned/exported.
deskseed_search_sql:
  query: |
    WITH classified AS (
      SELECT queryid,
             CASE WHEN query ~ '^[[:space:]]*select count\(\*\)' THEN 'count' ELSE 'page' END AS phase,
             calls, total_exec_time, shared_blks_hit, shared_blks_read, shared_blk_read_time,
             temp_blks_read, temp_blks_written, rows
      FROM public.pg_stat_statements
      WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
        AND position('join ticket_search_documents search_document' in query) > 0
        AND query ~ '^[[:space:]]*(select count\(\*\)|with ranked)'
      ORDER BY total_exec_time DESC LIMIT 64
    )
    SELECT queryid::text AS queryid, phase,
           'deskseed.staff_ticket_search.' || phase AS query_summary,
           calls, total_exec_time / 1000.0 AS execution_seconds,
           CASE WHEN calls = 0 THEN 0 ELSE total_exec_time / calls / 1000.0 END AS mean_execution_seconds,
           shared_blks_hit, shared_blks_read,
           shared_blk_read_time / 1000.0 AS read_seconds,
           temp_blks_read, temp_blks_written, rows
    FROM classified
  metrics:
    - queryid: {usage: LABEL, description: "PostgreSQL normalized query identifier; never query text"}
    - phase: {usage: LABEL, description: "Bounded count or page SQL family"}
    - query_summary: {usage: LABEL, description: "Fixed Deskseed query family; never query text"}
    - calls: {usage: COUNTER, description: "Completed SQL calls"}
    - execution_seconds: {usage: COUNTER, description: "Database executor seconds"}
    - mean_execution_seconds: {usage: GAUGE, description: "Mean database executor seconds per completed call"}
    - shared_blks_hit: {usage: COUNTER, description: "Shared buffer hits"}
    - shared_blks_read: {usage: COUNTER, description: "Shared blocks read"}
    - read_seconds: {usage: COUNTER, description: "Shared block read seconds"}
    - temp_blks_read: {usage: COUNTER, description: "Temporary blocks read"}
    - temp_blks_written: {usage: COUNTER, description: "Temporary blocks written"}
    - rows: {usage: COUNTER, description: "Returned rows; count SQL returns one aggregate row"}

deskseed_db_wait:
  query: |
    SELECT coalesce(wait_event_type, 'CPU_or_running') AS wait_type,
           coalesce(wait_event, 'none') AS wait_event, count(*) AS sessions
    FROM pg_stat_activity
    WHERE datname = current_database() AND pid <> pg_backend_pid() AND state = 'active'
    GROUP BY 1, 2
  metrics:
    - wait_type: {usage: LABEL, description: "PostgreSQL wait event type; absence is not CPU attribution"}
    - wait_event: {usage: LABEL, description: "PostgreSQL bounded wait event"}
    - sessions: {usage: GAUGE, description: "Active sessions at scrape time; short waits may be missed"}

deskseed_db_blocking:
  query: |
    SELECT count(*) FILTER (WHERE cardinality(pg_blocking_pids(pid)) > 0) AS blocked_sessions
    FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid()
  metrics:
    - blocked_sessions: {usage: GAUGE, description: "Sessions with a blocking backend"}

deskseed_pg_stat_statements:
  query: |
    SELECT extract(epoch FROM stats_reset) AS reset_timestamp_seconds, dealloc
    FROM public.pg_stat_statements_info
  metrics:
    - reset_timestamp_seconds: {usage: GAUGE, description: "Reject comparisons across a statistics reset"}
    - dealloc: {usage: COUNTER, description: "Statement entries evicted; incomplete statement evidence"}
