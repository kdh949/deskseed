openapi: 3.1.0
info:
  title: Deskseed Customer Identity API v1
  version: 1.0.0-contract
  description: >-
    Implementation-ready email magic-link, secure customer session, and explicit
    anonymous-request claim contract. Matching email alone never claims a request.
  x-deskseed-status: implementation-ready
servers:
  - url: http://localhost:8080
security: []
tags:
  - name: Customer Identity
paths:
  /api/v1/customer/auth/magic-link-requests:
    post:
      tags: [Customer Identity]
      operationId: requestCustomerMagicLink
      summary: Request a single-use email magic link
      description: >-
        For every syntactically valid email, including unknown and rate-limited
        destinations, the operation returns the same 202 body, cache policy and timing
        class. Delivery is a durable outbound-mail intent and account existence is not
        exposed in the response, audit or logs.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-001, REQ-AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkRequest' }
      responses:
        '202':
          description: Generic accepted response regardless of account existence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericAccepted' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/customer/auth/magic-link-sessions:
    post:
      tags: [Customer Identity]
      operationId: consumeCustomerMagicLink
      summary: Atomically consume a single-use token and create a customer session
      description: >-
        The token is accepted only in a JSON request body. Success rotates any
        presented customer session, creates or links a CustomerAccount without
        changing historical anonymous ticket ownership, and sets a new opaque cookie.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-001, REQ-AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkConsume' }
      responses:
        '200':
          description: Token consumed once and server session created
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Referrer-Policy:
              schema: { type: string, const: no-referrer }
            Set-Cookie:
              description: >-
                DESKSEED_CUSTOMER_SESSION; Path=/; HttpOnly; Secure; SameSite=Lax.
                Only a digest of the opaque value is retained server-side.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentCustomer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/customer/csrf:
    get:
      tags: [Customer Identity]
      operationId: getCustomerCsrfToken
      summary: Return a CSRF token bound to the current customer session
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-001]
      security: [{ customerSession: [] }]
      responses:
        '200':
          description: CSRF token for unsafe customer-session operations
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCsrfToken' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/customer/session:
    delete:
      tags: [Customer Identity]
      operationId: deleteCustomerSession
      summary: Invalidate the current customer session
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-001]
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CustomerCsrfHeader'
      responses:
        '204':
          description: Server session revoked and cookie expired
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Set-Cookie:
              description: Expired DESKSEED_CUSTOMER_SESSION cookie
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/customer/requests/{ticketNumber}/claim:
    post:
      tags: [Customer Identity]
      operationId: claimAnonymousCustomerRequest
      summary: Claim one anonymous request using a request-specific proof
      description: >-
        Matching email is necessary but never sufficient. Exactly one ticket-specific
        request access token or signed claim token must be supplied. Success consumes
        or revokes the proof and transfers the existing ticket requester to the current
        customer account atomically with ticket and security audit.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-002, REQ-TKT-005]
      security: [{ customerSession: [] }]
      parameters:
        - name: ticketNumber
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/CustomerCsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimRequest' }
      responses:
        '204':
          description: Request linked to the signed-in customer; proof is no longer reusable
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/requests/{ticketNumber}/claim-grants:
    post:
      tags: [Customer Identity]
      operationId: issueAnonymousRequestClaimGrant
      summary: Exchange an active request-access capability for a short-lived claim grant
      description: >-
        The existing request access token is supplied only in the header. The returned
        signed token is ticket-bound, email-fingerprint-bound, short-lived and single use.
        No email or bearer token plaintext is persisted or audited.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUTH-002, REQ-TKT-005]
      parameters:
        - name: ticketNumber
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: X-Request-Access-Token
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
      responses:
        '201':
          description: Short-lived signed claim grant issued
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimGrant' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
      description: >-
        Opaque HttpOnly, Secure, SameSite=Lax cookie. The server stores only a digest
        and resolves it to exactly one active CustomerAccount.
  parameters:
    CustomerCsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token derived for and bound to the opaque customer server session.
      schema: { type: string, minLength: 32, maxLength: 256 }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    MagicLinkConsume:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
    CustomerCsrfToken:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        headerName: { type: string, const: X-CSRF-TOKEN }
    CurrentCustomer:
      type: object
      additionalProperties: false
      required: [id, email, displayName, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        verifiedAt: { type: string, format: date-time }
    ClaimRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [requestAccessToken]
        - required: [claimToken]
      properties:
        requestAccessToken: { type: string, minLength: 32, maxLength: 1000 }
        claimToken: { type: string, minLength: 32, maxLength: 1000 }
    ClaimGrant:
      type: object
      additionalProperties: false
      required: [claimToken, expiresAt]
      properties:
        claimToken: { type: string, minLength: 32, maxLength: 1000 }
        expiresAt: { type: string, format: date-time }
    GenericAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        requestId: { type: string }
