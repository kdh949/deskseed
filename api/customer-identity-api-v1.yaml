openapi: 3.1.0
info:
  title: Deskseed Customer Identity API v1
  version: 1.1.0-contract
  description: >-
    Deskseed 고객의 password registration, email verification, password/passwordless 인증,
    고객 세션, CSRF, password reset, 익명 문의 연결을 정의하는 커밋 계약입니다. 예시는 합성
    데이터이며 실제 비밀번호, token, cookie 또는 고객 정보를 문서에 입력하거나 저장하지 않습니다.
  x-deskseed-status: implementation-ready
servers:
- url: http://localhost:8080
security: []
tags:
- name: Customer Identity
  description: >-
    Password-primary 고객 계정과 passwordless-only magic-link onboarding, purpose-bound
    one-time proof, 고객 세션 및 명시적 익명 문의 연결을 처리합니다.
paths:
  /api/v1/customer/registrations:
    post:
      tags:
      - Customer Identity
      operationId: requestCustomerRegistration
      summary: 고객 password 등록과 이메일 확인 요청
      description: >-
        고객 email, password, profile과 현재 registration consent versions를 받아 pending
        registration intent를 만듭니다. 신규·기존·passwordless·pending email은 같은 202 body,
        cache policy와 comparable work class를 사용합니다. Password는 customer-specific adaptive
        hash로만 저장하고, email 확인 token과 browser continuation secret는 digest만 저장합니다.
        Mail delivery는 durable intent commit 뒤에 실행되며 response, audit, log는 계정 존재 여부와
        password/token/company name을 노출하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-003
      - REQ-CONSENT-002
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-security-audit-events:
      - CUSTOMER_REGISTRATION_REQUESTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationRequest'
      responses:
        '202':
          $ref: '#/components/responses/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/registration-verifications:
    post:
      tags:
      - Customer Identity
      operationId: verifyCustomerRegistration
      summary: 고객 등록 이메일 확인과 계정 활성화
      description: >-
        Email로 전달된 EMAIL_VERIFICATION token과 같은 pending intent의 HttpOnly browser
        continuation cookie를 함께 소비합니다. 두 proof와 현재 registration policies가 모두
        일치할 때 verified Customer, ACTIVE_PASSWORD account, consent acceptances를 만들고 proof를
        소비합니다. Mismatch, expiry, replay, purpose mismatch와 concurrent consume은 계정을 만들지
        않습니다. Profile/account/consents/security audit는 원자적이며 SMTP 호출은 transaction 밖입니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-003
      - REQ-CONSENT-002
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-security-audit-events:
      - CUSTOMER_REGISTRATION_VERIFIED
      - CUSTOMER_CONSENT_ACCEPTED
      security:
      - registrationContinuation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistrationVerificationRequest'
      responses:
        '204':
          description: >-
            등록 intent와 proof를 한 번 소비하고 verified password account를 활성화했습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
            Set-Cookie:
              description: >-
                DESKSEED_CUSTOMER_REGISTRATION continuation cookie를 즉시 만료합니다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidOneTimeProof'
        '409':
          $ref: '#/components/responses/CustomerRegistrationConflict'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/auth/password-sessions:
    post:
      tags:
      - Customer Identity
      operationId: createCustomerPasswordSession
      summary: 고객 password 세션 생성
      description: >-
        Email/password를 확인하고 성공하면 현재 customer session을 rotate한 뒤 bounded
        CurrentCustomer projection을 반환합니다. Unknown email, wrong password, disabled account,
        passwordless account와 incomplete registration은 같은 invalid-credential problem을 반환하고
        real-or-dummy adaptive hash comparison을 수행합니다. Throttling은 destination/network
        fingerprint만 저장하며 성공 audit에도 email, password/hash, company name, cookie가 없습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-003
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-session-transition: ROTATE
      x-deskseed-security-audit-events:
      - CUSTOMER_PASSWORD_LOGIN_SUCCEEDED
      - CUSTOMER_PASSWORD_LOGIN_FAILED
      - CUSTOMER_PASSWORD_LOGIN_RATE_LIMITED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPasswordSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerSessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidCustomerCredentials'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/auth/magic-link-requests:
    post:
      tags:
      - Customer Identity
      operationId: requestCustomerMagicLink
      summary: Passwordless 고객 로그인용 일회성 링크 요청
      description: >-
        Purpose/destination/requester-network limiter는 identity eligibility 조회 전에 적용하며 unknown,
        password, passwordless identity가 동일한 limiter 조건이면 같은 429와 Retry-After를 반환합니다.
        제한되지 않은 syntactically valid email에는 identity 존재·credential state와 관계없이 같은 202
        body와 cache policy를 반환합니다. PASSWORDLESS_LOGIN mail intent는 password credential이 없는
        eligible identity에만 만들며 password account에는 만들지 않습니다. Token은 digest만 저장하고
        delivery는 post-commit입니다. Response, audit, log에는 존재 여부, raw email/token, company name이
        없습니다.
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-002
      - REQ-AUTH-004
      x-deskseed-authentication-eligibility: PASSWORDLESS_ONLY
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-security-audit-events:
      - CUSTOMER_MAGIC_LINK_REQUESTED
      - CUSTOMER_MAGIC_LINK_RATE_LIMITED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericAcceptedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/auth/magic-link-sessions:
    post:
      tags:
      - Customer Identity
      operationId: consumeCustomerMagicLink
      summary: Passwordless 일회성 링크로 고객 세션 생성
      description: >-
        JSON body의 single-use PASSWORDLESS_LOGIN token만 소비합니다. Success는 presented customer
        session을 rotate하고 CurrentCustomer를 반환하며 registration이 미완료라면
        registrationState=REGISTRATION_REQUIRED로 표시합니다. CustomerAccount 생성/연결은 기존 익명
        ticket ownership을 바꾸지 않습니다. Malformed, wrong-purpose, expired, replayed, concurrent
        token은 같은 invalid-proof problem을 사용하고 두 번째 session을 만들지 않습니다.
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-002
      - REQ-AUTH-004
      x-deskseed-authentication-eligibility: PASSWORDLESS_ONLY
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-session-transition: ROTATE
      x-deskseed-security-audit-events:
      - CUSTOMER_MAGIC_LINK_CONSUMED
      - CUSTOMER_MAGIC_LINK_REPLAYED
      - CUSTOMER_MAGIC_LINK_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsume'
      responses:
        '200':
          $ref: '#/components/responses/CustomerSessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidOneTimeProof'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/me/registration:
    put:
      tags:
      - Customer Identity
      operationId: completePasswordlessCustomerRegistration
      summary: Passwordless 고객 등록 완료
      description: >-
        PASSWORDLESS credential session과 CSRF를 요구합니다. Password, display/company profile과
        현재 registration consent versions를 검증해 ACTIVE_PASSWORD/COMPLETE로 바꾸고 credential
        version을 증가시킵니다. Current session은 rotate하고 다른 session은 revoke하며 mutation,
        acceptances와 required security audit는 원자적입니다. Password account는 password reset을
        우회할 수 없고, email equality로 anonymous ticket을 list/claim하지 않습니다.
      x-deskseed-requirements:
      - REQ-AUTH-002
      - REQ-AUTH-004
      - REQ-CONSENT-002
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-session-transition: ROTATE_AND_REVOKE_OLDER
      x-deskseed-security-audit-events:
      - CUSTOMER_REGISTRATION_COMPLETED
      - CUSTOMER_CONSENT_ACCEPTED
      security:
      - customerSession: []
      parameters:
      - $ref: '#/components/parameters/CustomerCsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordlessRegistrationCompletionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CustomerSessionCreated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/CustomerSessionRequired'
        '403':
          $ref: '#/components/responses/CustomerCsrfRejected'
        '409':
          $ref: '#/components/responses/CustomerRegistrationConflict'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/auth/password-reset-requests:
    post:
      tags:
      - Customer Identity
      operationId: requestCustomerPasswordReset
      summary: 고객 password 재설정 링크 요청
      description: >-
        Syntactically valid email에는 account/credential state와 관계없이 같은 202 body와 comparable
        work class를 반환합니다. PASSWORD_RESET mail intent는 active password account에만 만들고
        digest-only, purpose-bound, single-use token을 사용합니다. Email network I/O는 commit 뒤이며
        response, audit, log는 account existence, raw email/token, password state를 노출하지 않습니다.
      x-deskseed-requirements:
      - REQ-AUTH-003
      x-deskseed-contract-status: FROZEN
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-security-audit-events:
      - CUSTOMER_PASSWORD_RESET_REQUESTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericAcceptedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/auth/password-resets:
    post:
      tags:
      - Customer Identity
      operationId: resetCustomerPassword
      summary: 일회성 proof로 고객 password 재설정
      description: >-
        JSON body의 PASSWORD_RESET token을 한 번 소비해 customer-specific adaptive password hash를
        교체하고 credentialVersion을 증가시킵니다. 모든 customer session은 같은 transaction에서
        revoke되고 현재 cookie도 만료합니다. Wrong-purpose, malformed, expired, replayed와 concurrent
        consume은 동일한 invalid-proof problem을 사용하며 두 번째 password change나 login session을
        만들지 않습니다. Raw password/token/hash는 response, audit, log에 없습니다.
      x-deskseed-requirements:
      - REQ-AUTH-003
      x-deskseed-rate-limit: PURPOSE_DESTINATION_NETWORK
      x-deskseed-session-transition: REVOKE_ALL
      x-deskseed-security-audit-events:
      - CUSTOMER_PASSWORD_RESET_COMPLETED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPasswordResetConsume'
      responses:
        '204':
          description: Password가 한 번 변경되었고 기존 customer session이 모두 revoke되었습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
            Set-Cookie:
              description: 현재 DESKSEED_CUSTOMER_SESSION cookie를 즉시 만료합니다.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidOneTimeProof'
        '429':
          $ref: '#/components/responses/AuthenticationRateLimited'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/customer/me:
    get:
      tags:
      - Customer Identity
      operationId: getCurrentCustomer
      summary: 현재 인증 고객과 등록 상태 조회
      description: >-
        현재 customer session에 귀속된 profile과 bounded credential/registration/authentication-method
        상태를 반환합니다. Password hash, token, session ID/cookie, limiter, consent acceptance, security
        audit, INTERNAL comment, child relation과 staff-only field는 포함하지 않습니다. Company name은
        본인 session projection에서만 반환하고 cache하지 않습니다.
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-003
      - REQ-AUTH-004
      security:
      - customerSession: []
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCustomer'
        '401':
          $ref: '#/components/responses/CustomerSessionRequired'
  /api/v1/customer/csrf:
    get:
      tags:
      - Customer Identity
      operationId: getCustomerCsrfToken
      summary: 고객 세션용 CSRF 토큰 발급
      description: >-
        현재 opaque customer session에서 파생되고 해당 session에만 귀속되는 CSRF token과 header
        이름을 반환합니다. Response는 no-store이며 token을 log, audit, URL 또는 referrer에 남기지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-003
      - REQ-AUTH-004
      security:
      - customerSession: []
      responses:
        '200':
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCsrfToken'
        '401':
          $ref: '#/components/responses/CustomerSessionRequired'
  /api/v1/customer/session:
    delete:
      tags:
      - Customer Identity
      operationId: deleteCustomerSession
      summary: 현재 고객 세션 종료
      description: >-
        현재 customer session과 CSRF를 확인하고 server-side row를 revoke한 뒤 browser cookie를
        만료합니다. 다른 customer의 session을 선택하거나 session cookie를 response body에 반환하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-003
      - REQ-AUTH-004
      security:
      - customerSession: []
      parameters:
      - $ref: '#/components/parameters/CustomerCsrfHeader'
      responses:
        '204':
          description: 현재 customer session을 revoke하고 cookie를 만료했습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: 만료 처리된 DESKSEED_CUSTOMER_SESSION cookie입니다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/CustomerSessionRequired'
        '403':
          $ref: '#/components/responses/CustomerCsrfRejected'
  /api/v1/customer/requests/{ticketNumber}/claim:
    post:
      tags:
      - Customer Identity
      operationId: claimAnonymousCustomerRequest
      summary: 익명 문의를 인증 고객 계정에 연결
      description: >-
        Matching email은 필요 조건일 뿐 권한이 아닙니다. Ticket-specific request access token 또는
        signed claim token 중 정확히 하나를 제출해야 합니다. Success는 proof를 consume/revoke하고 기존
        ticket requester를 현재 customer account로 바꾸며 ticket/security audit와 원자적으로 commit합니다.
        Password/passwordless registration과 email equality만으로는 ticket을 자동 list/claim하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-002
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: ticketNumber
        in: path
        required: true
        description: 고객이 ticket-specific proof로 연결하려는 공개 문의 번호입니다.
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/CustomerCsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '204':
          description: Ticket-specific proof를 소비하고 기존 문의 requester를 현재 고객으로 연결했습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/CustomerSessionRequired'
        '403':
          $ref: '#/components/responses/CustomerCsrfRejected'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /api/v1/requests/{ticketNumber}/claim-grants:
    post:
      tags:
      - Customer Identity
      operationId: issueAnonymousRequestClaimGrant
      summary: 문의 접근 토큰을 단기 연결 권한으로 교환
      description: >-
        기존 request access token은 header에서만 받고 ticket/email-fingerprint-bound, short-lived,
        single-use signed claim token으로 교환합니다. Email이나 bearer token plaintext는 persistence,
        audit, log에 남지 않습니다. Inaccessible ticket과 invalid/expired token은 같은 not-found 결과를
        사용하고 registration/password 인증 상태를 변경하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-002
      - REQ-TKT-005
      parameters:
      - name: ticketNumber
        in: path
        required: true
        description: 접근 token과 함께 단기 claim grant를 발급할 공개 문의 번호입니다.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: X-Request-Access-Token
        in: header
        required: true
        description: >-
          익명 문의 생성 시 한 번 전달된 ticket-scoped opaque capability입니다. URL, log, audit에
          복사하지 않으며 서버는 digest로만 확인합니다.
        schema:
          type: string
          minLength: 32
          maxLength: 256
      responses:
        '201':
          description: 현재 문의와 normalized email fingerprint에만 사용할 단기 claim grant입니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimGrant'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
      description: >-
        Opaque HttpOnly, Secure-in-production, SameSite=Lax cookie입니다. 서버는 digest와 credential
        version snapshot만 저장하고 정확히 하나의 active CustomerAccount로 해석합니다.
    registrationContinuation:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_REGISTRATION
      description: >-
        Registration request browser에만 설정되는 HttpOnly, Secure-in-production, SameSite=Lax
        continuation proof입니다. 서버는 digest만 저장하며 email token 단독 활성화를 막습니다.
  parameters:
    CustomerCsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: >-
        현재 opaque customer server session에서 파생되어 그 session에만 귀속되는 CSRF token입니다.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  headers:
    NoStore:
      description: 인증·PII response를 browser나 intermediary cache에 저장하지 않는 정책입니다.
      schema:
        type: string
        const: no-store
    NoReferrer:
      description: One-time proof가 referrer로 전달되지 않도록 차단하는 정책입니다.
      schema:
        type: string
        const: no-referrer
    RetryAfter:
      description: 같은 인증 요청을 다시 시도할 수 있을 때까지의 초 단위 대기 시간입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 3600
      example: 60
  responses:
    RegistrationAccepted:
      description: >-
        계정 존재나 mail 발송 여부와 관계없이 registration 요청을 같은 shape로 접수했습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
        Set-Cookie:
          description: >-
            DESKSEED_CUSTOMER_REGISTRATION HttpOnly, Secure-in-production, SameSite=Lax continuation
            cookie입니다. Cookie 원문은 response body, log, audit에 포함하지 않습니다.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericAccepted'
    GenericAcceptedResponse:
      description: Account 존재나 credential state와 관계없이 요청을 같은 shape로 접수했습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericAccepted'
    CustomerSessionCreated:
      description: >-
        인증 proof를 확인하고 이전 customer session을 rotate한 뒤 현재 고객 projection을 반환합니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
        Set-Cookie:
          description: >-
            DESKSEED_CUSTOMER_SESSION HttpOnly, Secure-in-production, SameSite=Lax opaque cookie입니다.
            서버에는 digest와 bounded session metadata만 저장합니다.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentCustomer'
    InvalidRequest:
      description: >-
        요청 shape, email/password/profile bounds 또는 control-character 규칙을 만족하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidCustomerIdentityRequestProblem'
    InvalidCustomerCredentials:
      description: >-
        Email/password, account 상태 또는 credential 종류 중 어느 조건인지 구분하지 않는 인증 실패입니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidCustomerCredentialsProblem'
    InvalidOneTimeProof:
      description: >-
        One-time proof의 malformed, purpose mismatch, expiry, replay, continuation mismatch를 구분하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidCustomerOneTimeProofProblem'
    CustomerSessionRequired:
      description: 유효한 current customer session이 필요하며 account 존재나 상태를 추가로 노출하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CustomerSessionRequiredProblem'
    CustomerCsrfRejected:
      description: Current customer session에 귀속된 CSRF proof가 없거나 일치하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CustomerCsrfRejectedProblem'
    CustomerRegistrationConflict:
      description: >-
        Registration intent/account/credential lifecycle가 현재 command와 양립하지 않아 mutation하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CustomerRegistrationConflictProblem'
    AuthenticationRateLimited:
      description: >-
        Purpose/destination/network 인증 요청 budget이 소진되었으며 account 존재 여부는 노출하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CustomerAuthenticationRateLimitedProblem'
    AuthenticationUnavailable:
      description: >-
        Required limiter, credential, token, session, consent, audit 또는 durable intent를 안전하게 저장하지 못해 성공을 반환하지 않습니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CustomerAuthenticationUnavailableProblem'
    Problem:
      description: 고객 identity/claim 자원의 존재를 추가로 노출하지 않는 RFC 9457 문제 응답입니다.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      - companyName
      - acceptedPolicies
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Email verification의 destination이며 response나 routine audit에서 account existence를 드러내지 않습니다.
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: >-
            Unicode와 space를 허용하고 control character를 거부하는 고객 password입니다. Customer-specific
            adaptive hash 전에만 memory에 존재하며 log, audit, response, cache, database 평문에 남지 않습니다.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: 고객 본인 화면과 허용된 지원 projection에서 사용하는 bounded profile 이름입니다.
        companyName:
          type: string
          minLength: 1
          maxLength: 160
          description: >-
            고객 profile PII이며 routine authentication audit, ordinary log, webhook, ticket-list projection에 복사하지 않습니다.
        acceptedPolicies:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: >-
            REGISTRATION context의 현재 published policy key/version 목록입니다. Final verification transaction에서 다시 검증합니다.
          items:
            $ref: '#/components/schemas/AcceptedPolicyVersion'
      description: >-
        Password registration intent에 필요한 email, customer-specific password, profile과 current
        registration consent versions입니다. Email token 단독으로 이 입력을 활성화할 수 없습니다.
      x-deskseed-documentation-review: MANUAL
      example:
        email: mina.kim@example.test
        password: synthetic password example only
        displayName: 김민아
        companyName: 가온상사
        acceptedPolicies:
        - policyKey: terms-of-service
          version: 3
        - policyKey: privacy-policy
          version: 2
    CustomerRegistrationVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
          description: >-
            EMAIL_VERIFICATION purpose로만 소비하는 opaque proof입니다. Browser continuation cookie와 같은 intent여야 합니다.
      description: >-
        Email로 전달된 registration verification proof입니다. Continuation secret는 body가 아니라
        HttpOnly cookie로 제출되며 두 proof 중 하나만으로는 계정을 활성화하지 않습니다.
      x-deskseed-documentation-review: MANUAL
      example:
        token: example-verification-token-not-valid-0000000000000000
    CustomerPasswordSessionRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Generic credential verification에만 사용하고 routine audit에는 raw value를 남기지 않습니다.
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: >-
            고객이 제출한 password입니다. Invalid input도 bounded real-or-dummy adaptive comparison을 거치며 평문을 보존하지 않습니다.
      description: >-
        Password-primary customer session 생성 입력입니다. Account/credential 상태별 failure shape를 구분하지 않습니다.
      x-deskseed-documentation-review: MANUAL
      example:
        email: mina.kim@example.test
        password: synthetic password example only
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Passwordless eligibility를 확인할 destination입니다. Response와 mail decision으로 account/credential state를 노출하지 않습니다.
      description: >-
        Password가 없는 identity의 일회성 login link를 요청합니다. Password account도 같은 generic 202를 받습니다.
      x-deskseed-documentation-review: MANUAL
      example:
        email: mina.kim@example.test
    MagicLinkConsume:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
          description: >-
            PASSWORDLESS_LOGIN purpose로만 한 번 소비하는 opaque proof이며 persistence에는 digest만 남습니다.
      description: >-
        Email로 받은 passwordless login proof를 소비해 customer session을 만들 때 사용하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example:
        token: example-magic-link-token-not-valid-000000000000000000
    PasswordlessRegistrationCompletionRequest:
      type: object
      additionalProperties: false
      required:
      - password
      - displayName
      - companyName
      - acceptedPolicies
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: >-
            Passwordless identity를 ACTIVE_PASSWORD로 전환할 customer-specific password입니다. 평문은 보존하지 않습니다.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: 고객 본인과 허용된 지원 projection에서 사용할 bounded profile 이름입니다.
        companyName:
          type: string
          minLength: 1
          maxLength: 160
          description: Routine authentication metadata에서 제외하는 customer profile PII입니다.
        acceptedPolicies:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Final completion transaction에서 current REGISTRATION policies와 대조할 key/version 목록입니다.
          items:
            $ref: '#/components/schemas/AcceptedPolicyVersion'
      description: >-
        Passwordless session이 password/profile/current consents를 명시적으로 제출해 registration을 완료하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example:
        password: synthetic password example only
        displayName: 김민아
        companyName: 가온상사
        acceptedPolicies:
        - policyKey: terms-of-service
          version: 3
        - policyKey: privacy-policy
          version: 2
    CustomerPasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Password reset eligibility를 확인할 destination이며 generic response와 content-free audit fingerprint를 사용합니다.
      description: >-
        Active password account에만 reset mail intent를 만들되 모든 syntactically valid email에 같은 202를 반환하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example:
        email: mina.kim@example.test
    CustomerPasswordResetConsume:
      type: object
      additionalProperties: false
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
          description: PASSWORD_RESET purpose로만 한 번 소비하는 opaque proof이며 서버에는 digest만 저장합니다.
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: >-
            기존 credential을 대체할 customer-specific password이며 성공 시 credential version 증가와 session revoke를 함께 수행합니다.
      description: >-
        Single-use reset proof로 password를 교체하고 기존 customer session 전체를 revoke하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example:
        token: example-password-reset-token-not-valid-00000000000000
        newPassword: synthetic replacement password only
    AcceptedPolicyVersion:
      type: object
      additionalProperties: false
      required:
      - policyKey
      - version
      properties:
        policyKey:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          description: ADMIN이 만든 immutable customer consent policy의 stable key입니다.
        version:
          type: integer
          minimum: 1
          description: Final transaction에서 current published version과 일치해야 하는 version입니다.
      description: 고객이 명시적으로 제출한 consent policy key와 immutable version reference입니다.
      example:
        policyKey: terms-of-service
        version: 3
    CustomerCsrfToken:
      type: object
      additionalProperties: false
      required:
      - token
      - headerName
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: 현재 customer session에만 귀속되는 opaque CSRF proof입니다.
        headerName:
          type: string
          const: X-CSRF-TOKEN
          description: Customer mutation이 CSRF proof를 전달할 canonical header 이름입니다.
      description: Current customer session의 unsafe HTTP mutation에 필요한 CSRF 계약입니다.
      example:
        token: example-csrf-token-not-valid-0000000000000000000000
        headerName: X-CSRF-TOKEN
    CurrentCustomer:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - companyName
      - verifiedAt
      - credentialState
      - registrationState
      - availableAuthenticationMethods
      properties:
        id:
          type: string
          format: uuid
          description: 현재 customer session에 귀속된 verified Customer의 stable ID입니다.
        email:
          type: string
          format: email
          description: 현재 customer가 검증한 본인 email이며 다른 고객 projection에는 포함하지 않습니다.
        displayName:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Registration completion 전에는 null일 수 있는 고객 profile 이름입니다.
        companyName:
          type:
          - string
          - 'null'
          maxLength: 160
          description: 본인 session에서만 반환하고 routine audit/ticket list에 복사하지 않는 profile PII입니다.
        verifiedAt:
          type: string
          format: date-time
          description: Email ownership proof가 server Clock 기준으로 성공한 시각입니다.
        credentialState:
          $ref: '#/components/schemas/CustomerCredentialState'
        registrationState:
          $ref: '#/components/schemas/CustomerRegistrationState'
        availableAuthenticationMethods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: >-
            현재 identity가 다음 login에서 사용할 수 있는 method이며 password hash/token 상태는 노출하지 않습니다.
          items:
            $ref: '#/components/schemas/CustomerAuthenticationMethod'
      description: >-
        Current customer 본인의 bounded profile 및 credential/registration 상태입니다. Staff/internal/audit 정보는 없습니다.
      example:
        id: 00000000-0000-4000-8000-000000000301
        email: mina.kim@example.test
        displayName: 김민아
        companyName: 가온상사
        verifiedAt: '2026-08-25T03:30:00Z'
        credentialState: PASSWORD
        registrationState: COMPLETE
        availableAuthenticationMethods:
        - PASSWORD
    CustomerCredentialState:
      type: string
      enum:
      - PASSWORDLESS
      - PASSWORD
      description: Password hash나 lifecycle detail을 노출하지 않는 현재 customer credential 종류입니다.
    CustomerRegistrationState:
      type: string
      enum:
      - REGISTRATION_REQUIRED
      - COMPLETE
      description: Passwordless session이 profile/password/current consent completion을 더 요구하는지 나타냅니다.
    CustomerAuthenticationMethod:
      type: string
      enum:
      - MAGIC_LINK
      - PASSWORD
      description: 현재 identity에 허용된 다음 login method입니다. Password account에는 MAGIC_LINK를 반환하지 않습니다.
    ClaimRequest:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - requestAccessToken
      - required:
        - claimToken
      properties:
        requestAccessToken:
          type: string
          minLength: 32
          maxLength: 1000
          writeOnly: true
          description: 익명 문의 생성 시 받은 ticket-scoped opaque capability입니다.
        claimToken:
          type: string
          minLength: 32
          maxLength: 1000
          writeOnly: true
          description: Request access token에서 교환한 ticket/email-bound short-lived signed capability입니다.
      description: >-
        익명 문의를 현재 verified customer에 연결할 ticket-specific proof입니다. 두 값 중 정확히 하나만 제출합니다.
      x-deskseed-documentation-review: MANUAL
      example:
        requestAccessToken: example-request-access-token-not-valid-00000000000000
    ClaimGrant:
      type: object
      additionalProperties: false
      required:
      - claimToken
      - expiresAt
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 1000
          description: 현재 ticket/email fingerprint에만 사용할 single-use signed capability입니다.
        expiresAt:
          type: string
          format: date-time
          description: Server Clock 기준으로 claimToken이 더 이상 유효하지 않은 시각입니다.
      description: Request access proof와 교환한 ticket-bound 단기 claim 권한입니다.
      example:
        claimToken: example-claim-token-not-valid-000000000000000000000
        expiresAt: '2026-08-25T03:45:00Z'
    GenericAccepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          type: boolean
          const: true
          description: Account 존재나 mail 발송 여부를 나타내지 않고 요청 접수만 확인합니다.
      description: Enumeration-safe authentication request의 고정 응답입니다.
      example:
        accepted: true
    InvalidCustomerIdentityRequestProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - requestId
      properties:
        type:
          type: string
          const: /problems/customer-identity-request-invalid
          description: Identity request shape/bounds 오류의 stable problem type입니다.
        title:
          type: string
          const: 고객 인증 요청을 처리할 수 없습니다
          description: Account 존재나 field 원문을 반사하지 않는 고정 제목입니다.
        status:
          type: integer
          const: 400
          description: HTTP status와 일치하는 정수입니다.
        requestId:
          type: string
          maxLength: 128
          description: 보호된 server log와 correlation할 bounded request ID입니다.
      description: Invalid identity input을 content-free하게 표현하는 RFC 9457 problem입니다.
      example:
        type: /problems/customer-identity-request-invalid
        title: 고객 인증 요청을 처리할 수 없습니다
        status: 400
        requestId: req-example-identity-invalid
    InvalidCustomerCredentialsProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - requestId
      properties:
        type:
          type: string
          const: /problems/customer-credentials-invalid
          description: 모든 password credential failure가 공유하는 stable problem type입니다.
        title:
          type: string
          const: 고객 인증 정보를 확인할 수 없습니다
          description: Unknown/wrong/disabled/passwordless/incomplete 상태를 구분하지 않는 제목입니다.
        status:
          type: integer
          const: 401
          description: HTTP status와 일치하는 정수입니다.
        requestId:
          type: string
          maxLength: 128
          description: 보호된 server log와 correlation할 bounded request ID입니다.
      description: Password login enumeration을 막는 고정 RFC 9457 problem입니다.
      example:
        type: /problems/customer-credentials-invalid
        title: 고객 인증 정보를 확인할 수 없습니다
        status: 401
        requestId: req-example-credentials-invalid
    InvalidCustomerOneTimeProofProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - requestId
      properties:
        type:
          type: string
          const: /problems/customer-one-time-proof-invalid
          description: Purpose/expiry/replay/mismatch를 구분하지 않는 stable problem type입니다.
        title:
          type: string
          const: 고객 확인 정보를 사용할 수 없습니다
          description: Token 원문이나 failure reason을 반사하지 않는 고정 제목입니다.
        status:
          type: integer
          const: 401
          description: HTTP status와 일치하는 정수입니다.
        requestId:
          type: string
          maxLength: 128
          description: 보호된 server log와 correlation할 bounded request ID입니다.
      description: One-time proof의 구체적 상태를 숨기는 RFC 9457 problem입니다.
      example:
        type: /problems/customer-one-time-proof-invalid
        title: 고객 확인 정보를 사용할 수 없습니다
        status: 401
        requestId: req-example-proof-invalid
    CustomerSessionRequiredProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - requestId
      properties:
        type:
          type: string
          const: /problems/customer-session-required
          description: Customer session 부재/만료의 stable problem type입니다.
