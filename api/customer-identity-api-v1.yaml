openapi: 3.1.0
info:
  title: Deskseed Customer Identity API v1
  version: 1.0.0-contract
  description: Deskseed의 커밋된 OpenAPI 3.1 계약입니다. API 목적과 데이터 경계는 한국어로 설명하며 예시는 모두 합성 데이터입니다. 실제 비밀번호, 세션, API key 또는 고객 정보를
    문서에 입력하거나 저장하지 마세요.
  x-deskseed-status: implementation-ready
servers:
- url: http://localhost:8080
security: []
tags:
- name: Customer Identity
  description: 이메일 매직 링크, 고객 세션, CSRF, 익명 문의 연결을 처리하는 API입니다.
paths:
  /api/v1/customer/auth/magic-link-requests:
    post:
      tags:
      - Customer Identity
      operationId: requestCustomerMagicLink
      summary: 고객 로그인용 일회성 링크 요청
      description: '고객 로그인용 일회성 링크 요청 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다. 기존 계약의
        세부 조건: For every syntactically valid email, including unknown and rate-limited destinations, the operation returns
        the same 202 body, cache policy and timing class. Delivery is a durable outbound-mail intent and account existence
        is not exposed in the response, audit or logs.'
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Generic accepted response regardless of account existence'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/customer/auth/magic-link-sessions:
    post:
      tags:
      - Customer Identity
      operationId: consumeCustomerMagicLink
      summary: 일회성 링크로 고객 세션 생성
      description: '일회성 링크로 고객 세션 생성 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다. 기존 계약의
        세부 조건: The token is accepted only in a JSON request body. Success rotates any presented customer session, creates
        or links a CustomerAccount without changing historical anonymous ticket ownership, and sets a new opaque cookie.'
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      - REQ-AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkConsume'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Token consumed once and server session created'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
            Set-Cookie:
              description: DESKSEED_CUSTOMER_SESSION 쿠키입니다. Path=/, HttpOnly, Secure, SameSite=Lax를 사용하며 서버에는 opaque 값의 digest만
                저장합니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCustomer'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/customer/csrf:
    get:
      tags:
      - Customer Identity
      operationId: getCustomerCsrfToken
      summary: 고객 세션용 CSRF 토큰 발급
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      security:
      - customerSession: []
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: CSRF token for unsafe customer-session operations'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCsrfToken'
        '401':
          $ref: '#/components/responses/Problem'
      description: 고객 세션용 CSRF 토큰 발급 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/customer/session:
    delete:
      tags:
      - Customer Identity
      operationId: deleteCustomerSession
      summary: 현재 고객 세션 종료
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-001
      security:
      - customerSession: []
      parameters:
      - $ref: '#/components/parameters/CustomerCsrfHeader'
      responses:
        '204':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Server session revoked and cookie expired'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 만료 처리된 DESKSEED_CUSTOMER_SESSION 쿠키입니다.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
      description: 현재 고객 세션 종료 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/customer/requests/{ticketNumber}/claim:
    post:
      tags:
      - Customer Identity
      operationId: claimAnonymousCustomerRequest
      summary: 익명 문의를 인증 고객 계정에 연결
      description: '익명 문의를 인증 고객 계정에 연결 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다. 기존
        계약의 세부 조건: Matching email is necessary but never sufficient. Exactly one ticket-specific request access token or signed
        claim token must be supplied. Success consumes or revokes the proof and transfers the existing ticket requester to
        the current customer account atomically with ticket and security audit.'
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-002
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 경로로 전달하는 `ticketNumber` 값입니다.
      - $ref: '#/components/parameters/CustomerCsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '204':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Request linked to the signed-in customer; proof is no longer reusable'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/requests/{ticketNumber}/claim-grants:
    post:
      tags:
      - Customer Identity
      operationId: issueAnonymousRequestClaimGrant
      summary: 문의 접근 토큰을 단기 연결 권한으로 교환
      description: '문의 접근 토큰을 단기 연결 권한으로 교환 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
        기존 계약의 세부 조건: The existing request access token is supplied only in the header. The returned signed token is ticket-bound,
        email-fingerprint-bound, short-lived and single use. No email or bearer token plaintext is persisted or audited.'
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUTH-002
      - REQ-TKT-005
      parameters:
      - name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 경로로 전달하는 `ticketNumber` 값입니다.
      - name: X-Request-Access-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
        description: HTTP 헤더로 전달하는 `X-Request-Access-Token` 값입니다.
      responses:
        '201':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Short-lived signed claim grant issued'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimGrant'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
      description: Opaque HttpOnly, Secure, SameSite=Lax 쿠키입니다. 서버는 digest만 저장하고 정확히 하나의 활성 CustomerAccount로 해석합니다.
  parameters:
    CustomerCsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: opaque 고객 서버 세션에서 파생되어 해당 세션에 귀속되는 토큰입니다.
      schema:
        type: string
        minLength: 32
        maxLength: 256
  responses:
    Problem:
      description: RFC 9457 Problem Details 오류 응답입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: email 값입니다.
          example: customer@example.com
      description: MagicLinkRequest 요청 또는 응답 모델입니다.
      example:
        email: customer@example.com
    MagicLinkConsume:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: 민감한 인증 값입니다. 예시는 사용할 수 없는 합성 값이며 로그나 감사 기록에 저장하면 안 됩니다.
          example: example-token-not-valid-0000000000000000
      description: MagicLinkConsume 요청 또는 응답 모델입니다.
      example:
        token: example-token-not-valid-0000000000000000
    CustomerCsrfToken:
      type: object
      additionalProperties: false
      required:
      - token
      - headerName
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
          description: 민감한 인증 값입니다. 예시는 사용할 수 없는 합성 값이며 로그나 감사 기록에 저장하면 안 됩니다.
          example: example-token-not-valid-0000000000000000
        headerName:
          type: string
          const: X-CSRF-TOKEN
          description: headerName 값입니다.
          example: X-CSRF-TOKEN
      description: CustomerCsrfToken 요청 또는 응답 모델입니다.
      example: example-token-not-valid-0000000000000000
    CurrentCustomer:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - verifiedAt
      properties:
        id:
          type: string
          format: uuid
          description: id 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        email:
          type: string
          format: email
          description: email 값입니다.
          example: customer@example.com
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: displayName에 사용하는 입력 또는 표시 문자열입니다.
          example: 김고객
        verifiedAt:
          type: string
          format: date-time
          description: UTC 기준 ISO 8601 시각입니다.
          example: '2026-08-10T09:00:00Z'
      description: CurrentCustomer 요청 또는 응답 모델입니다.
      example:
        id: 11111111-1111-4111-8111-111111111111
        email: customer@example.com
        displayName: 김고객
        verifiedAt: '2026-08-10T09:00:00Z'
    ClaimRequest:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - requestAccessToken
      - required:
        - claimToken
      properties:
        requestAccessToken:
          type: string
          minLength: 32
          maxLength: 1000
          description: 민감한 인증 값입니다. 예시는 사용할 수 없는 합성 값이며 로그나 감사 기록에 저장하면 안 됩니다.
          example: example-token-not-valid-0000000000000000
        claimToken:
          type: string
          minLength: 32
          maxLength: 1000
          description: 민감한 인증 값입니다. 예시는 사용할 수 없는 합성 값이며 로그나 감사 기록에 저장하면 안 됩니다.
          example: example-token-not-valid-0000000000000000
      description: ClaimRequest 요청 또는 응답 모델입니다.
      example:
        requestAccessToken: example-token-not-valid-0000000000000000
        claimToken: example-token-not-valid-0000000000000000
    ClaimGrant:
      type: object
      additionalProperties: false
      required:
      - claimToken
      - expiresAt
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 1000
          description: 민감한 인증 값입니다. 예시는 사용할 수 없는 합성 값이며 로그나 감사 기록에 저장하면 안 됩니다.
          example: example-token-not-valid-0000000000000000
        expiresAt:
          type: string
          format: date-time
          description: UTC 기준 ISO 8601 시각입니다.
          example: '2026-08-10T09:00:00Z'
      description: ClaimGrant 요청 또는 응답 모델입니다.
      example:
        claimToken: example-token-not-valid-0000000000000000
        expiresAt: '2026-08-10T09:00:00Z'
    GenericAccepted:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          type: boolean
          const: true
          description: accepted 값입니다.
          example: true
      description: GenericAccepted 요청 또는 응답 모델입니다.
      example:
        accepted: true
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          description: type 값입니다.
          example: https://orders.example.com/orders/ORD-2026-1042
        title:
          type: string
          description: title 값입니다.
          example: 결제가 중복으로 처리됐어요
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: status의 허용된 열거 값입니다.
          example: 400
        detail:
          type: string
          description: detail에 사용하는 입력 또는 표시 문자열입니다.
          example: 예시 값
        requestId:
          type: string
          description: requestId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
      description: Problem 요청 또는 응답 모델입니다.
      example:
        type: https://orders.example.com/orders/ORD-2026-1042
        title: 결제가 중복으로 처리됐어요
        status: 400
        detail: 예시 값
        requestId: 11111111-1111-4111-8111-111111111111
