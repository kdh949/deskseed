          $ref: '#/components/schemas/TicketStatus'
        accessToken:
          type: string
          description: 익명·인증 모드 모두 생성 시에만 반환하는 티켓 범위 조회·연결 복구 토큰입니다. 서버는 digest만 저장하고 소유권이 명시적으로 연결되면 활성 토큰을 폐기합니다.
