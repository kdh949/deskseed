        triggerId:
          type: string
          format: uuid
          description: 평가한 immutable version의 aggregate UUID입니다.
        triggerVersion:
          type: integer
          description: 조건과 proposed action을 공급한 immutable version입니다.
        matched:
          type: boolean
          description: ALL/ANY 결합 규칙을 적용한 최종 조건 결과입니다.
        matchedConditions:
          type: array
          items:
            type: integer
          description: 저장 ordinal 기준으로 참이 된 조건 위치입니다.
        unmatchedConditions:
          type: array
          items:
            type: integer
          description: 저장 ordinal 기준으로 거짓이 된 조건 위치입니다.
        proposedActions:
          type: array
          items:
            type: string
            enum:
            - SET_GROUP
            - ENQUEUE_WEBHOOK
          description: matched일 때 worker가 순서대로 시도할 typed action 종류입니다.
        invariantFailures:
          type: array
          items:
            type: string
          description: 비활성 target group처럼 실제 실행 전에 해결해야 하는 bounded 오류 코드입니다.
  x-deskseed-realtime-protocol-v1:
    endpoint: /ws/agent/collaboration
    description: 인증된 staff session이 같은 출처에서 연결하는 version 1 협업 WebSocket 계약입니다. 연결과 재연결마다 세션·Origin·티켓 읽기 권한을 다시 확인하며 INTERNAL
