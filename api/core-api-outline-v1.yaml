      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          description: 이 aggregate 안에 이미 존재하고 target group 검증을 통과해야 하는 version입니다.
      example:
        version: 1
    TriggerPositionRequest:
      type: object
      description: 현재 정의와 목표 position 점유 정의를 원자적으로 교환해 ordered evaluation을 바꿉니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - position
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 10000
          description: 교환 후 현재 트리거가 차지할 고유 평가 위치입니다.
      example:
        position: 20
    TriggerDryRunRequest:
      type: object
      description: 지정 ticket을 바꾸지 않고 선택한 event boundary에서 조건과 action invariant를 설명합니다.
