components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: DESKSEED_SESSION
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          type: integer
          format: int64
        conflictingFields:
          type: array
          items:
            type: string
      additionalProperties: true
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    CreateAnonymousRequest:
      type: object
      required:
      - name
      - email
      - subject
      - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 20000
        privacyConsent:
          type: boolean
    CreateAnonymousRequestResult:
      type: object
      required:
      - ticketNumber
      - accessToken
      - createdAt
      properties:
        ticketNumber:
          type: integer
          format: int64
        accessToken:
          type: string
          description: Returned only at creation; server stores a hash.
        createdAt:
          type: string
          format: date-time
    AddCustomerComment:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
    PublicComment:
      type: object
      required:
      - id
      - authorDisplayName
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        authorDisplayName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PublicAttachment'
    PublicAttachment:
      type: object
      required:
      - id
      - fileName
      - sizeBytes
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        downloadUrl:
          type: string
          format: uri
    CustomerRequestDetail:
      type: object
      required:
      - ticketNumber
      - subject
      - status
      - createdAt
      - updatedAt
      - comments
      properties:
        ticketNumber:
          type: integer
          format: int64
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
    CustomerRequestPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerRequestDetail'
        nextCursor:
          type:
          - string
          - 'null'
    StaffLogin:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    CurrentStaff:
      type: object
      required:
      - id
      - displayName
      - roles
      - capabilities
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
    SavedView:
      type: object
      required:
      - key
      - name
      - scope
      properties:
        key:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - PERSONAL
          - SHARED
          - SYSTEM
        categoryPath:
          type: array
          items:
            type: string
        ticketCount:
          type:
          - integer
          - 'null'
    TicketStatus:
      type: string
      enum:
      - NEW
      - OPEN
      - PENDING
      - SOLVED
    TicketPriority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    TicketVisibility:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
    ActorSummary:
      type: object
      required:
      - type
      - displayName
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        type:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - INTEGRATION_CLIENT
          - TRIGGER
          - AUTOMATION
          - SYSTEM
        displayName:
          type: string
    TicketSummary:
      type: object
      required:
      - ticketNumber
      - subject
      - status
      - priority
      - requester
      - updatedAt
      - version
      properties:
        ticketNumber:
          type: integer
          format: int64
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        requester:
          $ref: '#/components/schemas/ActorSummary'
        group:
          $ref: '#/components/schemas/GroupRef'
        assignee:
          $ref: '#/components/schemas/StaffRef'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        isChild:
          type: boolean
        openChildCount:
          type: integer
        sla:
          $ref: '#/components/schemas/SlaBadge'
    TicketSummaryPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        nextCursor:
          type:
          - string
          - 'null'
        totalApproximate:
          type:
          - integer
          - 'null'
          format: int64
    StaffRef:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    GroupRef:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SlaBadge:
      type:
      - object
      - 'null'
      properties:
        metric:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - AT_RISK
          - ACHIEVED
          - BREACHED
        dueAt:
          type: string
          format: date-time
    AgentComment:
      type: object
      required:
      - id
      - visibility
      - actor
      - body
      - createdAt
      - source
      properties:
        id:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/TicketVisibility'
        actor:
          $ref: '#/components/schemas/ActorSummary'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        source:
          type: string
        redactionState:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PublicAttachment'
    AgentTicketDetail:
      type: object
      required:
      - ticket
      - comments
      - capabilities
      - context
      properties:
        ticket:
          $ref: '#/components/schemas/TicketSummary'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AgentComment'
        capabilities:
          type: array
          items:
            type: string
        context:
          $ref: '#/components/schemas/TicketContext'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CommandWarning'
    TicketContext:
      type: object
      properties:
        customer:
          type: object
          additionalProperties: true
        parent:
          $ref: '#/components/schemas/TicketSummary'
        children:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        externalReferences:
          type: array
          items:
            type: object
            additionalProperties: true
    CommentDraft:
      type: object
      required:
      - visibility
      - body
      properties:
        visibility:
          $ref: '#/components/schemas/TicketVisibility'
        body:
          type: string
          minLength: 1
          maxLength: 20000
    TicketPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 200
    UpdateTicketCommand:
      type: object
      required:
      - expectedVersion
      - changedFields
      properties:
        expectedVersion:
          type: integer
          format: int64
        changedFields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - subject
            - status
            - priority
            - group
            - assignee
        patch:
          $ref: '#/components/schemas/TicketPatch'
        comment:
          $ref: '#/components/schemas/CommentDraft'
        clientCommandId:
          type: string
          format: uuid
    TransferTicketCommand:
      type: object
      required:
      - expectedVersion
      - groupId
      properties:
        expectedVersion:
          type: integer
          format: int64
        groupId:
          type: string
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type:
          - string
          - 'null'
          maxLength: 2000
        clientCommandId:
          type: string
          format: uuid
    CreateChildTicketCommand:
      type: object
      required:
      - expectedVersion
      - subject
      - body
      - groupId
      - priority
      properties:
        expectedVersion:
          type: integer
          format: int64
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        groupId:
          type: string
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        priority:
          $ref: '#/components/schemas/TicketPriority'
        clientCommandId:
          type: string
          format: uuid
    CommandWarning:
