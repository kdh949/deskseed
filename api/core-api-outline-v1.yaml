        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: DESKSEED_SESSION
      description: HttpOnly 서버 세션입니다. 브라우저 요청은 선택적인 ExpectedStaffActorHeader 일관성 guard도 사용하지만, 이 헤더는 자격 증명이 아니며 인증 actor를
        결정하지 않습니다.
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: getStaffCsrfToken이 반환하며 브라우저 세션에 귀속되는 토큰입니다.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    CustomerCsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: getCustomerCsrfToken이 반환하며 현재 customerSession에 귀속되는 토큰입니다. 세션 cookie 원문이나 이 토큰은 로그 또는 감사 메타데이터에 저장하지 않습니다.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    ExpectedStaffActorHeader:
      name: X-Deskseed-Expected-Staff-Id
      in: header
      required: false
      description: staffSession 작업을 위한 심층 방어용 브라우저 일관성 guard입니다. 전달할 때는 이미 인증된 세션 주체와 같은 하나의 정규 UUID여야 합니다. 생략은 호환되지만 형식 오류나
        중복은 InvalidExpectedStaffActor, 불일치는 Controller 실행·감사 성공·변경·세션 활동 갱신 전에 StaffSessionActorMismatch를 반환합니다. 로그인 시작과 로그인
        직후 신원 확인에서는 의도적으로 생략합니다.
      schema:
        type: string
        format: uuid
    AdminPageNumber:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호입니다.
      schema:
        type: integer
        minimum: 0
        default: 0
    AdminPageSize:
      name: size
      in: query
      required: false
      description: 관리자 목록 응답 한 페이지에서 반환할 수 있는 제한된 행 수입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IntegrationClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemIfMatch:
      name: If-Match
      in: header
      required: true
      description: 외부 시스템용 ETag이며 expectedVersion과 같은 버전을 가리켜야 합니다.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    StaffId:
      name: staffId
      in: path
      required: true
