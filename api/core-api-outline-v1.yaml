        operator:
          type: string
          enum:
          - IS
          - IS_NOT
          - PRESENT
          - NOT_PRESENT
          description: field별 allowlist 검증으로 SQL이나 표현식 실행 가능성을 차단합니다.
        value:
          type:
          - string
          - 'null'
          maxLength: 120
          description: IS 계열에는 enum 이름을 전달하고 presence 계열에서는 반드시 생략합니다.
    TriggerAction:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - SET_GROUP
          - ENQUEUE_WEBHOOK
          description: 초기 vertical slice가 normal command 또는 outbox로 번역할 수 있는 액션만 허용합니다.
        groupId:
          type:
          - string
          - 'null'
          format: uuid
