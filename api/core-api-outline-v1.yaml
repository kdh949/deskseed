openapi: 3.1.0
info:
  title: Deskseed Core API Outline
  version: 0.6.0-implementation-ready
  description: Customer, staff, admin, audit, customer magic-link, and schedule/SLA contract. Blueprint-only operations remain
    marked by phase and requirement status.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Customer Requests
- name: Customer Portal
- name: Staff Session
- name: Agent Views
- name: Agent Tickets
- name: Agent Search
- name: Admin
- name: Audit
- name: Customer Auth
- name: Admin Schedule
- name: Admin SLA
paths:
  /api/v1/requests:
    post:
      summary: Submit an anonymous customer request
      operationId: createAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-001
      - REQ-TKT-002
      - REQ-TKT-006
      - REQ-AUD-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
            example:
              name: 홍길동
              email: customer@example.com
              subject: 결제가 되지 않아요
              message: 결제 버튼을 누르면 오류가 발생합니다.
              privacyConsent: true
      x-deskseed-generic-problem: &id001
        description: RFC 9457 Problem Details
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
      x-deskseed-no-store-problem: &anonymousRequestProblem
        <<: *id001
        headers:
          Cache-Control:
            description: Always `no-store` because this capability-protected surface can contain customer data.
            schema:
              type: string
              enum: [no-store]
      responses:
        '201':
          description: Request created
          headers:
            Cache-Control:
              description: Always `no-store` because the response contains a one-time access token.
              schema:
                type: string
                enum: [no-store]
            Location:
              description: Customer-safe request URL; the access token is not embedded.
              schema:
                type: string
            Cache-Control:
              description: Always `no-store` because the response contains the one-time access token.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousRequestResult'
              example:
                ticketNumber: 1001
                status: NEW
                accessToken: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU
                createdAt: '2026-08-10T00:00:00Z'
        '400': *anonymousRequestProblem
        '409': *anonymousRequestProblem
        '429': *anonymousRequestProblem
        '503': *anonymousRequestProblem
        '500': *anonymousRequestProblem
  /api/v1/requests/{ticketNumber}:
    get:
      summary: Read a customer-safe request projection
      operationId: getAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-008
      parameters:
      - &id002
        name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &id003
        name: X-Request-Access-Token
        in: header
        required: true
        description: Opaque ticket-scoped token returned only by request creation.
        schema:
          type: string
          minLength: 32
          maxLength: 256
      responses:
        '200':
          description: Public request detail
          headers:
            Cache-Control:
              description: Always `no-store` because the response contains customer content.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
              example:
                ticketNumber: 1001
                subject: 결제가 되지 않아요
                status: NEW
                createdAt: '2026-08-10T00:00:00Z'
                updatedAt: '2026-08-10T00:00:00Z'
                comments:
                - id: 9cc38543-3937-4aa1-a34e-ef45f7b606f8
                  authorDisplayName: 고객
                  body: 결제 버튼을 누르면 오류가 발생합니다.
                  createdAt: '2026-08-10T00:00:00Z'
        '400': *anonymousRequestProblem
        '404':
          description: The ticket/token pair is absent, expired, revoked, or invalid.
          headers:
            Cache-Control:
              description: Always `no-store` because this capability-protected surface can contain customer data.
              schema:
                type: string
                enum: [no-store]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/request-not-found
                title: Request not found
                status: 404
                detail: The ticket number and access token do not identify a visible request.
                instance: /api/v1/requests/1001
                requestId: 9f3c4bbc-e78c-4a12-8673-7e39821e591f
        '429': *anonymousRequestProblem
        '503': *anonymousRequestProblem
  /api/v1/requests/{ticketNumber}/comments:
    post:
      summary: Add a public customer follow-up
      operationId: addCustomerRequestComment
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      - REQ-TKT-008
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400': *anonymousRequestProblem
        '404': *anonymousRequestProblem
        '409': *anonymousRequestProblem
        '429': *anonymousRequestProblem
  /api/v1/customer/requests:
    get:
      summary: List requests for a verified customer account
      operationId: listCustomerRequests
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestPage'
        '401': *id001
  /api/v1/agent/csrf:
    get:
      summary: Issue a CSRF token bound to the browser session
      operationId: getStaffCsrfToken
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      security: []
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      responses:
        '200':
          description: CSRF token
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: HttpOnly staff session cookie; Secure in production and SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/v1/agent/session:
    post:
      summary: Create a staff session
      operationId: createStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      - REQ-AUTH-006
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
      responses:
        '204':
          description: Session created
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Lax; Secure in production; idle 60 minutes and absolute 12 hours.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '429': *id001
    delete:
      summary: Destroy the current staff session
      operationId: deleteStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session destroyed
        '401': *id001
  /api/v1/agent/me:
    get:
      summary: Read current staff identity and capabilities
      operationId: getCurrentStaff
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      responses:
        '200':
          description: Current staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStaff'
        '401': *id001
  /api/v1/agent/views:
    get:
      summary: List accessible saved views
      operationId: listAgentViews
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-PERM-001
      security:
      - staffSession: []
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
        '401': *id001
        '403': *id001
  /api/v1/agent/views/{viewKey}/tickets:
    get:
      summary: List tickets in a saved view
      operationId: listTicketsInView
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-TKT-010
      - REQ-PERM-001
      security:
      - staffSession: []
      parameters:
      - name: viewKey
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Opaque, versioned HMAC-signed keyset cursor bound to this view and filters.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: sort
        in: query
        description: Fixed stable ordering. Other values are rejected.
        schema:
          type: string
          enum:
          - updatedAt:desc,ticketNumber:desc
          default: updatedAt:desc,ticketNumber:desc
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AgentTicketStatus'
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/TicketPriority'
      - name: groupId
        in: query
        schema:
          type: string
          format: uuid
      - name: assigneeId
        in: query
        description: UUID, `me`, or `unassigned`.
        schema:
          type: string
          pattern: '^(me|unassigned|[0-9a-fA-F-]{36})$'
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummaryPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/agent/tickets:
    post:
      summary: Create a staff-originated ticket
      operationId: createAgentTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-009
      - REQ-TKT-006
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTicket'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}:
    get:
      summary: Read an agent ticket projection
      operationId: getAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      - REQ-AUD-003
      - REQ-UI-003
      security:
      - staffSession: []
      parameters:
      - *id002
      - &id005
        name: X-Interaction-Id
        in: header
        required: true
        description: Semantic user interaction identifier; background revalidation reuses the same value.
        schema:
          type: string
          format: uuid
      - name: X-Deskseed-Read-Intent
        in: header
        required: true
        description: "Every successful detail read records a required resource-read audit. NAVIGATION additionally records one deduplicated semantic view; BACKGROUND never records a semantic view."
        schema:
          type: string
          enum:
          - NAVIGATION
          - BACKGROUND
      - name: X-Origin-Search-Event-Id
        in: header
        required: false
        description: "Canonical SEARCH_EXECUTED event selected by a search-result navigation. Accepted only for NAVIGATION reads by the same staff actor; successful use records SEARCH_RESULT_OPENED and links TICKET_VIEWED to the search event."
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Agent ticket detail
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTicketDetail'
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}/commands:
    post:
      summary: Apply one atomic ticket update command
      description: INTERNAL_CHILD tickets accept INTERNAL comments only; attempts to add a PUBLIC comment are rejected without mutation or audit.
      operationId: updateAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-010
      - REQ-TKT-013
      - REQ-TKT-014
      - REQ-CHILD-002
      - REQ-AUD-001
      security:
      - staffSession: []
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketCommand'
      responses:
        '200':
          description: Command applied
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409':
          description: Requested fields overlap changes committed after expectedVersion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketFieldConflictProblem'
              example:
                type: /problems/ticket-field-conflict
                title: Ticket fields changed concurrently
                status: 409
                detail: Some fields were changed by another actor.
                requestId: req-123
                currentVersion: 14
                conflictingFields:
                - assigneeId
        '422': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}/transfer:
    post:
      summary: Transfer ticket ownership to a group or agent
      operationId: transferAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M4
      x-deskseed-requirements:
      - REQ-TKT-011
      - REQ-TKT-012
      - REQ-AUD-001
      - REQ-AUD-007
      security:
      - staffSession: []
      parameters:
      - *id002
      - &id004
        name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: '^"?[0-9]+"?$'
        description: Ticket ETag returned by the latest audited staff read. It must identify the same version as `expectedVersion`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTicketCommand'
      responses:
        '200':
          description: Transfer applied
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '412':
          description: The ticket no longer matches the supplied If-Match and expectedVersion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketVersionPreconditionProblem'
        '422': *id001
  /api/v1/agent/tickets/{ticketNumber}/children:
    post:
      summary: Create an internal child ticket
      operationId: createChildTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M5
      x-deskseed-requirements:
      - REQ-CHILD-001
      - REQ-CHILD-002
      - REQ-CHILD-003
      - REQ-CHILD-004
      - REQ-CHILD-006
      - REQ-CHILD-007
      - REQ-AUD-001
      - REQ-AUD-007
      security:
      - staffSession: []
      parameters:
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildTicketCommand'
      responses:
        '201':
          description: Child created
          headers:
            ETag:
              description: Parent ticket ETag after the relation audit is committed.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildTicketResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '412':
          description: The parent no longer matches the supplied If-Match and expectedVersion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketVersionPreconditionProblem'
        '422': *id001
  /api/v1/agent/tickets/{ticketNumber}/audits:
    get:
      summary: Read ticket-local change history
      operationId: listTicketAudits
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-AUD-001
      security:
      - staffSession: []
      parameters:
      - *id002
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAuditPage'
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/agent/search:
    post:
      summary: Search accessible tickets without placing the raw query in the URL
      operationId: searchAgentWorkspace
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Search
      x-deskseed-phase: R1
      x-deskseed-requirements:
      - REQ-AUD-003
      - REQ-AUD-004
      - REQ-AUD-005
      - REQ-AUD-008
      - REQ-PERM-001
      - REQ-SRCH-001
      security:
      - staffSession: []
      parameters:
      - *id005
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTicketSearchRequest'
      responses:
        '200':
          description: Authorized ticket search results returned only after the canonical SEARCH_EXECUTED event commits.
          headers:
            Cache-Control:
              description: Always no-store because the result is a protected staff projection.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTicketSearchPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '503': *id001
  /api/v1/admin/staff:
    get:
      summary: List staff accounts
      operationId: listStaffAccounts
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PERM-002
      security:
      - staffSession: []
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccount'
        '401': *id001
        '403': *id001
    post:
      summary: Create a staff account
      operationId: createStaffAccount
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PERM-002
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAccount'
      responses:
        '201':
          description: Staff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/admin/staff/{staffId}:
    delete:
      summary: Disable a staff account
      operationId: disableStaffAccount
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-AUTH-005
      - REQ-PERM-002
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/StaffId'
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Staff disabled and their sessions become unusable on the next protected request
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
  /api/v1/admin/groups:
    get:
      summary: List groups
      operationId: listGroups
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PERM-002
      - REQ-TKT-011
      security:
      - staffSession: []
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401': *id001
        '403': *id001
    post:
      summary: Create a group
      operationId: createGroup
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PERM-002
      - REQ-TKT-011
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroup'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/admin/groups/{groupId}:
    patch:
      summary: Rename a support group
      operationId: updateGroup
      x-deskseed-contract-status: FROZEN
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PERM-002
      - REQ-TKT-011
      security:
