          format: int64
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        groupId:
          type: string
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        priority:
          $ref: '#/components/schemas/TicketPriority'
        clientCommandId:
          type: string
          format: uuid
    CommandWarning:
