        type: integer
        minimum: 0
  responses:
    InvalidExpectedStaffActor:
      description: 선택적인 직원 actor 확인 헤더가 전달됐지만 하나의 정규 UUID 값이 아닙니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
          example:
            type: /problems/invalid-staff-session-actor
            title: Invalid staff session actor
            status: 400
            detail: The expected staff actor header is invalid.
            requestId: req-actor-400
    StaffSessionActorMismatch:
      description: 브라우저가 확인한 actor와 인증된 세션 주체가 다릅니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
          example:
            type: /problems/staff-session-actor-mismatch
            title: Staff session actor changed
            status: 409
            detail: Refresh the staff session before continuing.
            requestId: req-actor-409
    InvalidExpectedStaffActorOrBadRequest:
      description: 정규 UUID가 아닌 expected-actor 헤더를 포함한 RFC 9457 요청 검증 실패 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            invalidExpectedStaffActor:
              value:
                type: /problems/invalid-staff-session-actor
                title: Invalid staff session actor
                status: 400
                detail: The expected staff actor header is invalid.
                requestId: req-actor-400
    StaffSessionActorMismatchOrConflict:
      description: 브라우저가 확인한 actor와 인증 세션 주체가 다른 경우를 포함한 RFC 9457 비즈니스 충돌 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            staffSessionActorMismatch:
              value:
                type: /problems/staff-session-actor-mismatch
                title: Staff session actor changed
                status: 409
                detail: Refresh the staff session before continuing.
                requestId: req-actor-409
    Problem:
      description: 권한, validation, lifecycle, version, audit persistence 실패를 RFC 9457 problem detail로 반환합니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
