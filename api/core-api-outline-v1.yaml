        eventType:
          type:
          - string
          - 'null'
          enum:
          - ticket.trigger.executed
          - null
          description: webhook 구독자에게 전달 가능한 고정 public event type이며 임의 payload template은 받지 않습니다.
    TriggerDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - position
      - currentVersion
      - aggregateVersion
      - conditions
      - actions
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: definition과 immutable history를 함께 식별하는 UUID입니다.
        name:
          type: string
          description: 응답에 선택된 version에서 snapshot된 운영 이름입니다.
        position:
          type: integer
          description: ticket event job이 version snapshot을 구성할 때 사용하는 deterministic 순서입니다.
        currentVersion:
          type: integer
          description: 가장 최근에 작성한 immutable definition version입니다.
        activeVersion:
          type:
          - integer
          - 'null'
          description: 새 ticket event job에 포함되는 version이며 null이면 실행 대상이 아닙니다.
        aggregateVersion:
          type: integer
          format: int64
          description: 관리 mutation의 If-Match 비교와 ETag 발급에만 사용하는 aggregate counter입니다.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerCondition'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TriggerAction'
        createdAt:
          type: string
          format: date-time
          description: definition aggregate가 최초로 저장된 서버 시각입니다.
        updatedAt:
          type: string
          format: date-time
          description: version·activation·position mutation이 마지막으로 commit된 서버 시각입니다.
    TriggerDryRunResult:
