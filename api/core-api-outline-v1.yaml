    delete:
      summary: 시간 기반 자동화 비활성화
      description: 다음 scan에서 새 candidate 생성을 중단하되 이미 실행된 history와 candidate identity는 보존합니다.
      operationId: deactivateAutomation
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUT-002
      tags:
