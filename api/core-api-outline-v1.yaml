      - message
      - count
      - relatedTicketNumbers
      properties:
        code:
          type: string
        message:
          type: string
        count:
          type: integer
          minimum: 1
        relatedTicketNumbers:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
    TicketCommandResult:
      type: object
      required:
      - ticketNumber
      - version
      - auditId
      - warnings
      properties:
        ticketNumber:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        auditId:
          type: string
          format: uuid
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CommandWarning'
        ticket:
          $ref: '#/components/schemas/TicketSummary'
    CreateAgentTicket:
      type: object
      additionalProperties: false
      required:
      - requester
      - subject
      - firstComment
      - priority
      properties:
        requester:
          type: object
          additionalProperties: false
          required:
          - name
          - email
          properties:
