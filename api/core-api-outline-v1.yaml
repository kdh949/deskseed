openapi: 3.1.0
info:
  title: Deskseed Core API Outline
  version: 0.6.0-implementation-ready
  description: >-
    Customer, staff, admin, audit, customer magic-link, and schedule/SLA contract.
    Blueprint-only operations remain marked by phase and requirement status. Every
    implemented operation secured by staffSession exposes the optional
    X-Deskseed-Expected-Staff-Id consistency header defined below. The header never
    selects or authenticates an actor: the server compares it with the validated
    session principal before controller execution or session activity renewal.
x-deskseed-staff-actor-consistency:
  appliesTo: every operation whose security includes staffSession
  implementedOperationBinding: >-
    Implemented operations carry the parameter and 400/409 responses directly so
    OpenAPI generators and contract checks can discover them without interpreting
    this extension.
  blueprintOnlyBinding: >-
    Blueprint-only staffSession operations inherit this policy extension and receive
    the standard operation-level bindings when their contracts are frozen for
    implementation.
  blueprintOnlyOperationIds:
  - listTicketAudits
  - getAdminSetting
  - updateAdminSetting
  - listBusinessSchedules
  - createBusinessSchedule
  - getBusinessSchedule
  - versionBusinessSchedule
  - previewBusinessSchedule
  - listSlaPolicies
  - createSlaPolicy
  - activateSlaPolicy
  parameter:
    $ref: '#/components/parameters/ExpectedStaffActorHeader'
  invalidHeaderResponse:
    $ref: '#/components/responses/InvalidExpectedStaffActor'
  actorMismatchResponse:
    $ref: '#/components/responses/StaffSessionActorMismatch'
  establishmentExceptions:
  - getStaffCsrfToken before sign-in; authenticated token acquisition sends the guard
  - createStaffSession
  - getCurrentStaff when verifying a just-created session
  description: >-
    Browser clients omit the header only while establishing and verifying a new
    session. The dual-use getStaffCsrfToken operation accepts the optional header:
    pre-sign-in callers omit it, while an authenticated unsafe workflow sends the same
    actor snapshot that will guard its mutation. Missing headers remain compatible with
    non-browser clients. A present header must be one canonical UUID value. Mismatch
    fails closed without selecting
    the supplied actor, invalidating the server session, renewing last activity, or
    entering the target controller.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Customer Requests
- name: Customer Portal
- name: Staff Session
- name: Agent Views
- name: Agent Tickets
- name: Agent Search
- name: Admin
- name: Integration Admin
- name: Audit
- name: Customer Auth
- name: Admin Schedule
- name: Admin SLA
paths:
  /api/v1/requests:
    post:
      summary: Submit an anonymous customer request
      description: Each submission creates an isolated unverified customer; matching email input never merges or claims an earlier profile.
      operationId: createAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-001
      - REQ-TKT-002
      - REQ-TKT-006
      - REQ-AUD-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
            example:
              name: 홍길동
              email: customer@example.com
              subject: 결제가 되지 않아요
              message: 결제 버튼을 누르면 오류가 발생합니다.
              privacyConsent: true
      x-deskseed-generic-problem: &id001
        description: RFC 9457 Problem Details
        content:
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
      x-deskseed-no-store-problem: &anonymousRequestProblem
        <<: *id001
        headers:
          Cache-Control:
            description: Always `no-store` because this capability-protected surface can contain customer data.
            schema:
              type: string
              enum: [no-store]
      responses:
        '201':
          description: Request created
          headers:
            Cache-Control:
              description: Always `no-store` because the response contains a one-time access token.
              schema:
                type: string
                enum: [no-store]
            Location:
              description: Customer-safe request URL; the access token is not embedded.
              schema:
                type: string
            Cache-Control:
              description: Always `no-store` because the response contains the one-time access token.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousRequestResult'
              example:
                ticketNumber: 1001
                status: NEW
                accessToken: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU
                createdAt: '2026-08-10T00:00:00Z'
        '400': *anonymousRequestProblem
        '409': *anonymousRequestProblem
        '429': *anonymousRequestProblem
        '503': *anonymousRequestProblem
        '500': *anonymousRequestProblem
  /api/v1/requests/{ticketNumber}:
    get:
      summary: Read a customer-safe request projection
      operationId: getAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-008
      parameters:
      - &id002
        name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &id003
        name: X-Request-Access-Token
        in: header
        required: true
        description: Opaque ticket-scoped token returned only by request creation.
        schema:
          type: string
          minLength: 32
          maxLength: 256
      responses:
        '200':
          description: Public request detail
          headers:
            Cache-Control:
              description: Always `no-store` because the response contains customer content.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
              example:
                ticketNumber: 1001
                subject: 결제가 되지 않아요
                status: NEW
                createdAt: '2026-08-10T00:00:00Z'
                updatedAt: '2026-08-10T00:00:00Z'
                comments:
                - id: 9cc38543-3937-4aa1-a34e-ef45f7b606f8
                  authorDisplayName: 고객
                  body: 결제 버튼을 누르면 오류가 발생합니다.
                  createdAt: '2026-08-10T00:00:00Z'
        '400': *anonymousRequestProblem
        '404':
          description: The ticket/token pair is absent, expired, revoked, or invalid.
          headers:
            Cache-Control:
              description: Always `no-store` because this capability-protected surface can contain customer data.
              schema:
                type: string
                enum: [no-store]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/request-not-found
                title: Request not found
                status: 404
                detail: The ticket number and access token do not identify a visible request.
                instance: /api/v1/requests/1001
                requestId: 9f3c4bbc-e78c-4a12-8673-7e39821e591f
        '429': *anonymousRequestProblem
        '503': *anonymousRequestProblem
  /api/v1/requests/{ticketNumber}/comments:
    post:
      summary: Add a public customer follow-up
      operationId: addCustomerRequestComment
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      - REQ-TKT-008
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400': *anonymousRequestProblem
        '404': *anonymousRequestProblem
        '409': *anonymousRequestProblem
        '429': *anonymousRequestProblem
  /api/v1/customer/requests:
    get:
      summary: List requests for a verified customer account
      operationId: listCustomerRequests
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestPage'
        '401': *id001
  /api/v1/agent/csrf:
    get:
      summary: Issue a CSRF token bound to the browser session
      description: >-
        Dual-use endpoint. A pre-sign-in caller omits the expected-actor header. An
        authenticated unsafe workflow supplies its confirmed actor snapshot so a
        cross-tab session change is rejected before the subsequent mutation.
      operationId: getStaffCsrfToken
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      security: []
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: CSRF token
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: HttpOnly staff session cookie; Secure in production and SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/session:
    post:
      summary: Create a staff session
      operationId: createStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      - REQ-AUTH-006
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
      responses:
        '204':
          description: Session created
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=Lax; Secure in production; idle 60 minutes and absolute 12 hours.
              schema:
                type: string
        '400': *id001
        '401': *id001
        '429': *id001
    delete:
      summary: Destroy the current staff session
      operationId: deleteStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '204':
          description: Session destroyed
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/me:
    get:
      summary: Read current staff identity and capabilities
      operationId: getCurrentStaff
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: Current staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStaff'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/views:
    get:
      summary: List accessible saved views
      operationId: listAgentViews
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-PERM-001
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id001
        '403': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/views/{viewKey}/tickets:
    get:
      summary: List tickets in a saved view
      operationId: listTicketsInView
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-TKT-010
      - REQ-PERM-001
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - name: viewKey
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: Opaque, versioned HMAC-signed keyset cursor bound to this view and filters.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: sort
        in: query
        description: Fixed stable ordering. Other values are rejected.
        schema:
          type: string
          enum:
          - updatedAt:desc,ticketNumber:desc
          default: updatedAt:desc,ticketNumber:desc
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AgentTicketStatus'
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/TicketPriority'
      - name: groupId
        in: query
        schema:
          type: string
          format: uuid
      - name: assigneeId
        in: query
        description: UUID, `me`, or `unassigned`.
        schema:
          type: string
          pattern: '^(me|unassigned|[0-9a-fA-F-]{36})$'
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummaryPage'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '401': *id001
        '403': *id001
        '404': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/tickets:
    post:
      summary: Create a staff-originated ticket
      operationId: createAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-009
      - REQ-TKT-006
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTicket'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '401': *id001
        '403': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatchOrConflict'
        '422': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}:
    get:
      summary: Read an agent ticket projection
      operationId: getAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      - REQ-AUD-003
      - REQ-UI-003
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - *id002
      - &id005
        name: X-Interaction-Id
        in: header
        required: true
        description: Semantic user interaction identifier; background revalidation reuses the same value.
        schema:
          type: string
          format: uuid
      - name: X-Deskseed-Read-Intent
        in: header
        required: true
        description: "Every successful detail read records a required resource-read audit. NAVIGATION additionally records one deduplicated semantic view; BACKGROUND never records a semantic view."
        schema:
          type: string
          enum:
          - NAVIGATION
          - BACKGROUND
      - name: X-Origin-Search-Event-Id
        in: header
        required: false
        description: "Canonical SEARCH_EXECUTED event selected by a search-result navigation. Accepted only for NAVIGATION reads by the same staff actor; successful use records SEARCH_RESULT_OPENED and links TICKET_VIEWED to the search event."
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Agent ticket detail
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTicketDetail'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id001
        '403': *id001
        '404': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}/commands:
    post:
      summary: Apply one atomic ticket update command
      description: >-
        INTERNAL_CHILD tickets accept INTERNAL comments only; attempts to add a PUBLIC comment are rejected without mutation or audit.
        When clientCommandId is supplied, an exact retry by the same authenticated staff actor returns the original TicketCommandResult
        without another comment, audit, or version mutation. Reusing that ID for another canonical payload, ticket, or staff ticket
        operation returns /problems/client-command-id-reused.
      operationId: updateAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-010
      - REQ-TKT-013
      - REQ-TKT-014
      - REQ-CHILD-002
      - REQ-AUD-001
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketCommand'
      responses:
        '200':
          description: Command applied, or the stable original result of an exact clientCommandId replay.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '401': *id001
        '403': *id001
        '409':
          description: >-
            Requested fields conflict with a newer version, clientCommandId was reused
            for a different request, or the browser's confirmed actor differs from the
            authenticated session principal.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TicketFieldConflictProblem'
                - $ref: '#/components/schemas/ClientCommandIdReusedProblem'
                - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
              examples:
                fieldConflict:
                  value:
                    type: /problems/ticket-field-conflict
                    title: Ticket fields changed concurrently
                    status: 409
                    detail: Some fields were changed by another actor.
                    requestId: req-123
                    currentVersion: 14
                    conflictingFields:
                    - assigneeId
                clientCommandIdReused:
                  value:
                    type: /problems/client-command-id-reused
                    title: Client command ID was already used
                    status: 409
                    detail: The client command ID identifies a different ticket command.
                    requestId: req-456
                staffSessionActorMismatch:
                  value:
                    type: /problems/staff-session-actor-mismatch
                    title: Staff session actor changed
                    status: 409
                    detail: Refresh the staff session before continuing.
                    requestId: req-actor-409
        '422': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}/transfer:
    post:
      summary: Transfer ticket ownership to a group or agent
      operationId: transferAgentTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M4
      x-deskseed-requirements:
      - REQ-TKT-011
      - REQ-TKT-012
      - REQ-AUD-001
      - REQ-AUD-007
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - *id002
      - &id004
        name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: '^"?[0-9]+"?$'
        description: Ticket ETag returned by the latest audited staff read. It must identify the same version as `expectedVersion`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTicketCommand'
      responses:
        '200':
          description: Transfer applied
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '401': *id001
        '403': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatchOrConflict'
        '412':
          description: The ticket no longer matches the supplied If-Match and expectedVersion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketVersionPreconditionProblem'
        '422': *id001
  /api/v1/agent/tickets/{ticketNumber}/children:
    post:
      summary: Create an internal child ticket
      operationId: createChildTicket
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Tickets
      x-deskseed-phase: M5
      x-deskseed-requirements:
      - REQ-CHILD-001
      - REQ-CHILD-002
      - REQ-CHILD-003
      - REQ-CHILD-004
      - REQ-CHILD-006
      - REQ-CHILD-007
      - REQ-AUD-001
      - REQ-AUD-007
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildTicketCommand'
      responses:
        '201':
          description: Child created
          headers:
            ETag:
              description: Parent ticket ETag after the relation audit is committed.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildTicketResult'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '401': *id001
        '403': *id001
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatchOrConflict'
        '412':
          description: The parent no longer matches the supplied If-Match and expectedVersion.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TicketVersionPreconditionProblem'
        '422': *id001
  /api/v1/agent/tickets/{ticketNumber}/external-references:
    get:
      summary: Read safe external-reference context for an authorized staff ticket
      description: >-
        Returns stored-only reference context. This operation never fetches, resolves, or
        redirects through an external URL. It records a required staff resource-read audit
        and never emits semantic TICKET_VIEWED for background tab loading.
      operationId: listAgentTicketExternalReferences
      x-deskseed-contract-status: FROZEN
      tags: [Agent Tickets]
      x-deskseed-phase: I2
      x-deskseed-requirements: [REQ-INT-005, REQ-UI-004]
      security:
      - staffSession: []
