openapi: 3.1.0
info:
  title: Deskseed Core API Outline
  version: 0.6.0-implementation-ready
  description: Deskseed의 커밋된 OpenAPI 3.1 계약입니다. API 목적과 데이터 경계는 한국어로 설명하며 예시는 모두 합성 데이터입니다. 실제 비밀번호, 세션, API key 또는 고객 정보를
    문서에 입력하거나 저장하지 마세요.
x-deskseed-staff-actor-consistency:
  appliesTo: every operation whose security includes staffSession
  implementedOperationBinding: Implemented operations carry the parameter and 400/409 responses directly so OpenAPI generators
    and contract checks can discover them without interpreting this extension.
  blueprintOnlyBinding: Blueprint-only staffSession operations inherit this policy extension and receive the standard operation-level
    bindings when their contracts are frozen for implementation.
  blueprintOnlyOperationIds:
  - listTicketAudits
  - getAdminSetting
  - updateAdminSetting
  parameter:
    $ref: '#/components/parameters/ExpectedStaffActorHeader'
  invalidHeaderResponse:
    $ref: '#/components/responses/InvalidExpectedStaffActor'
  actorMismatchResponse:
    $ref: '#/components/responses/StaffSessionActorMismatch'
  establishmentExceptions:
  - getStaffCsrfToken before sign-in; authenticated token acquisition sends the guard
  - createStaffSession
  - getCurrentStaff when verifying a just-created session
  description: 브라우저는 새 세션을 만들고 확인하는 동안에만 이 헤더를 생략합니다. getStaffCsrfToken은 로그인 전에는 생략하고 인증 후 변경 요청에는 동일한 actor 값을 보내는 이중 용도
    API입니다. 비브라우저 클라이언트는 헤더를 생략할 수 있지만, 전달할 때는 하나의 정규 UUID여야 합니다. 불일치는 제공된 actor 선택, 세션 무효화, 활동 시각 갱신 또는 Controller 진입 없이
    실패로 처리됩니다.
servers:
- url: http://localhost:8080
  description: 로컬 개발 서버
tags:
- name: Customer Requests
  description: 로그인 없이 문의를 접수하고 접근 토큰으로 공개 대화만 확인하는 API입니다.
- name: Customer Portal
  description: 인증된 고객이 자신의 문의와 PUBLIC 댓글만 조회·작성하는 API입니다.
- name: Staff Session
  description: 직원 로그인 세션과 CSRF 토큰을 관리하는 API입니다.
- name: Agent Views
  description: 상담사가 접근 가능한 티켓 큐와 저장된 보기를 조회하는 API입니다.
- name: Agent Tickets
  description: 상담사용 티켓 조회·변경·이관·내부 협업 API입니다.
- name: Agent Search
  description: 권한 범위 안의 티켓을 검색하고 검색 감사를 남기는 API입니다.
- name: Admin
  description: 직원, 그룹, 권한과 제품 설정을 관리하는 ADMIN 전용 API입니다.
- name: Integration Admin
  description: 연동 클라이언트·외부 시스템·외부 참조를 관리하는 API입니다.
- name: Audit
  description: 감사 활동 조회·보호 콘텐츠 공개·내보내기를 처리하며 조회 자체도 감사하는 API입니다.
- name: Customer Auth
  description: 고객 인증 상태와 세션을 처리하는 API입니다.
- name: Admin Schedule
  description: 버전이 고정된 영업 시간표를 생성·검증·활성화하는 API입니다.
- name: Admin SLA
  description: 최초 답변 SLA 정책의 불변 버전을 생성·검증·활성화하는 API입니다.
- name: Analytics
  description: 감사 가능한 불변 사실을 기준으로 SLA 성과를 집계하는 API입니다.
paths:
  /api/v1/requests:
    post:
      summary: 고객 문의 접수
      description: '고객 문의 접수 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다. 기존 계약의 세부 조건:
        Anonymous submissions create an isolated unverified customer; matching email input never merges or claims an earlier
        profile. When a valid customer session is present, the session customer becomes the requester and body name/email
        never override authenticated identity. The configured customer access mode may reject anonymous submission. A one-time
        request access token is returned in both modes for explicit ticket-scoped lookup or claim workflows and is revoked
        when ownership is claimed.'
      operationId: createCustomerRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security:
      - {}
      - customerSession: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-001
      - REQ-TKT-002
      - REQ-TKT-006
      - REQ-AUD-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
            example:
              name: 홍길동
              email: customer@example.com
              subject: 결제가 되지 않아요
              message: 결제 버튼을 누르면 오류가 발생합니다.
              privacyConsent: true
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: false
        description: 'HTTP 헤더로 전달하는 `X-CSRF-TOKEN` 값입니다. 세부 계약: Required only when the optional customer session authenticates
          the request; obtained from `getCustomerCsrfToken`.'
        schema:
          type: string
          minLength: 16
          maxLength: 256
      x-deskseed-generic-problem: &id006
        description: '인증되지 않은 요청입니다. 세부 계약: RFC 9457 Problem Details'
        content: &id001
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
      x-deskseed-no-store-problem: &id002
        description: '요청 형식이나 입력값이 유효하지 않습니다. 세부 계약: RFC 9457 Problem Details'
        content: *id001
        headers: &id003
          Cache-Control:
            description: 고객 데이터가 포함될 수 있는 capability 보호 응답이므로 항상 `no-store`를 사용합니다.
            schema:
              type: string
              enum:
              - no-store
      responses:
        '201':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Request created'
          headers:
            Cache-Control:
              description: 응답에 한 번만 제공되는 접근 토큰이 포함되므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
            Location:
              description: 접근 토큰을 포함하지 않는 고객용 안전한 문의 URL입니다.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousRequestResult'
              example:
                ticketNumber: 1001
                status: NEW
                accessToken: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU
                createdAt: '2026-08-10T00:00:00Z'
        '400': *id002
        '403':
          description: '인증된 주체에게 필요한 권한이 없습니다. 세부 계약: Anonymous submission is disabled by access mode, or authenticated customer
            CSRF validation failed.'
          content: *id001
          headers: *id003
        '409': *id002
        '429': *id002
        '503': *id002
        '500': *id002
  /api/v1/requests/{ticketNumber}:
    get:
      summary: 접근 토큰으로 고객 문의 조회
      operationId: getAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-008
      parameters:
      - &id004
        name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 경로로 전달하는 `ticketNumber` 값입니다.
      - &id005
        name: X-Request-Access-Token
        in: header
        required: true
        description: 'HTTP 헤더로 전달하는 `X-Request-Access-Token` 값입니다. 세부 계약: Opaque ticket-scoped token returned only by request
          creation.'
        schema:
          type: string
          minLength: 32
          maxLength: 256
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Public request detail'
          headers:
            Cache-Control:
              description: 응답에 고객 콘텐츠가 포함되므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
              example:
                ticketNumber: 1001
                subject: 결제가 되지 않아요
                status: NEW
                createdAt: '2026-08-10T00:00:00Z'
                updatedAt: '2026-08-10T00:00:00Z'
                comments:
                - id: 9cc38543-3937-4aa1-a34e-ef45f7b606f8
                  authorDisplayName: 고객
                  body: 결제 버튼을 누르면 오류가 발생합니다.
                  createdAt: '2026-08-10T00:00:00Z'
        '400': *id002
        '404':
          description: '조회할 수 없거나 노출하면 안 되는 자원입니다. 세부 계약: The ticket/token pair is absent, expired, revoked, or invalid.'
          headers:
            Cache-Control:
              description: 고객 데이터가 포함될 수 있는 capability 보호 응답이므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/request-not-found
                title: Request not found
                status: 404
                detail: The ticket number and access token do not identify a visible request.
                instance: /api/v1/requests/1001
                requestId: 9f3c4bbc-e78c-4a12-8673-7e39821e591f
        '429': *id002
        '503': *id002
      description: 접근 토큰으로 고객 문의 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/requests/{ticketNumber}/comments:
    post:
      summary: 고객 문의에 공개 답변 추가
      operationId: addCustomerRequestComment
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      - REQ-TKT-008
      parameters:
      - *id004
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
      responses:
        '201':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Comment created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400': *id002
        '404': *id002
        '409': *id002
        '429': *id002
      description: 고객 문의에 공개 답변 추가 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/customer/requests:
    get:
      summary: 인증 고객의 문의 목록 조회
      operationId: listCustomerRequests
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
        description: 조회 조건로 전달하는 `status` 값입니다.
      - name: cursor
        in: query
        schema:
          type: string
        description: 조회 조건로 전달하는 `cursor` 값입니다.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: 조회 조건로 전달하는 `limit` 값입니다.
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Request page'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestPage'
        '401': *id006
      description: 인증 고객의 문의 목록 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/customer/access-mode:
    get:
      summary: 고객 문의 접근 정책 조회
      operationId: getCustomerAccessMode
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Portal
      security: []
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Effective customer access mode'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccessModeResponse'
      description: 고객 문의 접근 정책 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/agent/csrf:
    get:
      summary: 직원 세션용 CSRF 토큰 발급
      description: '직원 세션용 CSRF 토큰 발급 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다. 기존 계약의 세부 조건: Dual-use endpoint.
        A pre-sign-in caller omits the expected-actor header. An authenticated unsafe workflow supplies its confirmed actor
        snapshot so a cross-tab session change is rejected before the subsequent mutation.'
      operationId: getStaffCsrfToken
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      security: []
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: CSRF token'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Set-Cookie:
              description: HttpOnly 직원 세션 쿠키이며 운영 환경에서는 Secure, SameSite=Lax를 사용합니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
  /api/v1/agent/session:
    post:
      summary: 직원 로그인 세션 생성
      operationId: createStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      - REQ-AUTH-006
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
      responses:
        '204':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Session created'
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Lax 쿠키이며 운영 환경에서는 Secure를 사용합니다. 유휴 만료는 60분, 절대 만료는 12시간입니다.
              schema:
                type: string
        '400': *id006
        '401': *id006
        '429': *id006
      description: 직원 로그인 세션 생성 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다.
    delete:
      summary: 현재 직원 세션 종료
      operationId: deleteStaffSession
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '204':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Session destroyed'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id006
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
      description: 현재 직원 세션 종료 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다.
  /api/v1/agent/me:
    get:
      summary: 현재 직원과 권한 조회
      operationId: getCurrentStaff
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Current staff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStaff'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id006
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
      description: 현재 직원과 권한 조회 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다.
  /api/v1/agent/views:
    get:
      summary: 상담사가 사용할 수 있는 티켓 보기 조회
      operationId: listAgentViews
      x-deskseed-contract-status: FROZEN
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-PERM-001
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Views'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id006
        '403': *id006
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
      description: 상담사가 사용할 수 있는 티켓 보기 조회 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다.
  /api/v1/agent/views/{viewKey}/tickets:
    get:
      summary: 선택한 보기의 티켓 목록 조회
      operationId: listTicketsInView
