        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationDryRunRequest'
      responses:
        '200':
          description: 현재 기준 조건 일치 여부와 정확한 eligibleAt을 side effect 없이 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationDryRunResult'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatchOrConflict'
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: DESKSEED_SESSION
      description: HttpOnly 서버 세션입니다. 브라우저 요청은 선택적인 ExpectedStaffActorHeader 일관성 guard도 사용하지만, 이 헤더는 자격 증명이 아니며 인증 actor를
        결정하지 않습니다.
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: getStaffCsrfToken이 반환하며 브라우저 세션에 귀속되는 토큰입니다.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    CustomerCsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: getCustomerCsrfToken이 반환하며 현재 customerSession에 귀속되는 토큰입니다. 세션 cookie 원문이나 이 토큰은 로그 또는 감사 메타데이터에 저장하지 않습니다.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    ExpectedStaffActorHeader:
      name: X-Deskseed-Expected-Staff-Id
      in: header
      required: false
      description: staffSession 작업을 위한 심층 방어용 브라우저 일관성 guard입니다. 전달할 때는 이미 인증된 세션 주체와 같은 하나의 정규 UUID여야 합니다. 생략은 호환되지만 형식 오류나
        중복은 InvalidExpectedStaffActor, 불일치는 Controller 실행·감사 성공·변경·세션 활동 갱신 전에 StaffSessionActorMismatch를 반환합니다. 로그인 시작과 로그인
        직후 신원 확인에서는 의도적으로 생략합니다.
      schema:
        type: string
        format: uuid
    AdminPageNumber:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호입니다.
      schema:
        type: integer
        minimum: 0
        default: 0
    AdminPageSize:
      name: size
      in: query
      required: false
      description: 관리자 목록 응답 한 페이지에서 반환할 수 있는 제한된 행 수입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IntegrationClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemIfMatch:
      name: If-Match
      in: header
      required: true
      description: 외부 시스템용 ETag이며 expectedVersion과 같은 버전을 가리켜야 합니다.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantableAuditAuthorityParam:
      name: authority
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GrantableAuditAuthority'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: 감사자의 탐색·필터 상호작용 식별자이며 cursor 요청은 첫 페이지의 값을 재사용합니다.
      schema:
        type: string
        format: uuid
    AgentInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: 직원이 의도적으로 view preview 또는 attachment를 연 상호작용 식별자입니다. background prefetch는 semantic view/download를 만들지 않는
        별도 intent를 사용합니다.
      schema:
        type: string
        format: uuid
    SavedViewKey:
      name: viewKey
      in: path
      required: true
      description: SYSTEM slug 또는 생성된 opaque saved-view key입니다.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9._:-]+$
    SavedViewIfMatch:
      name: If-Match
      in: header
      required: true
      description: 저장된 definition version을 인용 부호 포함/미포함 정수 ETag로 보냅니다.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketConfigurationTicketNumber:
      name: ticketNumber
      in: path
      required: true
      description: 변경 또는 조회할 양의 ticket 번호입니다.
      schema:
        type: integer
        format: int64
        minimum: 1
    TicketConfigurationIfMatch:
      name: If-Match
      in: header
      required: true
      description: 현재 definition 또는 ticket version과 정확히 일치하지 않으면 기존 값을 덮어쓰지 않도록 하는 strong version precondition입니다.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    TicketFieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketFieldOptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketFormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketTagId:
      name: tagId
