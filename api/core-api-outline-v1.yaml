openapi: 3.1.0
info:
  title: Deskseed Core API Outline
  version: 0.6.0-implementation-ready
  description: Customer, staff, admin, audit, customer magic-link, and schedule/SLA contract. Blueprint-only operations remain
    marked by phase and requirement status.
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Customer Requests
- name: Customer Portal
- name: Staff Session
- name: Agent Views
- name: Agent Tickets
- name: Agent Search
- name: Admin
- name: Audit
- name: Customer Auth
- name: Admin Schedule
- name: Admin SLA
paths:
  /api/v1/requests:
    post:
      summary: Submit an anonymous customer request
      operationId: createAnonymousRequest
      tags:
      - Customer Requests
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-001
      - REQ-TKT-002
      - REQ-TKT-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
      responses:
        '201':
          description: Request created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousRequestResult'
        '400': &id001
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': *id001
        '429': *id001
        '500': *id001
  /api/v1/requests/{ticketNumber}:
    get:
      summary: Read a customer-safe request projection
      operationId: getAnonymousRequest
      tags:
      - Customer Requests
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-008
      parameters:
      - &id002
        name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &id003
        name: X-Request-Access-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
      responses:
        '200':
          description: Public request detail
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
        '404': *id001
        '410': *id001
        '429': *id001
  /api/v1/requests/{ticketNumber}/comments:
    post:
      summary: Add a public customer follow-up
      operationId: addCustomerRequestComment
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      - REQ-TKT-008
      parameters:
      - *id002
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400': *id001
        '404': *id001
        '409': *id001
        '429': *id001
  /api/v1/customer/requests:
    get:
      summary: List requests for a verified customer account
      operationId: listCustomerRequests
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestPage'
        '401': *id001
  /api/v1/agent/session:
    post:
      summary: Create a staff session
      operationId: createStaffSession
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLogin'
      responses:
        '204':
          description: Session created
          headers:
            Set-Cookie:
              schema:
                type: string
        '400': *id001
        '401': *id001
        '429': *id001
    delete:
      summary: Destroy the current staff session
      operationId: deleteStaffSession
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      security:
      - staffSession: []
      responses:
        '204':
          description: Session destroyed
        '401': *id001
  /api/v1/agent/me:
    get:
      summary: Read current staff identity and capabilities
      operationId: getCurrentStaff
      tags:
      - Staff Session
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      security:
      - staffSession: []
      responses:
        '200':
          description: Current staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStaff'
        '401': *id001
  /api/v1/agent/views:
    get:
      summary: List accessible saved views
      operationId: listAgentViews
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      security:
      - staffSession: []
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
        '401': *id001
        '403': *id001
  /api/v1/agent/views/{viewKey}/tickets:
    get:
      summary: List tickets in a saved view
      operationId: listTicketsInView
      tags:
      - Agent Views
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-UI-002
      - REQ-TKT-010
      security:
      - staffSession: []
      parameters:
      - name: viewKey
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Ticket page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummaryPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/agent/tickets:
    post:
      summary: Create a staff-originated ticket
      operationId: createAgentTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-009
      - REQ-TKT-006
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTicket'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/agent/tickets/{ticketNumber}:
    get:
      summary: Read an agent ticket projection
      operationId: getAgentTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-TKT-007
      - REQ-AUD-003
      - REQ-UI-003
      security:
      - staffSession: []
      parameters:
      - *id002
      - &id005
        name: X-Interaction-Id
        in: header
        required: true
        description: Semantic user interaction identifier; background revalidation reuses the same value.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Agent ticket detail
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTicketDetail'
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/agent/tickets/{ticketNumber}/commands:
    post:
      summary: Apply one atomic ticket update command
      operationId: updateAgentTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-TKT-010
      - REQ-TKT-013
      - REQ-TKT-014
      - REQ-AUD-001
      security:
      - staffSession: []
      parameters:
      - *id002
      - &id004
        name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Ticket ETag returned by the latest read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketCommand'
      responses:
        '200':
          description: Command applied
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '412': *id001
  /api/v1/agent/tickets/{ticketNumber}/transfer:
    post:
      summary: Transfer ticket ownership to a group or agent
      operationId: transferAgentTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M4
      x-deskseed-requirements:
      - REQ-TKT-011
      - REQ-TKT-012
      security:
      - staffSession: []
      parameters:
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTicketCommand'
      responses:
        '200':
          description: Transfer applied
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '412': *id001
  /api/v1/agent/tickets/{ticketNumber}/children:
    post:
      summary: Create an internal child ticket
      operationId: createChildTicket
      tags:
      - Agent Tickets
      x-deskseed-phase: M5
      x-deskseed-requirements:
      - REQ-CHILD-001
      - REQ-CHILD-002
      - REQ-CHILD-003
      security:
      - staffSession: []
      parameters:
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildTicketCommand'
      responses:
        '201':
          description: Child created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildTicketResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '412': *id001
  /api/v1/agent/tickets/{ticketNumber}/audits:
    get:
      summary: Read ticket-local change history
      operationId: listTicketAudits
      tags:
      - Agent Tickets
      x-deskseed-phase: M3
      x-deskseed-requirements:
      - REQ-AUD-001
      security:
      - staffSession: []
      parameters:
      - *id002
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAuditPage'
        '401': *id001
        '403': *id001
        '404': *id001
  /api/v1/agent/search:
    get:
      summary: Search accessible tickets and customers
      operationId: searchAgentWorkspace
      tags:
      - Agent Search
      x-deskseed-phase: R1
      x-deskseed-requirements:
      - REQ-AUD-004
      - REQ-SRCH-001
      security:
      - staffSession: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - TICKETS
          - CUSTOMERS
          default: TICKETS
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - *id005
      responses:
        '200':
          description: Search result page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '503': *id001
  /api/v1/admin/staff:
    get:
      summary: List staff accounts
      operationId: listStaffAccounts
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PROD-002
      security:
      - staffSession: []
      responses:
        '200':
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccount'
        '401': *id001
        '403': *id001
    post:
      summary: Create a staff account
      operationId: createStaffAccount
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-PROD-002
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAccount'
      responses:
        '201':
          description: Staff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/admin/groups:
    get:
      summary: List groups
      operationId: listGroups
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-TKT-011
      security:
      - staffSession: []
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401': *id001
        '403': *id001
    post:
      summary: Create a group
      operationId: createGroup
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-TKT-011
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroup'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
  /api/v1/admin/settings/{key}:
    get:
      summary: Read an allowed admin setting
      operationId: getAdminSetting
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-AUD-009
      security:
      - staffSession: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
        '401': *id001
        '403': *id001
        '404': *id001
    patch:
      summary: Change an allowed admin setting
      operationId: updateAdminSetting
      tags:
      - Admin
      x-deskseed-phase: M6
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-AUD-009
      security:
      - staffSession: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminSetting'
      responses:
        '200':
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetting'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '412': *id001
  /api/v1/audit/activities:
    get:
      summary: Query the unified audit explorer projection
      operationId: listAuditActivities
      tags:
      - Audit
      x-deskseed-phase: R2
      x-deskseed-requirements:
      - REQ-AUD-002
      - REQ-AUD-006
      security:
      - staffSession: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: ledger
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: actorId
        in: query
        schema:
          type: string
          format: uuid
      - name: ticketNumber
        in: query
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - *id005
      responses:
        '200':
          description: Audit activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditActivityPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '503': *id001
  /api/v1/audit/activities/{activityId}/reveal:
    post:
      summary: Reveal protected audit content with a reason
      operationId: revealAuditActivityContent
      tags:
      - Audit
      x-deskseed-phase: R2
      x-deskseed-requirements:
      - REQ-AUD-005
      - REQ-AUD-006
      security:
      - staffSession: []
      parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectedRevealRequest'
      responses:
        '200':
          description: Protected content
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedRevealResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '503': *id001
  /api/v1/audit/exports:
    post:
      summary: Request an asynchronous audit export
      operationId: createAuditExport
      tags:
      - Audit
      x-deskseed-phase: R2
      x-deskseed-requirements:
      - REQ-AUD-006
      - REQ-EXP-001
      security:
      - staffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditExport'
      responses:
        '202':
          description: Export accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400': *id001
        '401': *id001
        '403': *id001
        '429': *id001
  /api/v1/customer/me:
    get:
      summary: Read the verified customer account
      operationId: getCurrentCustomer
      tags:
      - Customer Auth
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-AUTH-001
      security: &id006
      - customerSession: []
      responses:
        '200':
          description: Current customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentCustomer'
        '401':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customer/requests/{ticketNumber}:
    parameters:
    - &id007
      name: ticketNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      summary: Read an authenticated customer-safe request projection
      operationId: getCustomerRequest
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      security: *id006
      responses:
        '200':
          description: Customer request detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
        '401':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customer/requests/{ticketNumber}/comments:
    parameters:
    - *id007
    post:
      summary: Add an authenticated PUBLIC customer follow-up
      operationId: addAuthenticatedCustomerComment
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-005
      security: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
      responses:
        '201':
          description: Public comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/admin/business-schedules:
    get:
      summary: List business schedules and active versions
      operationId: listBusinessSchedules
      tags:
      - Admin Schedule
      x-deskseed-phase: P3
      x-deskseed-requirements:
      - REQ-SLA-002
      security: &id008
      - staffSession: []
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessSchedule'
        '401':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: RFC 9457 Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Create a business schedule and first version
      operationId: createBusinessSchedule
      tags:
      - Admin Schedule
      x-deskseed-phase: P3
      x-deskseed-requirements:
      - REQ-SLA-002
      security: *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessScheduleInput'
      responses:
        '201':
          description: Schedule created
