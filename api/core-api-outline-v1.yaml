        $ref: '#/components/schemas/GrantableAuditAuthority'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: 감사자의 탐색·필터 상호작용 식별자이며 cursor 요청은 첫 페이지의 값을 재사용합니다.
      schema:
        type: string
        format: uuid
    AgentInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: 직원이 의도적으로 view preview 또는 attachment를 연 상호작용 식별자입니다. background prefetch는 semantic view/download를 만들지 않는
        별도 intent를 사용합니다.
      schema:
        type: string
        format: uuid
    SavedViewKey:
      name: viewKey
      in: path
      required: true
      description: SYSTEM slug 또는 생성된 opaque saved-view key입니다.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9._:-]+$
    SavedViewIfMatch:
      name: If-Match
      in: header
      required: true
      description: 저장된 definition version을 인용 부호 포함/미포함 정수 ETag로 보냅니다.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketConfigurationTicketNumber:
      name: ticketNumber
      in: path
      required: true
      description: 변경 또는 조회할 양의 ticket 번호입니다.
      schema:
        type: integer
        format: int64
        minimum: 1
    TicketConfigurationIfMatch:
      name: If-Match
      in: header
      required: true
      description: 현재 definition 또는 ticket version과 정확히 일치하지 않으면 기존 값을 덮어쓰지 않도록 하는 strong version precondition입니다.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    TicketFieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketFieldOptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketFormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketTagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketStatusDefinitionId:
      name: statusId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    PageNumber:
      description: 응답으로 반환된 0부터 시작하는 페이지 번호입니다.
