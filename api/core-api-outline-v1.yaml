components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: DESKSEED_SESSION
      description: >-
        HttpOnly server session. Browser requests also use the optional
        ExpectedStaffActorHeader consistency guard; that header is not a credential and
        never supplies the authenticated actor.
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token returned by `getStaffCsrfToken` and bound to the browser session.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    ExpectedStaffActorHeader:
      name: X-Deskseed-Expected-Staff-Id
      in: header
      required: false
      description: >-
        Defense-in-depth browser consistency guard for staffSession operations. When
        present it must be one canonical UUID equal to the already authenticated session
        principal. Missing remains compatible; malformed/duplicate values return the
        InvalidExpectedStaffActor response and a mismatch returns
        StaffSessionActorMismatch before controller execution, audit success, mutation,
        or session activity renewal. Login bootstrap and post-login identity verification
        intentionally omit it.
      schema:
        type: string
        format: uuid
    AdminPageNumber:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    AdminPageSize:
      name: size
      in: query
      required: false
      description: Bounded number of rows returned in one admin list response.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IntegrationClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemIfMatch:
      name: If-Match
      in: header
      required: true
      description: External-system ETag; it must identify the same version as expectedVersion.
      schema:
        type: string
        pattern: '^"?[0-9]+"?$'
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantableAuditAuthorityParam:
      name: authority
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GrantableAuditAuthority'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: Auditor navigation/filter interaction. Cursor requests reuse the first-page value.
      schema:
        type: string
        format: uuid
  headers:
    PageNumber:
      description: Zero-based page number returned.
      schema:
        type: integer
        minimum: 0
    PageSize:
      description: Maximum number of rows requested for this page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TotalCount:
      description: Total rows matching this list.
      schema:
        type: integer
        format: int64
        minimum: 0
    TotalPages:
      description: Total pages at the requested page size.
      schema:
        type: integer
        minimum: 0
  responses:
    InvalidExpectedStaffActor:
      description: The optional expected staff actor header is present but is not one canonical UUID value.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
          example:
            type: /problems/invalid-staff-session-actor
            title: Invalid staff session actor
            status: 400
            detail: The expected staff actor header is invalid.
            requestId: req-actor-400
    StaffSessionActorMismatch:
      description: The browser's confirmed actor differs from the authenticated session principal.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
          example:
            type: /problems/staff-session-actor-mismatch
            title: Staff session actor changed
            status: 409
            detail: Refresh the staff session before continuing.
            requestId: req-actor-409
    InvalidExpectedStaffActorOrBadRequest:
      description: >-
        RFC 9457 request validation failure, including a present expected-actor header
        that is not one canonical UUID value.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            invalidExpectedStaffActor:
              value:
                type: /problems/invalid-staff-session-actor
                title: Invalid staff session actor
                status: 400
                detail: The expected staff actor header is invalid.
                requestId: req-actor-400
    StaffSessionActorMismatchOrConflict:
      description: >-
        RFC 9457 business conflict, including a confirmed browser actor that differs
        from the authenticated session principal.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            staffSessionActorMismatch:
              value:
                type: /problems/staff-session-actor-mismatch
                title: Staff session actor changed
                status: 409
                detail: Refresh the staff session before continuing.
                requestId: req-actor-409
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          type: integer
          format: int64
        conflictingFields:
          type: array
          items:
            type: string
      additionalProperties: true
    InvalidExpectedStaffActorProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required: [type, title, status]
        properties:
          type:
            type: string
            const: /problems/invalid-staff-session-actor
          title:
            type: string
            const: Invalid staff session actor
          status:
            type: integer
            const: 400
    StaffSessionActorMismatchProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required: [type, title, status]
        properties:
          type:
            type: string
            const: /problems/staff-session-actor-mismatch
          title:
            type: string
            const: Staff session actor changed
          status:
            type: integer
            const: 409
    TicketFieldConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        - conflictingFields
        properties:
          type:
            type: string
            const: /problems/ticket-field-conflict
          status:
            type: integer
            const: 409
          currentVersion:
            type: integer
            format: int64
          conflictingFields:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
              - status
              - priority
              - groupId
              - assigneeId
    ClientCommandIdReusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          type:
            type: string
            const: /problems/client-command-id-reused
          status:
            type: integer
            const: 409
    TicketVersionPreconditionProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        properties:
          type:
            type: string
            const: /problems/ticket-version-precondition-failed
          status:
            type: integer
            const: 412
          currentVersion:
            type: integer
            format: int64
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    CreateAnonymousRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - subject
      - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 20000
        privacyConsent:
          type: boolean
    CreateAnonymousRequestResult:
      type: object
      additionalProperties: false
      required:
      - ticketNumber
      - status
      - accessToken
      - createdAt
      properties:
        ticketNumber:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TicketStatus'
        accessToken:
          type: string
          description: Returned only at creation; server stores a hash.
        createdAt:
          type: string
          format: date-time
    AddCustomerComment:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
    PublicComment:
      type: object
      additionalProperties: false
      required:
      - id
      - authorDisplayName
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        authorDisplayName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PublicAttachment'
    PublicAttachment:
      type: object
      required:
      - id
      - fileName
      - sizeBytes
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        downloadUrl:
          type: string
          format: uri
    CustomerRequestDetail:
      type: object
      additionalProperties: false
      required:
      - ticketNumber
      - subject
      - status
      - createdAt
      - updatedAt
      - comments
      properties:
        ticketNumber:
          type: integer
          format: int64
        subject:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
    CustomerRequestPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerRequestDetail'
        nextCursor:
          type:
          - string
          - 'null'
    StaffLogin:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    CsrfToken:
      type: object
      additionalProperties: false
      required:
      - token
      - headerName
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
        headerName:
          type: string
          enum: [X-CSRF-TOKEN]
    CurrentStaff:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - role
      - capabilities
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        capabilities:
          type: array
          items:
            type: string
    SavedView:
      type: object
      additionalProperties: false
      required:
      - key
      - name
      - scope
      - readScope
      properties:
        key:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - PERSONAL
          - SHARED
          - SYSTEM
        categoryPath:
          type: array
          items:
            type: string
        ticketCount:
          type:
          - integer
          - 'null'
        readScope:
          type: string
          enum:
          - ALL_TICKETS
    TicketStatus:
      type: string
      description: Customer-visible ticket status projection.
      enum:
      - NEW
      - OPEN
      - PENDING
      - SOLVED
    AgentTicketStatus:
      type: string
      description: Canonical status projection for staff ticket reads and commands.
      enum:
      - NEW
      - OPEN
      - PENDING
      - ON_HOLD
      - SOLVED
      - CLOSED
    TicketPriority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    TicketVisibility:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
    ActorSummary:
      type: object
      required:
      - type
      - displayName
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
        type:
          type: string
          enum:
          - CUSTOMER
          - STAFF
          - INTEGRATION_CLIENT
          - TRIGGER
          - AUTOMATION
          - SYSTEM
        displayName:
          type: string
    TicketSummary:
      type: object
      required:
      - ticketNumber
      - subject
      - status
      - priority
      - requester
      - updatedAt
      - version
      properties:
        ticketNumber:
          type: integer
          format: int64
        subject:
          type: string
        status:
          $ref: '#/components/schemas/AgentTicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        requester:
          $ref: '#/components/schemas/ActorSummary'
        group:
          $ref: '#/components/schemas/GroupRef'
        assignee:
          $ref: '#/components/schemas/StaffRef'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
        isChild:
          type: boolean
        openChildCount:
          type: integer
        sla:
          $ref: '#/components/schemas/SlaBadge'
    TicketSummaryPage:
      type: object
      additionalProperties: false
      required:
      - items
      - sort
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        nextCursor:
          type:
          - string
          - 'null'
        totalApproximate:
          type:
          - integer
          - 'null'
          format: int64
        sort:
          type: string
          const: updatedAt:desc,ticketNumber:desc
    StaffRef:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    GroupRef:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SlaBadge:
      type:
      - object
      - 'null'
      properties:
        metric:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - AT_RISK
          - ACHIEVED
          - BREACHED
        dueAt:
          type: string
          format: date-time
    AgentComment:
      type: object
      required:
      - id
      - visibility
      - actor
      - body
      - createdAt
      - source
      properties:
        id:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/TicketVisibility'
        actor:
          $ref: '#/components/schemas/ActorSummary'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        source:
          type: string
        redactionState:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PublicAttachment'
    AgentTicketDetail:
      type: object
      additionalProperties: false
      required:
      - ticket
      - comments
      - capabilities
      - assignmentOptions
      - context
      - history
      - warnings
      properties:
        ticket:
          $ref: '#/components/schemas/TicketSummary'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AgentComment'
        capabilities:
          type: array
          items:
            type: string
          description: "READ is always present for a successful staff detail; UPDATE is present only when the current actor may mutate the current ticket."
        assignmentOptions:
          $ref: '#/components/schemas/TicketAssignmentOptions'
        context:
          $ref: '#/components/schemas/TicketContext'
        history:
          type: array
          items:
            $ref: '#/components/schemas/TicketHistoryItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CommandWarning'
    TicketAssignmentOptions:
      type: object
      additionalProperties: false
      required:
      - groups
      properties:
        groups:
          type: array
          description: Active groups and their active members, projected only on the audited staff detail surface.
          items:
            $ref: '#/components/schemas/TicketAssignmentGroupOption'
    TicketAssignmentGroupOption:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - members
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/TicketAssignmentStaffOption'
    TicketAssignmentStaffOption:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    TicketContext:
      type: object
      additionalProperties: false
      required:
      - customer
      - parent
      - children
      - externalReferences
      properties:
        customer:
          $ref: '#/components/schemas/TicketCustomer'
        parent:
          oneOf:
          - $ref: '#/components/schemas/TicketSummary'
          - type: 'null'
        children:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        externalReferences:
          type: array
          items:
            type: object
            additionalProperties: true
    TicketCustomer:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - email
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
    TicketHistoryItem:
      type: object
      additionalProperties: false
      required:
      - id
      - eventType
      - actor
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        actor:
          $ref: '#/components/schemas/ActorSummary'
        occurredAt:
          type: string
          format: date-time
    CommentDraft:
      type: object
      required:
      - visibility
      - body
      properties:
        visibility:
          $ref: '#/components/schemas/TicketVisibility'
        body:
          type: string
          minLength: 1
          maxLength: 20000
    UpdateTicketCommand:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - changedFields
      anyOf:
      - properties:
          changedFields:
            minItems: 1
      - required:
        - comment
        properties:
          comment:
            $ref: '#/components/schemas/CommentDraft'
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        changedFields:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - status
            - priority
            - groupId
            - assigneeId
        status:
          $ref: '#/components/schemas/AgentTicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        comment:
          oneOf:
          - $ref: '#/components/schemas/CommentDraft'
          - type: 'null'
        clientCommandId:
          type: string
          format: uuid
          description: >-
            Identifies one canonical update request for the authenticated staff actor. An exact retry returns the original result;
            reuse for a different payload, ticket, or staff ticket operation returns 409 without mutation.
    TransferTicketCommand:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - groupId
      properties:
        expectedVersion:
          type: integer
          format: int64
        groupId:
          type: string
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        reason:
          type:
          - string
          - 'null'
          maxLength: 2000
        clientCommandId:
          type: string
          format: uuid
    CreateChildTicketCommand:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - subject
      - body
      - groupId
      - priority
      properties:
        expectedVersion:
