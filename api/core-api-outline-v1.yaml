    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token returned by `getStaffCsrfToken` and bound to the browser session.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: Auditor navigation/filter interaction. Cursor requests reuse the first-page value.
      schema:
        type: string
        format: uuid
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          type: integer
          format: int64
        conflictingFields:
          type: array
          items:
            type: string
      additionalProperties: true
    TicketFieldConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        - conflictingFields
        properties:
          type:
            type: string
            const: /problems/ticket-field-conflict
          status:
            type: integer
            const: 409
          currentVersion:
            type: integer
            format: int64
          conflictingFields:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
              - status
              - priority
              - groupId
              - assigneeId
    TicketVersionPreconditionProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        properties:
          type:
            type: string
            const: /problems/ticket-version-precondition-failed
          status:
            type: integer
            const: 412
          currentVersion:
            type: integer
            format: int64
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    CreateAnonymousRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - subject
      - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 20000
        privacyConsent:
          type: boolean
    CreateAnonymousRequestResult:
      type: object
      additionalProperties: false
      required:
