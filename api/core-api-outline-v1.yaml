          maxItems: 5
          uniqueItems: true
          description: 보류 중인 첨부 handle입니다. 이후 제출이 댓글에 연결하기 전 소유자와 티켓 가시성을 다시 확인합니다.
          items:
            type: string
            format: uuid
        clientDeviceId:
          type: string
          format: uuid
          description: 같은 직원의 여러 브라우저가 만든 초안 충돌을 설명할 때만 비교하는 불투명 설치 식별자이며 인증 주체를 대신하지 않습니다.
        baseTicketVersion:
          type: integer
          format: int64
          minimum: 0
          description: 작성 중 관찰한 티켓 버전입니다. 티켓을 변경하지 않습니다.
        expectedDraftVersion:
          type: integer
          format: int64
          minimum: 0
          description: 0은 아직 없는 channel 초안을 생성하고 양수는 정확히 그 저장 버전을 갱신합니다.
    TicketDraftConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        properties:
          currentVersion:
            type: integer
            format: int64
            minimum: 1
          updatedAt:
            type: string
            format: date-time
    MacroDefinitionRequest:
      type: object
      description: 소유 범위 안의 불변 macro version에 저장할 이름과 순서 보존 typed action 정의입니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - name
      - actions
      example:
        name: 긴급 문의 안내
        actions:
        - type: PRIORITY
          priority: URGENT
        - type: COMMENT
          visibility: PUBLIC
          template: 안녕하세요 {{requester.name}}님. 문의를 확인하고 있습니다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 소유 범위 안에서 중복되지 않는 상담사용 macro 이름입니다.
        actions:
          type: array
          minItems: 1
          maxItems: 50
          description: preview와 apply에서 같은 순서로 해석하는 typed action 목록입니다.
          items:
            $ref: '#/components/schemas/MacroAction'
    MacroActivationRequest:
      type: object
      description: macro aggregate가 이미 보유한 불변 version을 활성 포인터로 선택하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - version
      example:
        version: 1
      properties:
        version:
          type: integer
          minimum: 1
          description: 이미 저장된 불변 macro version입니다.
    MacroDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - scope
      - currentVersion
      - aggregateVersion
      - actions
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: macro aggregate의 stable ID입니다.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 응답 actions가 속한 version의 표시 이름입니다.
        scope:
          type: string
          enum:
          - PERSONAL
          - SHARED
          description: PERSONAL은 소유자 전용이고 SHARED는 모든 상담사에게 적용 후보로 보입니다.
        ownerStaffId:
          type:
          - string
          - 'null'
          format: uuid
          description: PERSONAL 소유자이며 SHARED에서는 null입니다.
        currentVersion:
          type: integer
          minimum: 1
          description: 가장 최근에 저장된 불변 definition version입니다.
        activeVersion:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 현재 적용 가능한 version이며 null이면 비활성입니다.
        aggregateVersion:
          type: integer
          format: int64
          minimum: 1
          description: If-Match와 ETag에 쓰는 lifecycle 변경 version입니다.
        actions:
          type: array
          minItems: 1
          maxItems: 50
          description: 응답 version에 고정된 순서 보존 typed action입니다.
          items:
            $ref: '#/components/schemas/MacroAction'
        createdAt:
          type: string
          format: date-time
          description: macro aggregate 생성 시각입니다.
        updatedAt:
          type: string
          format: date-time
          description: latest version 또는 활성 포인터 변경 시각입니다.
    MacroPreview:
      type: object
      additionalProperties: false
      required:
      - macroId
      - macroVersion
      - ticketNumber
      - ticketVersion
      - changes
      properties:
        macroId:
          type: string
          format: uuid
          description: preview에 사용한 활성 macro ID입니다.
        macroVersion:
          type: integer
          minimum: 1
          description: preview에 사용한 불변 활성 macro version입니다.
        ticketNumber:
          type: integer
          format: int64
          minimum: 1
          description: 대상 ticket 번호입니다.
        ticketVersion:
          type: integer
          format: int64
          minimum: 0
          description: apply의 If-Match로 다시 제출해야 하는 current ticket version입니다.
        changes:
          type: array
          maxItems: 50
          description: 저장된 action 순서에서 댓글을 제외한 before/after 변경 계획입니다.
          items:
            $ref: '#/components/schemas/MacroPreviewChange'
        comment:
          oneOf:
          - $ref: '#/components/schemas/MacroPreviewComment'
          - type: 'null'
          description: COMMENT action이 없으면 null인 렌더링된 plain-text draft입니다.
    MacroPreviewChange:
      type: object
      additionalProperties: false
      required:
      - field
      properties:
        field:
          type: string
          maxLength: 200
          description: status, priority, stable resource ID 또는 field machine key를 포함한 typed 변경 경로입니다.
        before:
          type:
          - string
          - 'null'
          maxLength: 10000
          description: 현재 ticket의 staff projection에서 읽어 변경 비교에 사용하는 기준입니다.
        after:
          type:
          - string
          - 'null'
          maxLength: 10000
          description: 일반 ticket command에 다시 제출될 목표 값의 안전한 문자열 projection입니다.
    MacroPreviewComment:
      type: object
      additionalProperties: false
      required:
      - visibility
      - body
      properties:
        visibility:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          description: 렌더링된 draft의 서버 검증 가시성입니다.
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: allowlisted ticket/requester/agent placeholder를 현재 projection으로 치환한 plain text입니다.
    MacroApplyRequest:
      type: object
      description: preview에서 검토한 활성 macro version과 댓글 draft를 idempotent ticket command로 제출하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - macroVersion
      - clientCommandId
      properties:
        macroVersion:
          type: integer
          minimum: 1
          description: preview 응답의 macroVersion이며 apply transaction 안에서 현재 활성 version과 다시 비교합니다.
        commentBodyOverride:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 20000
          description: COMMENT action이 있으면 preview에서 검토·수정한 plain-text draft 전체를 반드시 전달하며 저장된 visibility는 바꾸지 않습니다.
        clientCommandId:
          type: string
          format: uuid
          description: 동일 actor의 exact payload 재시도를 원래 TicketAudit 결과에 연결하며 다른 payload에는 재사용할 수 없습니다.
      example:
        macroVersion: 1
        commentBodyOverride: 상담사가 검토한 내부 결제 메모입니다.
        clientCommandId: 77777777-7777-4777-8777-777777777777
    MacroApplyResult:
      type: object
      additionalProperties: false
      required:
      - ticketNumber
      - version
      - auditId
      - replayed
      - warnings
      properties:
        ticketNumber:
          type: integer
          format: int64
          minimum: 1
          description: macro command가 적용된 ticket 번호입니다.
        version:
          type: integer
          format: int64
          minimum: 0
          description: 모든 macro action을 원자적으로 반영한 뒤의 ticket version입니다.
        auditId:
          type: string
          format: uuid
          description: '`MACRO_APPLIED`와 ordered action events를 보유한 단일 TicketAudit ID입니다.'
        replayed:
          type: boolean
          description: 새 mutation 없이 exact clientCommandId의 기존 결과를 반환했는지 나타냅니다.
        warnings:
          type: array
          description: 열린 child가 있는 solve처럼 commit은 허용하지만 상담사 확인이 필요한 경고입니다.
          items:
            $ref: '#/components/schemas/CommandWarning'
    MacroAction:
      oneOf:
      - $ref: '#/components/schemas/MacroStatusAction'
      - $ref: '#/components/schemas/MacroPriorityAction'
      - $ref: '#/components/schemas/MacroGroupAction'
      - $ref: '#/components/schemas/MacroAssigneeAction'
      - $ref: '#/components/schemas/MacroAddTagAction'
      - $ref: '#/components/schemas/MacroRemoveTagAction'
      - $ref: '#/components/schemas/MacroCustomFieldAction'
      - $ref: '#/components/schemas/MacroCustomStatusAction'
      - $ref: '#/components/schemas/MacroCommentAction'
      discriminator:
        propertyName: type
    MacroStatusAction:
      type: object
      additionalProperties: false
      required:
      - type
      - status
      properties:
        type:
          type: string
          const: STATUS
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
          - CLOSED
          description: 일반 ticket command가 검증할 목표 상태입니다.
    MacroPriorityAction:
      type: object
      additionalProperties: false
      required:
      - type
      - priority
      properties:
        type:
          type: string
          const: PRIORITY
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: 일반 ticket command가 적용할 우선순위입니다.
    MacroGroupAction:
      type: object
      additionalProperties: false
      required:
      - type
      - groupId
      properties:
        type:
          type: string
          const: GROUP
        groupId:
          type: string
          format: uuid
          description: 적용 시 active group 여부를 다시 검사할 목표 group입니다.
    MacroAssigneeAction:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          const: ASSIGNEE
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
          description: null이면 담당자 해제이며 값이 있으면 active member 여부를 다시 검사합니다.
    MacroAddTagAction:
      type: object
      additionalProperties: false
      required:
      - type
      - tagId
      properties:
        type:
          type: string
          const: ADD_TAG
        tagId:
          type: string
          format: uuid
          description: 적용 시 active tag 여부를 다시 검사해 추가할 stable ID입니다.
    MacroRemoveTagAction:
      type: object
      additionalProperties: false
      required:
      - type
      - tagId
      properties:
        type:
          type: string
          const: REMOVE_TAG
        tagId:
          type: string
          format: uuid
          description: 티켓에서 제거할 stable tag ID입니다.
    MacroCustomFieldAction:
      type: object
      additionalProperties: false
      required:
      - type
      - fieldKey
      - value
      properties:
        type:
          type: string
          const: CUSTOM_FIELD
        fieldKey:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
          maxLength: 120
          description: 적용 시 active definition과 form projection을 다시 검사할 machine key입니다.
        value:
          $ref: '#/components/schemas/TicketFieldValue'
    MacroCustomStatusAction:
      type: object
      additionalProperties: false
      required:
      - type
      - customStatusId
      properties:
        type:
          type: string
          const: CUSTOM_STATUS
        customStatusId:
          type: string
          format: uuid
          description: 적용 시 현재 form과 fixed category 호환성을 다시 검사할 stable ID입니다.
    MacroCommentAction:
      type: object
      additionalProperties: false
      required:
      - type
      - visibility
      - template
      properties:
        type:
          type: string
          const: COMMENT
        visibility:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          description: PUBLIC과 INTERNAL draft를 섞지 않는 댓글 가시성입니다.
        template:
          type: string
          minLength: 1
          maxLength: 10000
          description: allowlisted placeholder만 허용하는 plain-text 댓글 template입니다.
    CreateAutomationRequest:
      type: object
      description: SOLVED 경과 시간과 system-only close action으로 비활성 첫 policy version을 생성합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - name
      - position
      - solvedAgeMinutes
      - actionType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 관리 목록과 AUTOMATION_APPLIED provenance에 남는 정책 이름입니다.
        position:
          type: integer
          minimum: 1
          maximum: 10000
          description: 여러 active policy의 bounded scan 순서를 결정하는 고유 위치입니다.
        solvedAgeMinutes:
          type: integer
          minimum: 1
          maximum: 525600
          description: ticket.solvedAt부터 candidate eligibleAt까지 더하는 실제 경과 분입니다.
        actionType:
          type: string
          enum:
          - CLOSE_TICKET
          description: 초기 vertical slice에서 SYSTEM automation만 수행할 수 있는 종료 action입니다.
      example:
        name: 해결 티켓 72시간 후 종료
        position: 10
        solvedAgeMinutes: 4320
        actionType: CLOSE_TICKET
    AutomationVersionRequest:
      type: object
      description: 기존 active policy를 유지한 채 후속 activation에 사용할 solved-age snapshot을 추가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - name
      - solvedAgeMinutes
      - actionType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 이 version의 candidate와 execution 이력에 연결되는 정책 이름입니다.
        solvedAgeMinutes:
          type: integer
          minimum: 1
          maximum: 525600
          description: 새 candidate에만 적용되고 이전 version candidate identity를 바꾸지 않는 경과 분입니다.
        actionType:
          type: string
          enum:
          - CLOSE_TICKET
          description: staff command에서 접근할 수 없는 SOLVED to CLOSED 전이를 지정합니다.
      example:
        name: 해결 티켓 48시간 후 종료
        solvedAgeMinutes: 2880
        actionType: CLOSE_TICKET
    AutomationActivationRequest:
      type: object
      description: 다음 scan에서 새 candidate를 만들 immutable policy version을 선택합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
          description: 해당 automation aggregate에 이미 존재해야 하는 immutable version입니다.
      example:
        version: 1
    AutomationDryRunRequest:
      type: object
      description: candidate를 만들지 않고 현재 ticket projection의 solved-age 조건을 평가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - ticketNumber
      properties:
        ticketNumber:
          type: integer
          format: int64
          minimum: 1
          description: status와 solvedAt만 읽어 eligibility를 계산할 샘플 티켓 번호입니다.
      example:
        ticketNumber: 1042
    AutomationDefinition:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - position
      - currentVersion
      - aggregateVersion
      - solvedAgeMinutes
      - actionType
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: policy aggregate와 immutable version history를 식별합니다.
        name:
          type: string
          description: 응답에 선택된 immutable version의 운영 이름입니다.
        position:
          type: integer
          description: scanner가 active policy를 처리하는 deterministic 순서입니다.
        currentVersion:
          type: integer
          description: 가장 최근에 작성된 immutable policy version입니다.
        activeVersion:
          type:
          - integer
          - 'null'
          description: 새 scan candidate가 참조하며 null이면 discovery 대상에서 제외됩니다.
        aggregateVersion:
          type: integer
          format: int64
          description: 관리 동시성 ETag에만 사용하는 aggregate counter입니다.
        solvedAgeMinutes:
          type: integer
          description: candidate eligibleAt 계산에 사용되는 실제 경과 분입니다.
        actionType:
          type: string
          enum:
          - CLOSE_TICKET
          description: machine actor가 normal ticket invariant 안에서 실행할 action입니다.
        createdAt:
          type: string
          format: date-time
          description: automation aggregate를 최초 저장한 서버 시각입니다.
        updatedAt:
          type: string
          format: date-time
          description: version 또는 activation이 마지막 commit된 서버 시각입니다.
    AutomationDryRunResult:
      type: object
      additionalProperties: false
      required:
      - ticketNumber
      - automationId
      - automationVersion
      - status
      - matched
      - proposedAction
      properties:
        ticketNumber:
          type: integer
          format: int64
          description: 평가한 ticket projection 번호입니다.
        automationId:
          type: string
          format: uuid
          description: 평가 policy를 소유한 automation UUID입니다.
        automationVersion:
          type: integer
          description: solved-age threshold를 제공한 immutable version입니다.
        status:
          type: string
          description: dry-run 순간 서버가 읽은 canonical ticket status입니다.
        solvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 현재 SOLVED interval을 시작한 시각이며 다른 상태에서는 null일 수 있습니다.
        eligibleAt:
          type:
          - string
          - 'null'
          format: date-time
          description: solvedAt에 version threshold를 더한 최초 candidate 가능 시각입니다.
        matched:
          type: boolean
          description: SOLVED 상태와 eligibleAt 경과를 모두 만족했는지 나타냅니다.
        proposedAction:
          type: string
          enum:
          - CLOSE_TICKET
          description: 실제 scanner 실행 시 machine command가 시도할 action입니다.
    CreateTriggerRequest:
      type: object
      description: deterministic position과 allowlisted condition/action으로 비활성 첫 version을 생성합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - name
      - position
      - conditions
      - actions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 관리 목록과 실행 이력에 snapshot되는 운영 식별용 이름입니다.
        position:
          type: integer
          minimum: 1
          maximum: 10000
          description: 동일 ticket event에서 낮은 값부터 평가하는 고유 순서입니다.
        conditions:
          type: array
          minItems: 1
          maxItems: 50
          description: ALL은 모두 일치하고 ANY가 있으면 하나 이상 일치해야 하는 typed 조건입니다.
          items:
            $ref: '#/components/schemas/TriggerCondition'
        actions:
          type: array
          minItems: 1
          maxItems: 50
          description: 저장 순서대로 실행하되 외부 HTTP 대신 durable public event intent만 추가하는 typed 액션입니다.
          items:
            $ref: '#/components/schemas/TriggerAction'
      example:
        name: 긴급 미배정 라우팅
        position: 10
        conditions:
        - group: ALL
          field: EVENT
          operator: IS
          value: TICKET_CREATED
        - group: ALL
          field: PRIORITY
          operator: IS
          value: URGENT
        - group: ALL
          field: GROUP
          operator: NOT_PRESENT
        actions:
        - type: SET_GROUP
          groupId: 11111111-1111-4111-8111-111111111111
        - type: ENQUEUE_WEBHOOK
          eventType: ticket.trigger.executed
    CreateTriggerVersionRequest:
      type: object
      description: 현재 활성 version을 유지하면서 후속 검토와 rollback activation에 사용할 immutable definition snapshot을 추가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required:
      - name
      - conditions
      - actions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 이 version의 execution provenance에 남는 운영 이름입니다.
        conditions:
          type: array
          minItems: 1
          maxItems: 50
          description: event와 ticket state를 임의 코드 없이 비교하는 조건 snapshot입니다.
          items:
            $ref: '#/components/schemas/TriggerCondition'
        actions:
          type: array
          minItems: 1
          maxItems: 50
          description: 실행 worker가 normal ticket command와 outbox 경계로 번역할 액션 snapshot입니다.
          items:
            $ref: '#/components/schemas/TriggerAction'
      example:
        name: 긴급 미배정 라우팅 v2
        conditions:
        - group: ALL
          field: EVENT
          operator: IS
          value: TICKET_CREATED
        - group: ALL
          field: PRIORITY
          operator: IS
          value: URGENT
        actions:
        - type: SET_GROUP
          groupId: 11111111-1111-4111-8111-111111111111
    TriggerActivationRequest:
      type: object
      description: dry-run과 target invariant 검증을 마친 immutable version을 새 ticket event의 실행 snapshot 대상으로 선택합니다.
