        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatchOrConflict'
        '412':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/automations/{automationId}/versions/{version}/dry-run:
    post:
      summary: 해결 티켓 자동 종료 조건 미리 평가
      description: 현재 status와 solvedAt projection으로 eligibleAt을 계산해 proposed action만 반환하며 candidate, ticket audit, status를
        바꾸지 않습니다.
      operationId: dryRunAutomationVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements:
      - REQ-AUT-002
      tags:
      - Admin Automations
      security:
      - staffSession: []
      parameters:
      - $ref: '#/components/parameters/AutomationId'
      - $ref: '#/components/parameters/AutomationVersion'
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
