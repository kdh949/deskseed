    get:
      summary: 최초 답변 SLA 성과 집계 조회
      operationId: getFirstReplySlaAnalytics
      x-deskseed-contract-status: FROZEN
      tags:
      - Analytics
      x-deskseed-phase: P3
      x-deskseed-requirements:
      - REQ-SLA-001
      security: *id011
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - name: policyId
        in: query
        schema:
          type: string
          format: uuid
        description: 조회 조건로 전달하는 `policyId` 값입니다.
      - name: priority
        in: query
        schema:
          $ref: '#/components/schemas/TicketPriority'
        description: 조회 조건로 전달하는 `priority` 값입니다.
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Reconciled First Reply SLA counts and metric definition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstReplySlaAnalytics'
        '400':
          $ref: '#/components/responses/InvalidExpectedStaffActor'
        '401': *id006
        '403': *id006
        '409':
          $ref: '#/components/responses/StaffSessionActorMismatch'
      description: 최초 답변 SLA 성과 집계 조회 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다.
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: DESKSEED_SESSION
      description: HttpOnly 서버 세션입니다. 브라우저 요청은 선택적인 ExpectedStaffActorHeader 일관성 guard도 사용하지만, 이 헤더는 자격 증명이 아니며 인증 actor를
        결정하지 않습니다.
    customerSession:
      type: apiKey
      in: cookie
      name: DESKSEED_CUSTOMER_SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: getStaffCsrfToken이 반환하며 브라우저 세션에 귀속되는 토큰입니다.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    ExpectedStaffActorHeader:
      name: X-Deskseed-Expected-Staff-Id
      in: header
      required: false
      description: staffSession 작업을 위한 심층 방어용 브라우저 일관성 guard입니다. 전달할 때는 이미 인증된 세션 주체와 같은 하나의 정규 UUID여야 합니다. 생략은 호환되지만 형식 오류나
        중복은 InvalidExpectedStaffActor, 불일치는 Controller 실행·감사 성공·변경·세션 활동 갱신 전에 StaffSessionActorMismatch를 반환합니다. 로그인 시작과 로그인
        직후 신원 확인에서는 의도적으로 생략합니다.
      schema:
        type: string
        format: uuid
    AdminPageNumber:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호입니다.
      schema:
        type: integer
        minimum: 0
        default: 0
    AdminPageSize:
      name: size
      in: query
      required: false
      description: 관리자 목록 응답 한 페이지에서 반환할 수 있는 제한된 행 수입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IntegrationClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalReferenceId:
      name: referenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSystemIfMatch:
      name: If-Match
      in: header
      required: true
      description: 외부 시스템용 ETag이며 expectedVersion과 같은 버전을 가리켜야 합니다.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantableAuditAuthorityParam:
      name: authority
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GrantableAuditAuthority'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditInteractionHeader:
      name: X-Interaction-Id
      in: header
      required: true
      description: 감사자의 탐색·필터 상호작용 식별자이며 cursor 요청은 첫 페이지의 값을 재사용합니다.
      schema:
        type: string
        format: uuid
  headers:
    PageNumber:
      description: 응답으로 반환된 0부터 시작하는 페이지 번호입니다.
      schema:
        type: integer
        minimum: 0
    PageSize:
      description: 이 페이지에서 요청한 최대 행 수입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TotalCount:
      description: 목록 조건에 일치하는 전체 행 수입니다.
      schema:
        type: integer
        format: int64
        minimum: 0
    TotalPages:
      description: 요청한 페이지 크기를 기준으로 계산한 전체 페이지 수입니다.
      schema:
        type: integer
        minimum: 0
  responses:
    InvalidExpectedStaffActor:
      description: 선택적인 직원 actor 확인 헤더가 전달됐지만 하나의 정규 UUID 값이 아닙니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
          example:
            type: /problems/invalid-staff-session-actor
            title: Invalid staff session actor
            status: 400
            detail: The expected staff actor header is invalid.
            requestId: req-actor-400
    StaffSessionActorMismatch:
      description: 브라우저가 확인한 actor와 인증된 세션 주체가 다릅니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
          example:
            type: /problems/staff-session-actor-mismatch
            title: Staff session actor changed
            status: 409
            detail: Refresh the staff session before continuing.
            requestId: req-actor-409
    InvalidExpectedStaffActorOrBadRequest:
      description: 정규 UUID가 아닌 expected-actor 헤더를 포함한 RFC 9457 요청 검증 실패 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            invalidExpectedStaffActor:
              value:
                type: /problems/invalid-staff-session-actor
                title: Invalid staff session actor
                status: 400
                detail: The expected staff actor header is invalid.
                requestId: req-actor-400
    StaffSessionActorMismatchOrConflict:
      description: 브라우저가 확인한 actor와 인증 세션 주체가 다른 경우를 포함한 RFC 9457 비즈니스 충돌 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            staffSessionActorMismatch:
              value:
                type: /problems/staff-session-actor-mismatch
                title: Staff session actor changed
                status: 409
                detail: Refresh the staff session before continuing.
                requestId: req-actor-409
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          description: type 값입니다.
          example: https://orders.example.com/orders/ORD-2026-1042
        title:
          type: string
          description: title 값입니다.
          example: 결제가 중복으로 처리됐어요
        status:
          type: integer
          description: status의 허용된 열거 값입니다.
          example: 1
