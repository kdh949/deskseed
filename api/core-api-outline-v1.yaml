openapi: 3.1.0
info:
  title: Deskseed Core API Outline
  version: 0.6.0-implementation-ready
  description: Deskseed의 커밋된 OpenAPI 3.1 계약입니다. API 목적과 데이터 경계는 한국어로 설명하며 예시는 모두 합성 데이터입니다. 실제 비밀번호, 세션, API key 또는 고객 정보를
    문서에 입력하거나 저장하지 마세요.
x-deskseed-staff-actor-consistency:
  appliesTo: every operation whose security includes staffSession
  implementedOperationBinding: Implemented operations carry the parameter and 400/409 responses directly so OpenAPI generators
    and contract checks can discover them without interpreting this extension.
  blueprintOnlyBinding: Blueprint-only staffSession operations inherit this policy extension and receive the standard operation-level
    bindings when their contracts are frozen for implementation.
  blueprintOnlyOperationIds:
  - listTicketAudits
  - getAdminSetting
  - updateAdminSetting
  parameter:
    $ref: '#/components/parameters/ExpectedStaffActorHeader'
  invalidHeaderResponse:
    $ref: '#/components/responses/InvalidExpectedStaffActor'
  actorMismatchResponse:
    $ref: '#/components/responses/StaffSessionActorMismatch'
  establishmentExceptions:
  - getStaffCsrfToken before sign-in; authenticated token acquisition sends the guard
  - createStaffSession
  - getCurrentStaff when verifying a just-created session
  description: 브라우저는 새 세션을 만들고 확인하는 동안에만 이 헤더를 생략합니다. getStaffCsrfToken은 로그인 전에는 생략하고 인증 후 변경 요청에는 동일한 actor 값을 보내는 이중 용도
    API입니다. 비브라우저 클라이언트는 헤더를 생략할 수 있지만, 전달할 때는 하나의 정규 UUID여야 합니다. 불일치는 제공된 actor 선택, 세션 무효화, 활동 시각 갱신 또는 Controller 진입 없이
    실패로 처리됩니다.
servers:
- url: http://localhost:8080
  description: 로컬 개발 서버
tags:
- name: Customer Requests
  description: 로그인 없이 문의를 접수하고 접근 토큰으로 공개 대화만 확인하는 API입니다.
- name: Customer Portal
  description: 인증된 고객이 자신의 문의와 PUBLIC 댓글만 조회·작성하는 API입니다.
- name: Staff Session
  description: 직원 로그인 세션과 CSRF 토큰을 관리하는 API입니다.
- name: Agent Views
  description: 상담사가 접근 가능한 티켓 큐와 저장된 보기를 조회하는 API입니다.
- name: Agent Tickets
  description: 상담사용 티켓 조회·변경·이관·내부 협업 API입니다.
- name: Agent Search
  description: 권한 범위 안의 티켓을 검색하고 검색 감사를 남기는 API입니다.
- name: Agent Customers
  description: 상담사가 신규 티켓 생성 시 요청자로 선택할 기존 고객을 검색하고 검색 감사를 남기는 API입니다.
- name: Admin
  description: 직원, 그룹, 권한과 제품 설정을 관리하는 ADMIN 전용 API입니다.
- name: Integration Admin
  description: 연동 클라이언트·외부 시스템·외부 참조를 관리하는 API입니다.
- name: Audit
  description: 감사 활동 조회·보호 콘텐츠 공개·내보내기를 처리하며 조회 자체도 감사하는 API입니다.
- name: Customer Auth
  description: 고객 인증 상태와 세션을 처리하는 API입니다.
- name: Admin Schedule
  description: 버전이 고정된 영업 시간표를 생성·검증·활성화하는 API입니다.
- name: Admin SLA
  description: 최초 답변 SLA 정책의 불변 버전을 생성·검증·활성화하는 API입니다.
- name: Analytics
  description: 감사 가능한 불변 사실을 기준으로 SLA 성과를 집계하는 API입니다.
- name: Admin Ticket Configuration
  description: ADMIN이 typed custom field, versioned form, tag, custom status를 관리하는 API입니다.
- name: Ticket Configuration Runtime
  description: 고객과 상담사가 서버가 투영한 form descriptor와 ticket configuration 값을 읽고 command로 변경하는 API입니다.
- name: Knowledge Base
  description: 고객·상담사·관리자가 audience 정책에 따라 지식 문서를 탐색하고 관리하는 API입니다.
- name: Integration Clients
  description: ADMIN이 scoped Platform API client의 non-secret 운영 정책을 관리하는 contract surface입니다.
- name: Integration Webhooks
  description: ADMIN이 signed outbound webhook endpoint와 delivery log를 운영하는 contract surface입니다. Platform API와 분리됩니다.
- name: 협업 초안
  description: 소유자 연결 초안 복구와 보조 협업 API입니다.
- name: Agent Macros
  description: 상담사가 소유한 PERSONAL macro와 현재 활성화된 PERSONAL/SHARED macro를 관리·조회하는 API입니다.
- name: Admin Shared Macros
  description: 별도 capability를 가진 ADMIN이 SHARED macro의 불변 version과 활성 이력을 관리하는 API입니다.
- name: Admin Triggers
  description: 관리자가 typed condition/action의 immutable version, 활성화, 평가 순서와 부작용 없는 dry-run을 운영하는 API입니다.
- name: Admin Automations
  description: 관리자가 SOLVED 경과 시간 기반 system-only close policy의 version과 activation을 운영하는 API입니다.
paths:
  /api/v1/requests:
    post:
      summary: 고객 문의 접수
      description: 고객 문의 접수 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다. 익명 접수는 격리된 미검증
        Customer를 만들며 같은 이메일 입력만으로 기존 profile을 병합하거나 claim하지 않습니다. 유효한 고객 세션이 있으면 세션 Customer가 requester가 되고 body의 name/email은
        인증된 identity를 바꾸지 않습니다. 설정된 고객 접근 모드는 익명 접수를 거부할 수 있습니다. 두 경우 모두 명시적인 ticket 범위 조회 또는 claim 흐름에만 쓰는 일회성 request access
        token을 반환하고 ownership claim 때 revoke합니다. 문의 대상 이메일·신뢰된 실제 클라이언트 주소·전체 요청 수에는 PostgreSQL 고정 창 제한을 적용합니다. 신뢰되지 않은 peer의
        X-Forwarded-For는 client identity를 바꾸지 않으며, 제한 시 429와 초 단위 Retry-After를 반환합니다. 제한 버킷에는 원문 이메일이나 IP를 저장하지 않습니다.
      operationId: createCustomerRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security:
      - {}
      - customerSession: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-001
      - REQ-TKT-002
      - REQ-TKT-003
      - REQ-TKT-006
      - REQ-AUD-007
      - REQ-FILE-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
            example:
              name: 홍길동
              email: customer@example.com
              subject: 결제가 되지 않아요
              message: 결제 버튼을 누르면 오류가 발생합니다.
              privacyConsent: true
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequestMultipart'
            encoding:
              attachments:
                style: form
                explode: true
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 256
      x-deskseed-generic-problem: &id006
        content: &id001
          application/problem+json:
            schema:
              $ref: '#/components/schemas/Problem'
      x-deskseed-no-store-problem: &id002
        content: *id001
        headers: &id003
          Cache-Control:
            description: 고객 데이터가 포함될 수 있는 capability 보호 응답이므로 항상 `no-store`를 사용합니다.
            schema:
              type: string
              enum:
              - no-store
      responses:
        '201':
          headers:
            Cache-Control:
              description: 응답에 한 번만 제공되는 접근 토큰이 포함되므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
            Location:
              description: 접근 토큰을 포함하지 않는 고객용 안전한 문의 URL입니다.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnonymousRequestResult'
              example:
                ticketNumber: 1001
                status: NEW
                accessToken: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU
                createdAt: '2026-08-10T00:00:00Z'
        '400': *id002
        '403':
          content: *id001
          headers: *id003
        '409': *id002
        '429':
          headers:
            Retry-After:
              description: 다음 고정 창이 시작될 때까지 기다릴 초 수입니다. 1 이상의 정수이며 원문 이메일이나 IP를 포함하지 않습니다.
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              description: 고객 데이터가 포함될 수 있는 capability 보호 응답이므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
          content: *id001
        '503': *id002
        '500': *id002
  /api/v1/requests/{ticketNumber}:
    get:
      summary: 접근 토큰으로 고객 문의 조회
      operationId: getAnonymousRequest
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-008
      parameters:
      - &id004
        name: ticketNumber
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &id005
        name: X-Request-Access-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 256
      responses:
        '200':
          headers:
            Cache-Control:
              description: 응답에 고객 콘텐츠가 포함되므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestDetail'
              example:
                ticketNumber: 1001
                subject: 결제가 되지 않아요
                status: NEW
                createdAt: '2026-08-10T00:00:00Z'
                updatedAt: '2026-08-10T00:00:00Z'
                comments:
                - id: 9cc38543-3937-4aa1-a34e-ef45f7b606f8
                  authorDisplayName: 고객
                  body: 결제 버튼을 누르면 오류가 발생합니다.
                  createdAt: '2026-08-10T00:00:00Z'
        '400': *id002
        '404':
          headers:
            Cache-Control:
              description: 고객 데이터가 포함될 수 있는 capability 보호 응답이므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/request-not-found
                title: Request not found
                status: 404
                detail: The ticket number and access token do not identify a visible request.
                instance: /api/v1/requests/1001
                requestId: 9f3c4bbc-e78c-4a12-8673-7e39821e591f
        '429': *id002
        '503': *id002
      description: 접근 토큰으로 고객 문의 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/requests/{ticketNumber}/comments:
    post:
      summary: 고객 문의에 공개 답변 추가
      description: 접근 토큰으로 식별한 고객 문의에 PUBLIC 댓글을 추가하는 API입니다. 토큰은 요청 헤더로만 전달하며 URL, 응답 본문, 감사 메타데이터에 다시 노출하지 않습니다. PENDING
        문의는 OPEN으로 전환됩니다. SOLVED와 CLOSED는 자동 재개하지 않고 409를 반환합니다. 같은 ticketNumber·clientCommandId·본문의 재전송은 기존 댓글을 반환하며, 같은
        식별자를 다른 티켓 또는 본문에 재사용하면 409를 반환합니다. 댓글, 상태 변경, TicketAudit, 새 접근 grant, request-received 메일 intent는 하나의 트랜잭션에서 함께
        저장됩니다.
      operationId: addCustomerRequestComment
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      security: []
      x-deskseed-phase: M1
      x-deskseed-requirements:
      - REQ-TKT-003
      - REQ-TKT-005
      - REQ-TKT-008
      - REQ-NOTIF-001
      - REQ-CHAN-003
      - REQ-FILE-001
      parameters:
      - *id004
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCustomerComment'
            example:
              body: 결제 카드 승인 내역을 추가로 확인해 주세요.
              clientCommandId: 77777777-7777-4777-8777-777777777777
      responses:
        '201':
          headers:
            Cache-Control:
              description: capability 기반 고객 응답이므로 항상 `no-store`를 사용합니다.
              schema:
                type: string
                enum:
                - no-store
            Location:
              description: 접근 토큰을 포함하지 않는 새 PUBLIC 댓글 리소스 위치입니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComment'
        '400': *id002
        '404': *id002
        '409': *id002
        '429': *id002
        '503': *id002
  /api/v1/requests/{ticketNumber}/attachments/uploads:
    post:
      summary: 고객 문의 PUBLIC 첨부파일 quarantine upload
      operationId: createCustomerAttachmentUpload
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-FILE-001
      - REQ-TKT-003
      - REQ-TKT-008
      security: []
      parameters:
      - *id004
      - *id005
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadForm'
      responses:
        '201':
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUpload'
        '400': *id002
        '404': *id002
        '413': *id002
        '415': *id002
        '422': *id002
        '429': *id002
        '503': *id002
      description: ticket-scoped request access token을 확인한 뒤 bounded stream을 private quarantine에 기록하고 SHA-256, MIME, malware
        scan을 끝낸 CLEAN object만 반환합니다. 고객 upload는 PUBLIC link에만 쓸 수 있으며 object key·public URL·원본 bytes는 응답에 포함하지 않습니다.
  /api/v1/requests/{ticketNumber}/attachments/{attachmentId}/download:
    get:
      summary: 고객 PUBLIC 첨부파일 다운로드
      operationId: downloadCustomerAttachment
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Requests
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-FILE-001
      - REQ-TKT-008
      security: []
      parameters:
      - *id004
      - *id005
      - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400': *id002
        '404': *id002
        '409': *id002
        '503': *id002
      description: 현재 request token이 소유한 ticket의 PUBLIC comment에 link된 CLEAN attachment만 다운로드합니다. INTERNAL, quarantine, infected,
        failed, deleted 또는 expired object는 같은 not-found-safe 응답으로 차단하고 성공 download는 audit됩니다.
  /api/v1/customer/requests:
    get:
      summary: 인증 고객의 문의 목록 조회
      operationId: listCustomerRequests
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Portal
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      - REQ-TKT-005
      security:
      - customerSession: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRequestPage'
        '401': *id006
      description: 인증 고객의 문의 목록 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/customer/access-mode:
    get:
      summary: 고객 문의 접근 정책 조회
      operationId: getCustomerAccessMode
      x-deskseed-contract-status: FROZEN
      tags:
      - Customer Portal
      security: []
      x-deskseed-phase: P1
      x-deskseed-requirements:
      - REQ-TKT-004
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAccessModeResponse'
      description: 고객 문의 접근 정책 조회 API입니다. 고객용 projection만 반환하며 INTERNAL 댓글, 자식 관계, 직원 전용 필드와 감사 메타데이터를 노출하지 않습니다.
  /api/v1/agent/csrf:
    get:
      summary: 직원 세션용 CSRF 토큰 발급
      description: '직원 세션용 CSRF 토큰 발급 API입니다. 인증된 직원의 역할과 티켓 접근·변경 권한을 서버에서 확인한 뒤 처리합니다. 기존 계약의 세부 조건: Dual-use endpoint.
        A pre-sign-in caller omits the expected-actor header. An authenticated unsafe workflow supplies its confirmed actor
        snapshot so a cross-tab session change is rejected before the subsequent mutation.'
      operationId: getStaffCsrfToken
      x-deskseed-contract-status: FROZEN
      tags:
      - Staff Session
      security: []
      x-deskseed-phase: M2
      x-deskseed-requirements:
      - REQ-AUTH-005
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
