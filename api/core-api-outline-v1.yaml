        type: integer
        minimum: 0
    PageSize:
      description: 이 페이지에서 요청한 최대 행 수입니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TotalCount:
      description: 목록 조건에 일치하는 전체 행 수입니다.
      schema:
        type: integer
        format: int64
        minimum: 0
    TotalPages:
      description: 요청한 페이지 크기를 기준으로 계산한 전체 페이지 수입니다.
      schema:
        type: integer
        minimum: 0
    MacroETag:
      description: 응답 시점의 macro aggregateVersion을 나타내는 strong ETag입니다.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    MacroApplyTicketETag:
      description: 모든 action을 반영한 뒤의 ticket version을 나타내며 exact replay에서도 원래 값을 유지합니다.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    TriggerETag:
      description: 응답 시점의 트리거 aggregateVersion을 따옴표로 감싸 전달합니다.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    AutomationETag:
      description: 관리 mutation의 다음 If-Match에 사용할 automation aggregateVersion입니다.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    InvalidExpectedStaffActor:
      description: 선택적인 직원 actor 확인 헤더가 전달됐지만 하나의 정규 UUID 값이 아닙니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
          example:
            type: /problems/invalid-staff-session-actor
            title: Invalid staff session actor
            status: 400
            detail: The expected staff actor header is invalid.
            requestId: req-actor-400
    StaffSessionActorMismatch:
      description: 브라우저가 확인한 actor와 인증된 세션 주체가 다릅니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
          example:
            type: /problems/staff-session-actor-mismatch
            title: Staff session actor changed
            status: 409
            detail: Refresh the staff session before continuing.
            requestId: req-actor-409
    InvalidExpectedStaffActorOrBadRequest:
      description: 정규 UUID가 아닌 expected-actor 헤더를 포함한 RFC 9457 요청 검증 실패 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            invalidExpectedStaffActor:
              value:
                type: /problems/invalid-staff-session-actor
                title: Invalid staff session actor
                status: 400
                detail: The expected staff actor header is invalid.
                requestId: req-actor-400
    StaffSessionActorMismatchOrConflict:
      description: 브라우저가 확인한 actor와 인증 세션 주체가 다른 경우를 포함한 RFC 9457 비즈니스 충돌 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
            - $ref: '#/components/schemas/Problem'
          examples:
            staffSessionActorMismatch:
              value:
                type: /problems/staff-session-actor-mismatch
                title: Staff session actor changed
                status: 409
                detail: Refresh the staff session before continuing.
                requestId: req-actor-409
    Problem:
      description: 권한, validation, lifecycle, version, audit persistence 실패를 RFC 9457 problem detail로 반환합니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemResponse:
      description: RFC 9457 problem response 형식입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    KnowledgeCacheableResponse:
      description: audience 정책으로 필터링된 고객 navigation 응답입니다.
      headers:
        Cache-Control:
          description: PUBLIC anonymous navigation만 shared cache가 가능하며 authenticated navigation은 private이어야 합니다.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    KnowledgeArticleResponse:
      description: audience 검사를 통과한 published canonical article 응답입니다.
      headers:
        ETag:
          description: published revision·audience version에서 파생한 entity tag입니다.
          schema:
            type: string
        Last-Modified:
          description: current published revision 시각입니다.
          schema:
            type: string
            format: date-time
        Cache-Control:
          description: PUBLIC anonymous response만 shared cache 가능하며 다른 audience는 private 또는 no-store입니다.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeArticle'
    AdminKnowledgeArticleSummaryPageResponse:
      description: lifecycle·section·audience filter가 적용된 관리자 article 목록이며 canonical document 본문은 포함하지 않습니다.
      headers:
        Cache-Control:
          description: 관리자 목록은 shared cache에 저장하지 않습니다.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminKnowledgeArticleSummaryPage'
    AgentKnowledgeArticleResponse:
      description: restricted staff article 응답이며 no-store를 적용합니다.
      headers:
        Cache-Control:
          description: protected article response는 no-store입니다.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentKnowledgeArticle'
    KnowledgeSearchResponse:
      description: permission-filtered deterministic search page 응답입니다.
      headers:
        Cache-Control:
          description: query와 audience에 의존하는 search response는 no-store입니다.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeSearchPage'
    NoStoreProblem:
      description: authentication, authorization, validation, concurrency 또는 required admin/security audit persistence 실패를
        나타내는 RFC 9457 problem입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Problem'
            - $ref: '#/components/schemas/InvalidExpectedStaffActorProblem'
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
    TicketDraftConflictOrStaffSessionActorMismatch:
      description: 초안 버전 충돌 또는 브라우저가 확인한 actor와 인증 세션 주체가 다른 경우의 RFC 9457 응답입니다.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/TicketDraftConflictProblem'
            - $ref: '#/components/schemas/StaffSessionActorMismatchProblem'
    MacroListResponse:
      description: 이름 순으로 정렬된 bounded macro 목록입니다.
      content:
        application/json:
          schema:
            type: array
            maxItems: 200
            items:
              $ref: '#/components/schemas/MacroDefinition'
    MacroCreatedResponse:
      description: version 1을 가진 비활성 macro입니다.
      headers:
        ETag:
          $ref: '#/components/headers/MacroETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MacroDefinition'
    MacroWriteResponse:
      description: version 또는 활성 포인터가 변경된 macro입니다.
      headers:
        ETag:
          $ref: '#/components/headers/MacroETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MacroDefinition'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        code:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          type: integer
          format: int64
        conflictingFields:
          type: array
          items:
            type: string
      additionalProperties: true
    InvalidExpectedStaffActorProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - type
        - title
        - status
        properties:
          type:
            type: string
            const: /problems/invalid-staff-session-actor
          title:
            type: string
            const: Invalid staff session actor
          status:
            type: integer
            const: 400
    StaffSessionActorMismatchProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - type
        - title
        - status
        properties:
          type:
            type: string
            const: /problems/staff-session-actor-mismatch
          title:
            type: string
            const: Staff session actor changed
          status:
            type: integer
            const: 409
    TicketFieldConflictProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        - conflictingFields
        properties:
          type:
            type: string
            const: /problems/ticket-field-conflict
          status:
            type: integer
            const: 409
          currentVersion:
            type: integer
            format: int64
          conflictingFields:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
              - status
              - priority
              - groupId
              - assigneeId
    ClientCommandIdReusedProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          type:
            type: string
            const: /problems/client-command-id-reused
          status:
            type: integer
            const: 409
    TicketVersionPreconditionProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - currentVersion
        properties:
          type:
            type: string
            const: /problems/ticket-version-precondition-failed
          status:
            type: integer
            const: 412
          currentVersion:
            type: integer
            format: int64
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    CreateAnonymousRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - subject
      - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 익명 문의자의 이름입니다. 유효한 고객 세션이 요청자 신원을 제공하면 이 값은 사용하지 않습니다.
        email:
          type: string
          format: email
          maxLength: 254
          description: 익명 문의자의 이메일입니다. 유효한 고객 세션이 요청자 신원을 제공하면 이 값은 사용하지 않습니다.
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 20000
        privacyConsent:
          type: boolean
      description: 로그인하지 않은 고객이 새 문의를 접수할 때 사용하는 본문입니다. message는 Ticket.description이 아니라 첫 번째 PUBLIC comment로 저장됩니다.
      x-deskseed-documentation-review: MANUAL
      example:
        name: 김민아
        email: mina.kim@example.test
        subject: 주문 ORD-2026-1042의 중복 결제 확인 요청
        message: 같은 주문에 결제가 두 번 승인되었습니다. 결제 내역 확인 부탁드립니다.
        privacyConsent: true
    CreateAnonymousRequestResult:
      type: object
      additionalProperties: false
      required:
      - ticketNumber
      - status
      - accessToken
      - createdAt
      properties:
        ticketNumber:
          type: integer
          format: int64
          description: 사람이 식별하고 검색할 때 사용하는 티켓 번호입니다.
        status:
          $ref: '#/components/schemas/TicketStatus'
        accessToken:
          type: string
          description: 익명·인증 모드 모두 생성 시에만 반환하는 티켓 범위 조회·연결 복구 토큰입니다. 서버는 digest만 저장하고 소유권이 명시적으로 연결되면 활성 토큰을 폐기합니다.
        createdAt:
          type: string
          format: date-time
    CreateAnonymousRequestMultipart:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - subject
      - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 20000
        privacyConsent:
          type: boolean
        attachments:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
      description: 익명 고객이 최초 PUBLIC comment와 함께 최대 5개 파일을 multipart로 보내는 요청입니다. 서버는 ticket transaction을 열기 전에 bounded streaming,
        quarantine, MIME·malware 검사를 끝내고 CLEAN attachment만 첫 PUBLIC comment에 link합니다.
      x-deskseed-documentation-review: MANUAL
      example:
        name: 김민아
        email: mina.kim@example.test
        subject: 주문 ORD-2026-1042의 중복 결제 확인 요청
        message: 승인 내역 PDF를 함께 보냅니다.
        privacyConsent: true
        attachments:
        - approval-history.pdf
    AttachmentUploadForm:
      type: object
      additionalProperties: false
      required:
      - file
      properties:
        file:
          type: string
          format: binary
      description: 이미 인증되었거나 ticket-scoped request token을 검증한 actor가 하나의 파일을 quarantine upload할 때 사용하는 multipart 본문입니다. filename
        확장자만 신뢰하지 않으며 서버가 streaming size, MIME, checksum과 malware scan을 검사합니다.
      x-deskseed-documentation-review: MANUAL
      example:
        file: approval-history.pdf
    AddCustomerComment:
      type: object
      additionalProperties: false
      required:
      - body
      - clientCommandId
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: 고객이 문의 대화에 추가하는 PUBLIC 댓글 본문입니다. INTERNAL 메모는 지정할 수 없습니다.
        attachmentIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: 같은 ticket request-token으로 upload한 CLEAN PUBLIC attachment handle입니다. link는 이 comment/TicketAudit transaction에서만
            수행됩니다.
        clientCommandId:
          type: string
          minLength: 1
