version: "0.6"
routes:
  - path: "/"
    actor: anonymous_or_staff
    phase: m2
    screen: redirect_agent_my_open
  - path: "/agent/login"
    actor: anonymous_staff
    phase: m2
    screen: staff_login
  - path: "/agent/views/:viewKey"
    actor: agent_or_admin_with_agent_workspace
    phase: m2
    screen: agent_views
  - path: "/agent/tickets/:ticketNumber"
    actor: agent_or_admin_with_agent_workspace
    phase: m2
    screen: read_only_ticket_workspace
  - path: "/*"
    actor: any
    phase: m2
    screen: canonical_not_found
