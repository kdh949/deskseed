openapi: 3.1.0
info:
  title: Deskseed Platform API v1
  version: 1.0.0-contract
  description: Deskseed의 커밋된 OpenAPI 3.1 계약입니다. API 목적과 데이터 경계는 한국어로 설명하며 예시는 모두 합성 데이터입니다. 실제 비밀번호, 세션, API key 또는 고객 정보를
    문서에 입력하거나 저장하지 마세요.
  x-deskseed-status: implementation-ready
  x-deskseed-network-boundary: private-only
servers:
- url: https://deskseed.internal.example/api/v1/platform
security:
- bearerApiKey: []
tags:
- name: Platform Tickets
  description: 사설망의 scoped API key를 사용하는 외부 시스템용 티켓 API입니다.
paths:
  /tickets:
    post:
      tags:
      - Platform Tickets
      operationId: platformCreateTicket
      summary: 외부 시스템에서 고객 문의 또는 내부 티켓 생성
      x-deskseed-required-scope: tickets:create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Ticket created'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 외부 시스템에서 고객 문의 또는 내부 티켓 생성 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다.
  /tickets/{ticketNumber}:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    get:
      tags:
      - Platform Tickets
      operationId: platformGetTicket
      summary: 연동용 티켓 상세 조회
      x-deskseed-required-scope: tickets:read
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 연동용 티켓 상세 조회 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다.
    patch:
      tags:
      - Platform Tickets
      operationId: platformUpdateTicket
      summary: 외부 시스템에서 허용된 티켓 필드 변경
      x-deskseed-required-scope: tickets:update
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Updated ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 외부 시스템에서 허용된 티켓 필드 변경 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다.
  /tickets/{ticketNumber}/internal-comments:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    post:
      tags:
      - Platform Tickets
      operationId: platformAddInternalComment
      summary: 외부 시스템에서 내부 메모 추가
      x-deskseed-required-scope: tickets:comment:internal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInternalCommentRequest'
      responses:
        '201':
          description: '요청이 정상적으로 처리되었습니다. 세부 계약: Internal comment created'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalComment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 외부 시스템에서 내부 메모 추가 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다.
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Deskseed scoped API key
  parameters:
    TicketNumber:
      name: ticketNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
  headers:
    ETag:
      schema:
        type: string
    RequestId:
      schema:
        type: string
    RetryAfter:
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: 현재 클라이언트의 요청 제한 구간이 초기화되는 UTC epoch 초입니다.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: RFC 9457 Problem Details 오류 응답입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 클라이언트 요청 제한을 초과했습니다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateTicketRequest:
      type: object
      additionalProperties: false
      example:
        kind: CUSTOMER_REQUEST
        subject: Order 42 needs assistance
        message: The fulfillment status did not update.
        requester:
          name: Mina Kim
          email: mina@example.com
        priority: NORMAL
      required:
      - kind
      - subject
      - message
      properties:
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
          description: kind 값입니다.
          example: CUSTOMER_REQUEST
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: subject에 사용하는 입력 또는 표시 문자열입니다.
          example: 결제가 중복으로 처리됐어요
        message:
          type: string
          minLength: 1
          maxLength: 50000
          description: CUSTOMER_REQUEST에는 첫 PUBLIC 코멘트를, INTERNAL_WORK_ITEM에는 첫 INTERNAL 코멘트를 생성합니다.
          example: 주문 ORD-2026-1042의 결제가 두 번 승인되어 확인이 필요합니다.
        requester:
          $ref: '#/components/schemas/RequesterInput'
          description: requester 값입니다.
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          default: NORMAL
          description: priority의 허용된 열거 값입니다.
          example: LOW
        groupId:
          type: string
          format: uuid
          description: groupId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        assigneeId:
          type: string
          format: uuid
          description: assigneeId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
      allOf:
      - if:
          properties:
            kind:
              const: CUSTOMER_REQUEST
        then:
          required:
          - requester
      description: CreateTicketRequest 요청 또는 응답 모델입니다.
    RequesterInput:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: name에 사용하는 입력 또는 표시 문자열입니다.
          example: 김고객
        email:
          type: string
          format: email
          maxLength: 320
          description: email 값입니다.
          example: customer@example.com
      description: RequesterInput 요청 또는 응답 모델입니다.
      example:
        name: 김고객
        email: customer@example.com
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      example:
        status: OPEN
        priority: HIGH
      properties:
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
          description: status의 허용된 열거 값입니다.
          example: NEW
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: priority의 허용된 열거 값입니다.
          example: LOW
        groupId:
          type:
          - string
          - 'null'
          format: uuid
          description: groupId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
          description: assigneeId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
      description: UpdateTicketRequest 요청 또는 응답 모델입니다.
    AddInternalCommentRequest:
      type: object
      additionalProperties: false
      example:
        body: Warehouse reconciliation started.
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
          description: body에 사용하는 입력 또는 표시 문자열입니다.
          example: 주문 ORD-2026-1042의 결제가 두 번 승인되어 확인이 필요합니다.
      description: AddInternalCommentRequest 요청 또는 응답 모델입니다.
    PlatformTicket:
      type: object
      additionalProperties: false
      example:
        ticketNumber: 1000
        kind: CUSTOMER_REQUEST
        subject: Order 42 needs assistance
        status: OPEN
        priority: HIGH
        groupId: null
        assigneeId: null
        version: 1
        createdAt: '2026-08-12T00:00:00Z'
        updatedAt: '2026-08-12T00:01:00Z'
      required:
      - ticketNumber
      - kind
      - subject
      - status
      - priority
      - version
      - createdAt
      - updatedAt
      properties:
        ticketNumber:
          type: integer
          format: int64
          description: 사람이 식별하고 검색할 때 사용하는 티켓 번호입니다.
          example: 1042
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
          description: kind 값입니다.
          example: CUSTOMER_REQUEST
        subject:
          type: string
          description: subject에 사용하는 입력 또는 표시 문자열입니다.
          example: 결제가 중복으로 처리됐어요
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
          - CLOSED
          description: status의 허용된 열거 값입니다.
          example: NEW
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          description: priority의 허용된 열거 값입니다.
          example: LOW
        groupId:
          type:
          - string
          - 'null'
          format: uuid
          description: groupId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
          description: assigneeId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        version:
          type: integer
          format: int64
          minimum: 0
          description: 낙관적 동시성 제어에 사용하는 버전입니다.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: UTC 기준 ISO 8601 시각입니다.
          example: '2026-08-10T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: UTC 기준 ISO 8601 시각입니다.
          example: '2026-08-10T09:00:00Z'
      description: PlatformTicket 요청 또는 응답 모델입니다.
    InternalComment:
      type: object
      additionalProperties: false
      example:
        id: 4df6c6b5-3a31-4e8e-9d6c-49d6d12c5f80
        ticketNumber: 1000
        visibility: INTERNAL
        body: Warehouse reconciliation started.
        createdAt: '2026-08-12T00:02:00Z'
      required:
      - id
      - ticketNumber
      - visibility
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: id 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
        ticketNumber:
          type: integer
          format: int64
          description: 사람이 식별하고 검색할 때 사용하는 티켓 번호입니다.
          example: 1042
        visibility:
          type: string
          const: INTERNAL
          description: visibility의 허용된 열거 값입니다.
          example: INTERNAL
        body:
          type: string
          description: body에 사용하는 입력 또는 표시 문자열입니다.
          example: 주문 ORD-2026-1042의 결제가 두 번 승인되어 확인이 필요합니다.
        createdAt:
          type: string
          format: date-time
          description: UTC 기준 ISO 8601 시각입니다.
          example: '2026-08-10T09:00:00Z'
      description: InternalComment 요청 또는 응답 모델입니다.
    Problem:
      type: object
      additionalProperties: true
      example:
        type: /problems/idempotency-key-reused
        title: Idempotency key reused
        status: 409
        detail: The idempotency key was already used with a different request.
        requestId: req-01
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
          description: type 값입니다.
          example: https://orders.example.com/orders/ORD-2026-1042
        title:
          type: string
          description: title 값입니다.
          example: 결제가 중복으로 처리됐어요
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: status의 허용된 열거 값입니다.
          example: 400
        detail:
          type: string
          description: detail에 사용하는 입력 또는 표시 문자열입니다.
          example: 예시 값
        requestId:
          type: string
          description: requestId 식별자입니다.
          example: 11111111-1111-4111-8111-111111111111
      description: Problem 요청 또는 응답 모델입니다.
