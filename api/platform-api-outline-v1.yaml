openapi: 3.1.0
info:
  title: Deskseed Platform API v1
  version: 1.0.0-contract
  description: Deskseed의 커밋된 OpenAPI 3.1 계약입니다. API 목적과 데이터 경계는 한국어로 설명하며 예시는 모두 합성 데이터입니다. 실제 비밀번호, 세션, API key 또는 고객 정보를
    문서에 입력하거나 저장하지 마세요.
  x-deskseed-status: implementation-ready
  x-deskseed-network-boundary: private-only
servers:
- url: https://deskseed.internal.example/api/v1/platform
security:
- bearerApiKey: []
tags:
- name: Platform Tickets
  description: 사설망의 scoped API key를 사용하는 외부 시스템용 티켓 API입니다.
paths:
  /tickets:
    post:
      tags:
      - Platform Tickets
      operationId: platformCreateTicket
      summary: 외부 시스템에서 고객 문의 또는 내부 티켓 생성
      x-deskseed-required-scope: tickets:create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
      description: 외부 시스템에서 고객 문의 또는 내부 티켓 생성 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다. PostgreSQL DB-clock atomic bucket은 모든 instance가 공유하며 persistence가 불가능하면 quota를 우회하지 않고 503을 반환합니다. CUSTOMER_REQUEST는 creation audit과 같은 트랜잭션에서 First Reply SLA 시작 fact를 한 번만 만들며, 같은 Idempotency-Key 재전송은 audit 또는 SLA target을 추가로 만들지 않습니다. INTERNAL_WORK_ITEM은 First Reply SLA 대상이 아닙니다.
  /tickets/{ticketNumber}:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    get:
      tags:
      - Platform Tickets
      operationId: platformGetTicket
      summary: 연동용 티켓 상세 조회
      x-deskseed-required-scope: tickets:read
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
      description: 연동용 티켓 상세 조회 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다. PostgreSQL limiter persistence 실패는 인증·scope를 우회하지 않고 503으로 fail closed합니다.
    patch:
      tags:
      - Platform Tickets
      operationId: platformUpdateTicket
      summary: 외부 시스템에서 허용된 티켓 필드 변경
      x-deskseed-required-scope: tickets:update
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
      description: 외부 시스템에서 허용된 티켓 필드 변경 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다. PostgreSQL limiter persistence 실패는 quota를 우회하지 않고 503으로 fail closed합니다.
  /tickets/{ticketNumber}/internal-comments:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    post:
      tags:
      - Platform Tickets
      operationId: platformAddInternalComment
      summary: 외부 시스템에서 내부 메모 추가
      x-deskseed-required-scope: tickets:comment:internal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInternalCommentRequest'
      responses:
        '201':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalComment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/RateLimitUnavailable'
      description: 외부 시스템에서 내부 메모 추가 API입니다. INTEGRATION_CLIENT가 scoped API key와 resource constraint 검사를 통과한 뒤 사용합니다. PostgreSQL limiter persistence 실패는 quota를 우회하지 않고 503으로 fail closed합니다.
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Deskseed scoped API key
  parameters:
    TicketNumber:
      name: ticketNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
  headers:
    ETag:
      schema:
        type: string
    RequestId:
      schema:
        type: string
    RetryAfter:
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: 현재 클라이언트의 요청 제한 구간이 초기화되는 UTC epoch 초입니다.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: RFC 9457 Problem Details 오류 응답입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 클라이언트 요청 제한을 초과했습니다.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitUnavailable:
      description: PostgreSQL rate-limit bucket을 원자적으로 소비할 수 없어 요청을 fail closed했습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/platform-rate-limit-unavailable
            title: Platform rate limit unavailable
            status: 503
            detail: The request cannot be accepted while the shared rate limiter is unavailable.
  schemas:
    CreateTicketRequest:
      type: object
      additionalProperties: false
      example:
        kind: CUSTOMER_REQUEST
        subject: 주문 ORD-2026-1042의 배송 상태 확인 요청
        message: 배송 완료로 표시되었지만 상품을 받지 못했습니다.
        requester:
          name: 김민아
          email: mina.kim@example.test
        priority: NORMAL
      required:
      - kind
      - subject
      - message
      properties:
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 50000
          description: CUSTOMER_REQUEST에는 첫 PUBLIC 코멘트를, INTERNAL_WORK_ITEM에는 첫 INTERNAL 코멘트를 생성합니다.
        requester:
          $ref: '#/components/schemas/RequesterInput'
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          default: NORMAL
        groupId:
          type: string
          format: uuid
        assigneeId:
          type: string
          format: uuid
      allOf:
      - if:
          properties:
            kind:
              const: CUSTOMER_REQUEST
        then:
          required:
          - requester
      description: 외부 시스템이 scoped API key와 resource constraint 범위 안에서 고객 문의를 만들 때 사용하는 요청입니다. CUSTOMER_REQUEST의 message는 첫
        PUBLIC comment로 저장됩니다.
      x-deskseed-documentation-review: MANUAL
    RequesterInput:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      example:
        status: OPEN
        priority: HIGH
      properties:
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
      description: 외부 시스템이 자신에게 허용된 티켓 필드만 변경할 때 사용하는 요청입니다. HTTP If-Match의 현재 버전과 권한 범위를 서버가 함께 확인합니다.
      x-deskseed-documentation-review: MANUAL
    AddInternalCommentRequest:
      type: object
      additionalProperties: false
      example:
        body: 물류 시스템에서 출고 스캔 이력을 재확인하고 있습니다.
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
      description: 외부 시스템이 고객에게 보이지 않는 INTERNAL 댓글을 티켓에 추가할 때 사용하는 요청입니다. 이 댓글은 고객 API의 대화 projection에 반환되지 않습니다.
      x-deskseed-documentation-review: MANUAL
    PlatformTicket:
      type: object
      additionalProperties: false
      example:
        ticketNumber: 1000
        kind: CUSTOMER_REQUEST
        subject: Order 42 needs assistance
        status: OPEN
        priority: HIGH
        groupId: null
        assigneeId: null
        version: 1
        createdAt: '2026-08-12T00:00:00Z'
        updatedAt: '2026-08-12T00:01:00Z'
      required:
      - ticketNumber
      - kind
      - subject
      - status
      - priority
      - version
      - createdAt
      - updatedAt
      properties:
        ticketNumber:
          type: integer
          format: int64
          description: 사람이 식별하고 검색할 때 사용하는 티켓 번호입니다.
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
        subject:
          type: string
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
          - CLOSED
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InternalComment:
      type: object
      additionalProperties: false
      example:
        id: 4df6c6b5-3a31-4e8e-9d6c-49d6d12c5f80
        ticketNumber: 1000
        visibility: INTERNAL
        body: Warehouse reconciliation started.
        createdAt: '2026-08-12T00:02:00Z'
      required:
      - id
      - ticketNumber
      - visibility
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        ticketNumber:
          type: integer
          format: int64
          description: 사람이 식별하고 검색할 때 사용하는 티켓 번호입니다.
        visibility:
          type: string
          const: INTERNAL
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      example:
        type: /problems/idempotency-key-reused
        title: Idempotency key reused
        status: 409
        detail: The idempotency key was already used with a different request.
        requestId: req-01
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
x-deskseed-documentation-ownership: MANUAL
