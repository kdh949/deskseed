openapi: 3.1.0
info:
  title: Deskseed Platform API
  version: 0.1.0-outline
  description: >-
    Contract outline for external machine integrations. This file defines initial
    operations and governance but must be completed before implementation/release.
  x-deskseed-status: outline-not-implementation-ready
servers:
  - url: https://deskseed.example.com/api/v1/platform
security:
  - bearerApiKey: []
paths:
  /tickets:
    post:
      operationId: createTicket
      summary: Create a customer request or internal work item
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketNumber}:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      operationId: getTicket
      summary: Get a ticket using the integration projection
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Ticket
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateTicket
      summary: Update allowed ticket fields
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketNumber}/comments:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    post:
      operationId: createTicketComment
      summary: Add a public or internal comment according to scope
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketNumber}/external-references:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      operationId: listExternalReferences
      responses:
        '200':
          description: External references
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalReference'
    post:
      operationId: createExternalReference
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalReferenceRequest'
      responses:
        '201':
          description: Reference created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalReference'
        '409':
          $ref: '#/components/responses/Problem'
  /ticket-events:
    get:
      operationId: listTicketEvents
      summary: Consume committed ticket integration events incrementally
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Deskseed API key
  parameters:
    TicketNumber:
      name: ticketNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
  headers:
    ETag:
      description: Ticket version ETag
      schema:
        type: string
    RequestId:
      description: Accepted server request identifier
      schema:
        type: string
  responses:
    Problem:
      description: Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [kind, subject, initialComment]
      properties:
        kind:
          type: string
          enum: [CUSTOMER_REQUEST, INTERNAL_WORK_ITEM]
        requester:
          $ref: '#/components/schemas/RequesterInput'
        subject:
          type: string
          minLength: 1
          maxLength: 300
        initialComment:
          $ref: '#/components/schemas/CreateCommentRequest'
        groupId:
          type: [string, 'null']
          format: uuid
        assigneeId:
          type: [string, 'null']
          format: uuid
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        externalReferences:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CreateExternalReferenceRequest'
    RequesterInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [NEW, OPEN, PENDING, ON_HOLD, SOLVED]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        groupId:
          type: [string, 'null']
          format: uuid
        assigneeId:
          type: [string, 'null']
          format: uuid
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [visibility, body]
      properties:
        visibility:
          type: string
          enum: [PUBLIC, INTERNAL]
        body:
          type: string
          minLength: 1
          maxLength: 100000
    CreateExternalReferenceRequest:
      type: object
      additionalProperties: false
      required: [systemKey, objectType, externalId]
      properties:
        systemKey:
          type: string
          minLength: 1
          maxLength: 100
        objectType:
          type: string
          enum: [ORDER, PAYMENT, REFUND, USER, STORE, OPS_CASE, CUSTOM]
        externalId:
          type: string
          minLength: 1
          maxLength: 300
        displayLabel:
          type: [string, 'null']
          maxLength: 300
        deepLinkUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2000
        metadataSnapshot:
          type: [object, 'null']
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
    Ticket:
      type: object
      required: [ticketNumber, kind, subject, status, priority, version, createdAt, updatedAt]
      properties:
        ticketNumber:
          type: integer
          format: int64
        kind:
          type: string
        subject:
          type: string
        status:
          type: string
        priority:
          type: string
        groupId:
          type: [string, 'null']
          format: uuid
        assigneeId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Comment:
      type: object
      required: [id, visibility, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        visibility:
          type: string
          enum: [PUBLIC, INTERNAL]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    ExternalReference:
      allOf:
        - $ref: '#/components/schemas/CreateExternalReferenceRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    EventPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
      additionalProperties: true
