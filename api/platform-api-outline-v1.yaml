openapi: 3.1.0
info:
  title: Deskseed Platform API v1
  version: 1.0.0-contract
  description: Implementation-ready private-network machine API for ticket create/read/update and INTERNAL comments. Network
    placement is defense in depth and never replaces scoped API-key authentication, resource constraints, rate limiting, idempotency,
    concurrency control, and audit.
  x-deskseed-status: implementation-ready
  x-deskseed-network-boundary: private-only
servers:
- url: https://deskseed.internal.example/api/v1/platform
security:
- bearerApiKey: []
tags:
- name: Platform Tickets
paths:
  /tickets:
    post:
      tags:
      - Platform Tickets
      operationId: platformCreateTicket
      summary: Create a customer request or an internal work item
      x-deskseed-required-scope: tickets:create
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketNumber}:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    get:
      tags:
      - Platform Tickets
      operationId: platformGetTicket
      summary: Read the integration-safe ticket projection
      x-deskseed-required-scope: tickets:read
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Ticket
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags:
      - Platform Tickets
      operationId: platformUpdateTicket
      summary: Update the allowlisted ticket fields
      x-deskseed-required-scope: tickets:update
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTicket'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tickets/{ticketNumber}/internal-comments:
    parameters:
    - $ref: '#/components/parameters/TicketNumber'
    post:
      tags:
      - Platform Tickets
      operationId: platformAddInternalComment
      summary: Add an INTERNAL comment; PUBLIC visibility is not part of Platform API v1
      x-deskseed-required-scope: tickets:comment:internal
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInternalCommentRequest'
      responses:
        '201':
          description: Internal comment created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalComment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: Deskseed scoped API key
  parameters:
    TicketNumber:
      name: ticketNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 100
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 100
  headers:
    ETag:
      schema:
        type: string
    RequestId:
      schema:
        type: string
    RetryAfter:
      schema:
        type: integer
        minimum: 1
    RateLimitLimit:
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: UTC epoch second when the current client window resets.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Client rate limit exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateTicketRequest:
      type: object
      additionalProperties: false
      example:
        kind: CUSTOMER_REQUEST
        subject: Order 42 needs assistance
        message: The fulfillment status did not update.
        requester:
          name: Mina Kim
          email: mina@example.com
        priority: NORMAL
      required:
      - kind
      - subject
      - message
      properties:
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 50000
          description: Creates the first PUBLIC comment for CUSTOMER_REQUEST and the first INTERNAL comment for INTERNAL_WORK_ITEM.
        requester:
          $ref: '#/components/schemas/RequesterInput'
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
          default: NORMAL
        groupId:
          type: string
          format: uuid
        assigneeId:
          type: string
          format: uuid
      allOf:
      - if:
          properties:
            kind:
              const: CUSTOMER_REQUEST
        then:
          required:
          - requester
    RequesterInput:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      example:
        status: OPEN
        priority: HIGH
      properties:
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
    AddInternalCommentRequest:
      type: object
      additionalProperties: false
      example:
        body: Warehouse reconciliation started.
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 50000
    PlatformTicket:
      type: object
      additionalProperties: false
      example:
        ticketNumber: 1000
        kind: CUSTOMER_REQUEST
        subject: Order 42 needs assistance
        status: OPEN
        priority: HIGH
        groupId: null
        assigneeId: null
        version: 1
        createdAt: '2026-08-12T00:00:00Z'
        updatedAt: '2026-08-12T00:01:00Z'
      required:
      - ticketNumber
      - kind
      - subject
      - status
      - priority
      - version
      - createdAt
      - updatedAt
      properties:
        ticketNumber:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - CUSTOMER_REQUEST
          - INTERNAL_WORK_ITEM
        subject:
          type: string
        status:
          type: string
          enum:
          - NEW
          - OPEN
          - PENDING
          - ON_HOLD
          - SOLVED
          - CLOSED
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        assigneeId:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InternalComment:
      type: object
      additionalProperties: false
      example:
        id: 4df6c6b5-3a31-4e8e-9d6c-49d6d12c5f80
        ticketNumber: 1000
        visibility: INTERNAL
        body: Warehouse reconciliation started.
        createdAt: '2026-08-12T00:02:00Z'
      required:
      - id
      - ticketNumber
      - visibility
      - body
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        ticketNumber:
          type: integer
          format: int64
        visibility:
          type: string
          const: INTERNAL
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      example:
        type: /problems/idempotency-key-reused
        title: Idempotency key reused
        status: 409
        detail: The idempotency key was already used with a different request.
        requestId: req-01
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
