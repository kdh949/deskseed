x-deskseed-fragment:
  owner: triggers-automations
paths:
  /api/v1/admin/triggers:
    get:
      summary: 트리거 정의와 활성 버전 목록 조회
      description: 관리자가 deterministic position 순서로 현재 정의와 immutable version projection을 조회합니다.
      operationId: listTriggers
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: 관리 권한으로 볼 수 있는 트리거 정의를 position과 UUID 순서로 반환합니다., content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/TriggerDefinition'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
    post:
      summary: 트리거 초안 정의 생성
      description: allowlisted condition과 action만 가진 첫 immutable version을 비활성 상태로 저장하고 admin/security audit과 함께 commit합니다.
      operationId: createTrigger
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTriggerRequest'}}}}
      responses:
        '201': {description: 활성화 전 검토할 트리거 첫 버전이며 ETag는 정의 aggregateVersion을 나타냅니다., headers: {ETag: {$ref: '#/components/headers/TriggerETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/triggers/{triggerId}/versions:
    post:
      summary: 트리거 불변 버전 추가
      description: 기존 활성 버전을 유지한 채 조건과 액션의 새 immutable version을 생성하며 stale aggregate ETag를 거절합니다.
      operationId: createTriggerVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TriggerId'}, {$ref: '#/components/parameters/TriggerIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTriggerVersionRequest'}}}}
      responses:
        '200': {description: 새 draft version과 기존 활성 version을 함께 보여 주는 정의 projection입니다., headers: {ETag: {$ref: '#/components/headers/TriggerETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/triggers/{triggerId}/activation:
    put:
      summary: 검증된 트리거 버전 활성화
      description: target group의 현재 활성 상태를 다시 검사한 뒤 선택한 version을 원자적으로 활성화하고 activation history를 추가합니다.
      operationId: activateTriggerVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TriggerId'}, {$ref: '#/components/parameters/TriggerIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerActivationRequest'}}}}
      responses:
        '200': {description: 실행 경계에서 snapshot 대상이 된 활성 버전을 포함한 정의 projection입니다., headers: {ETag: {$ref: '#/components/headers/TriggerETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      summary: 활성 트리거 즉시 비활성화
      description: 새 ticket event의 snapshot 대상에서 정의를 제외하고 직전 활성 version을 immutable activation history에 남깁니다.
      operationId: deactivateTrigger
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TriggerId'}, {$ref: '#/components/parameters/TriggerIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '200': {description: activeVersion이 제거되고 이력이 보존된 정의 projection입니다., headers: {ETag: {$ref: '#/components/headers/TriggerETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/triggers/{triggerId}/position:
    put:
      summary: 트리거 평가 순서 교환
      description: 요청 position을 점유한 정의와 현재 정의의 위치를 한 transaction에서 교환하고 변경 전후 순서를 감사합니다.
      operationId: repositionTrigger
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TriggerId'}, {$ref: '#/components/parameters/TriggerIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerPositionRequest'}}}}
      responses:
        '200': {description: 변경된 deterministic position과 aggregateVersion을 가진 정의 projection입니다., headers: {ETag: {$ref: '#/components/headers/TriggerETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/triggers/{triggerId}/versions/{triggerVersion}/dry-run:
    post:
      summary: 샘플 티켓에서 트리거 부작용 없이 평가
      description: 저장된 ticket projection과 선택한 event type으로 all/any condition을 평가하고 proposed action 및 invariant failure만 반환하며 ticket audit이나 webhook intent를 만들지 않습니다.
      operationId: dryRunTriggerVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-001]
      tags: [Admin Triggers]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/TriggerId'}, {$ref: '#/components/parameters/TriggerVersion'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDryRunRequest'}}}}
      responses:
        '200': {description: condition별 일치 결과와 실행 전 invariant failure를 포함하되 어떤 영속 상태도 바꾸지 않습니다., content: {application/json: {schema: {$ref: '#/components/schemas/TriggerDryRunResult'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
  /api/v1/admin/automations:
    get:
      summary: 시간 기반 자동화 정의 목록 조회
      description: 관리자가 solved-age 정책의 immutable version과 현재 activation 상태를 deterministic position 순서로 조회합니다.
      operationId: listAutomations
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: 관리 가능한 시간 기반 자동화 정의 projection을 반환합니다., content: {application/json: {schema: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AutomationDefinition'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
    post:
      summary: 해결 티켓 자동 종료 초안 생성
      description: SOLVED 지속 시간과 system-only CLOSE_TICKET action을 immutable 첫 version으로 저장하고 비활성 상태에서 검토하게 합니다.
      operationId: createAutomation
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateAutomationRequest'}}}}
      responses:
        '201': {description: scanner 대상이 되기 전 검토할 automation 첫 version입니다., headers: {ETag: {$ref: '#/components/headers/AutomationETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/automations/{automationId}/versions:
    post:
      summary: 자동 종료 정책 버전 추가
      description: 현재 활성 version을 유지한 채 solved-age minutes의 새 immutable version을 생성하고 stale ETag를 거절합니다.
      operationId: createAutomationVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/AutomationId'}, {$ref: '#/components/parameters/AutomationIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationVersionRequest'}}}}
      responses:
        '200': {description: 새 policy version과 기존 활성 version을 함께 표시합니다., headers: {ETag: {$ref: '#/components/headers/AutomationETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/automations/{automationId}/activation:
    put:
      summary: 자동 종료 정책 버전 활성화
      description: 선택한 immutable version을 다음 bounded scan의 candidate policy로 원자적으로 교체하고 activation history를 남깁니다.
      operationId: activateAutomationVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/AutomationId'}, {$ref: '#/components/parameters/AutomationIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationActivationRequest'}}}}
      responses:
        '200': {description: scanner가 새 candidate에 사용할 activeVersion을 포함합니다., headers: {ETag: {$ref: '#/components/headers/AutomationETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      summary: 시간 기반 자동화 비활성화
      description: 다음 scan에서 새 candidate 생성을 중단하되 이미 실행된 history와 candidate identity는 보존합니다.
      operationId: deactivateAutomation
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/AutomationId'}, {$ref: '#/components/parameters/AutomationIfMatch'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      responses:
        '200': {description: activeVersion이 null이고 immutable history가 유지된 definition입니다., headers: {ETag: {$ref: '#/components/headers/AutomationETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/automations/{automationId}/versions/{version}/dry-run:
    post:
      summary: 해결 티켓 자동 종료 조건 미리 평가
      description: 현재 status와 solvedAt projection으로 eligibleAt을 계산해 proposed action만 반환하며 candidate, ticket audit, status를 바꾸지 않습니다.
      operationId: dryRunAutomationVersion
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-AUT-002]
      tags: [Admin Automations]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/AutomationId'}, {$ref: '#/components/parameters/AutomationVersion'}, {$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDryRunRequest'}}}}
      responses:
        '200': {description: 현재 기준 조건 일치 여부와 정확한 eligibleAt을 side effect 없이 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/AutomationDryRunResult'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
components:
  parameters:
    TriggerId: {name: triggerId, in: path, required: true, description: immutable version history를 소유한 트리거 aggregate UUID입니다., schema: {type: string, format: uuid}}
    TriggerVersion: {name: triggerVersion, in: path, required: true, description: 조건과 액션 snapshot을 고정하는 양의 version입니다., schema: {type: integer, minimum: 1}}
    TriggerIfMatch: {name: If-Match, in: header, required: true, description: 트리거 aggregateVersion과 정확히 일치해야 하는 strong precondition입니다., schema: {type: string, pattern: '^"[0-9]+"$', minLength: 3, maxLength: 24}}
    AutomationId: {name: automationId, in: path, required: true, description: solved-age policy의 immutable history를 소유한 automation UUID입니다., schema: {type: string, format: uuid}}
    AutomationVersion: {name: version, in: path, required: true, description: solved-age minutes와 CLOSE_TICKET action을 고정한 version입니다., schema: {type: integer, minimum: 1}}
    AutomationIfMatch: {name: If-Match, in: header, required: true, description: automation aggregateVersion과 정확히 일치해야 하는 strong precondition입니다., schema: {type: string, pattern: '^"[0-9]+"$', minLength: 3, maxLength: 24}}
  headers:
    TriggerETag: {description: 응답 시점의 트리거 aggregateVersion을 따옴표로 감싸 전달합니다., schema: {type: string, pattern: '^"[0-9]+"$'}}
    AutomationETag: {description: 관리 mutation의 다음 If-Match에 사용할 automation aggregateVersion입니다., schema: {type: string, pattern: '^"[0-9]+"$'}}
  schemas:
    CreateAutomationRequest:
      type: object
      description: SOLVED 경과 시간과 system-only close action으로 비활성 첫 policy version을 생성합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [name, position, solvedAgeMinutes, actionType]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: 관리 목록과 AUTOMATION_APPLIED provenance에 남는 정책 이름입니다.}
        position: {type: integer, minimum: 1, maximum: 10000, description: 같은 solved interval candidate에 snapshot되어 낮은 policy가 먼저 완료되는 고유 위치입니다.}
        solvedAgeMinutes: {type: integer, minimum: 1, maximum: 525600, description: ticket.solvedAt부터 candidate eligibleAt까지 더하는 실제 경과 분입니다.}
        actionType: {type: string, enum: [CLOSE_TICKET], description: 초기 vertical slice에서 SYSTEM automation만 수행할 수 있는 종료 action입니다.}
      example: {name: 해결 티켓 72시간 후 종료, position: 10, solvedAgeMinutes: 4320, actionType: CLOSE_TICKET}
    AutomationVersionRequest:
      type: object
      description: 기존 active policy를 유지한 채 후속 activation에 사용할 solved-age snapshot을 추가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [name, solvedAgeMinutes, actionType]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: 이 version의 candidate와 execution 이력에 연결되는 정책 이름입니다.}
        solvedAgeMinutes: {type: integer, minimum: 1, maximum: 525600, description: 새 candidate에만 적용되고 이전 version candidate identity를 바꾸지 않는 경과 분입니다.}
        actionType: {type: string, enum: [CLOSE_TICKET], description: staff command에서 접근할 수 없는 SOLVED to CLOSED 전이를 지정합니다.}
      example: {name: 해결 티켓 48시간 후 종료, solvedAgeMinutes: 2880, actionType: CLOSE_TICKET}
    AutomationActivationRequest:
      type: object
      description: 다음 scan에서 새 candidate를 만들 immutable policy version을 선택합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: 해당 automation aggregate에 이미 존재해야 하는 immutable version입니다.}
      example: {version: 1}
    AutomationDryRunRequest:
      type: object
      description: candidate를 만들지 않고 현재 ticket projection의 solved-age 조건을 평가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [ticketNumber]
      properties:
        ticketNumber: {type: integer, format: int64, minimum: 1, description: status와 solvedAt만 읽어 eligibility를 계산할 샘플 티켓 번호입니다.}
      example: {ticketNumber: 1042}
    AutomationDefinition:
      type: object
      additionalProperties: false
      required: [id, name, position, currentVersion, aggregateVersion, solvedAgeMinutes, actionType, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: policy aggregate와 immutable version history를 식별합니다.}
        name: {type: string, description: 응답에 선택된 immutable version의 운영 이름입니다.}
        position: {type: integer, description: 같은 solved interval의 candidate lease와 실행 순서에 snapshot되는 deterministic 위치입니다.}
        currentVersion: {type: integer, description: 가장 최근에 작성된 immutable policy version입니다.}
        activeVersion: {type: [integer, 'null'], description: 새 scan candidate가 참조하며 null이면 discovery 대상에서 제외됩니다.}
        aggregateVersion: {type: integer, format: int64, description: 관리 동시성 ETag에만 사용하는 aggregate counter입니다.}
        solvedAgeMinutes: {type: integer, description: candidate eligibleAt 계산에 사용되는 실제 경과 분입니다.}
        actionType: {type: string, enum: [CLOSE_TICKET], description: machine actor가 normal ticket invariant 안에서 실행할 action입니다.}
        createdAt: {type: string, format: date-time, description: automation aggregate를 최초 저장한 서버 시각입니다.}
        updatedAt: {type: string, format: date-time, description: version 또는 activation이 마지막 commit된 서버 시각입니다.}
    AutomationDryRunResult:
      type: object
      additionalProperties: false
      required: [ticketNumber, automationId, automationVersion, status, matched, proposedAction]
      properties:
        ticketNumber: {type: integer, format: int64, description: 평가한 ticket projection 번호입니다.}
        automationId: {type: string, format: uuid, description: 평가 policy를 소유한 automation UUID입니다.}
        automationVersion: {type: integer, description: solved-age threshold를 제공한 immutable version입니다.}
        status: {type: string, description: dry-run 순간 서버가 읽은 canonical ticket status입니다.}
        solvedAt: {type: [string, 'null'], format: date-time, description: 현재 SOLVED interval을 시작한 시각이며 다른 상태에서는 null일 수 있습니다.}
        eligibleAt: {type: [string, 'null'], format: date-time, description: solvedAt에 version threshold를 더한 최초 candidate 가능 시각입니다.}
        matched: {type: boolean, description: SOLVED 상태와 eligibleAt 경과를 모두 만족했는지 나타냅니다.}
        proposedAction: {type: string, enum: [CLOSE_TICKET], description: 실제 scanner 실행 시 machine command가 시도할 action입니다.}
    CreateTriggerRequest:
      type: object
      description: deterministic position과 allowlisted condition/action으로 비활성 첫 version을 생성합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [name, position, conditions, actions]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: 관리 목록과 실행 이력에 snapshot되는 운영 식별용 이름입니다.}
        position: {type: integer, minimum: 1, maximum: 10000, description: 동일 ticket event에서 낮은 값부터 평가하는 고유 순서입니다.}
        conditions: {type: array, minItems: 1, maxItems: 50, description: ALL은 모두 일치하고 ANY가 있으면 하나 이상 일치해야 하는 typed 조건입니다., items: {$ref: '#/components/schemas/TriggerCondition'}}
        actions: {type: array, minItems: 1, maxItems: 50, description: 저장 순서대로 실행하되 외부 HTTP 대신 durable public event intent만 추가하는 typed 액션입니다., items: {$ref: '#/components/schemas/TriggerAction'}}
      example: {name: 긴급 미배정 라우팅, position: 10, conditions: [{group: ALL, field: EVENT, operator: IS, value: TICKET_CREATED}, {group: ALL, field: PRIORITY, operator: IS, value: URGENT}, {group: ALL, field: GROUP, operator: NOT_PRESENT}], actions: [{type: SET_GROUP, groupId: '11111111-1111-4111-8111-111111111111'}, {type: ENQUEUE_WEBHOOK, eventType: ticket.trigger.executed}]}
    CreateTriggerVersionRequest:
      type: object
      description: 현재 활성 version을 유지하면서 후속 검토와 rollback activation에 사용할 immutable definition snapshot을 추가합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [name, conditions, actions]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: 이 version의 execution provenance에 남는 운영 이름입니다.}
        conditions: {type: array, minItems: 1, maxItems: 50, description: event와 ticket state를 임의 코드 없이 비교하는 조건 snapshot입니다., items: {$ref: '#/components/schemas/TriggerCondition'}}
        actions: {type: array, minItems: 1, maxItems: 50, description: 실행 worker가 normal ticket command와 outbox 경계로 번역할 액션 snapshot입니다., items: {$ref: '#/components/schemas/TriggerAction'}}
      example: {name: 긴급 미배정 라우팅 v2, conditions: [{group: ALL, field: EVENT, operator: IS, value: TICKET_CREATED}, {group: ALL, field: PRIORITY, operator: IS, value: URGENT}], actions: [{type: SET_GROUP, groupId: '11111111-1111-4111-8111-111111111111'}]}
    TriggerActivationRequest:
      type: object
      description: dry-run과 target invariant 검증을 마친 immutable version을 새 ticket event의 실행 snapshot 대상으로 선택합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: 이 aggregate 안에 이미 존재하고 target group 검증을 통과해야 하는 version입니다.}
      example: {version: 1}
    TriggerPositionRequest:
      type: object
      description: 현재 정의와 목표 position 점유 정의를 원자적으로 교환해 ordered evaluation을 바꿉니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [position]
      properties:
        position: {type: integer, minimum: 1, maximum: 10000, description: 교환 후 현재 트리거가 차지할 고유 평가 위치입니다.}
      example: {position: 20}
    TriggerDryRunRequest:
      type: object
      description: 지정 ticket을 바꾸지 않고 선택한 event boundary에서 조건과 action invariant를 설명합니다.
      x-deskseed-documentation-review: MANUAL
      additionalProperties: false
      required: [ticketNumber, eventType]
      properties:
        ticketNumber: {type: integer, format: int64, minimum: 1, description: 현재 priority와 group projection만 평가에 사용하는 샘플 티켓 번호입니다.}
        eventType: {type: string, enum: [TICKET_CREATED], description: 현재 구현된 TICKET_CREATED 경계에서 trigger 조건을 평가합니다.}
      example: {ticketNumber: 1042, eventType: TICKET_CREATED}
    TriggerCondition:
      type: object
      additionalProperties: false
      required: [group, field, operator]
      properties:
        group: {type: string, enum: [ALL, ANY], description: ALL 조건은 모두, ANY 조건은 존재할 때 하나 이상 일치해야 합니다.}
        field: {type: string, enum: [EVENT, PRIORITY, GROUP], description: 초기 vertical slice가 읽을 수 있는 비민감 ticket/event 속성만 허용합니다.}
        operator: {type: string, enum: [IS, IS_NOT, PRESENT, NOT_PRESENT], description: field별 allowlist 검증으로 SQL이나 표현식 실행 가능성을 차단합니다.}
        value: {type: [string, 'null'], maxLength: 120, description: IS 계열에는 enum 이름을 전달하고 presence 계열에서는 반드시 생략합니다.}
    TriggerAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [SET_GROUP, ENQUEUE_WEBHOOK], description: 초기 vertical slice가 normal command 또는 outbox로 번역할 수 있는 액션만 허용합니다.}
        groupId: {type: [string, 'null'], format: uuid, description: SET_GROUP 활성화와 실행 시점에 모두 active group인지 재검사합니다.}
        eventType: {type: [string, 'null'], enum: [ticket.trigger.executed, null], description: webhook 구독자에게 전달 가능한 고정 public event type이며 임의 payload template은 받지 않습니다.}
    TriggerDefinition:
      type: object
      additionalProperties: false
      required: [id, name, position, currentVersion, aggregateVersion, conditions, actions, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid, description: definition과 immutable history를 함께 식별하는 UUID입니다.}
        name: {type: string, description: 응답에 선택된 version에서 snapshot된 운영 이름입니다.}
        position: {type: integer, description: ticket event job이 version snapshot을 구성할 때 사용하는 deterministic 순서입니다.}
        currentVersion: {type: integer, description: 가장 최근에 작성한 immutable definition version입니다.}
        activeVersion: {type: [integer, 'null'], description: 새 ticket event job에 포함되는 version이며 null이면 실행 대상이 아닙니다.}
        aggregateVersion: {type: integer, format: int64, description: 관리 mutation의 If-Match 비교와 ETag 발급에만 사용하는 aggregate counter입니다.}
        conditions: {type: array, items: {$ref: '#/components/schemas/TriggerCondition'}}
        actions: {type: array, items: {$ref: '#/components/schemas/TriggerAction'}}
        createdAt: {type: string, format: date-time, description: definition aggregate가 최초로 저장된 서버 시각입니다.}
        updatedAt: {type: string, format: date-time, description: version·activation·position mutation이 마지막으로 commit된 서버 시각입니다.}
    TriggerDryRunResult:
      type: object
      additionalProperties: false
      required: [ticketNumber, triggerId, triggerVersion, matched, matchedConditions, unmatchedConditions, proposedActions, invariantFailures]
      properties:
        ticketNumber: {type: integer, format: int64, description: 평가에 사용한 ticket projection 번호입니다.}
        triggerId: {type: string, format: uuid, description: 평가한 immutable version의 aggregate UUID입니다.}
        triggerVersion: {type: integer, description: 조건과 proposed action을 공급한 immutable version입니다.}
        matched: {type: boolean, description: ALL/ANY 결합 규칙을 적용한 최종 조건 결과입니다.}
        matchedConditions: {type: array, items: {type: integer}, description: 저장 ordinal 기준으로 참이 된 조건 위치입니다.}
        unmatchedConditions: {type: array, items: {type: integer}, description: 저장 ordinal 기준으로 거짓이 된 조건 위치입니다.}
        proposedActions: {type: array, items: {type: string, enum: [SET_GROUP, ENQUEUE_WEBHOOK]}, description: matched일 때 worker가 순서대로 시도할 typed action 종류입니다.}
        invariantFailures: {type: array, items: {type: string}, description: 비활성 target group처럼 실제 실행 전에 해결해야 하는 bounded 오류 코드입니다.}
tags:
  - name: Admin Triggers
    description: 관리자가 typed condition/action의 immutable version, 활성화, 평가 순서와 부작용 없는 dry-run을 운영하는 API입니다.
  - name: Admin Automations
    description: 관리자가 SOLVED 경과 시간 기반 system-only close policy의 version과 activation을 운영하는 API입니다.
