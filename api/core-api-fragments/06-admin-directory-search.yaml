x-deskseed-fragment:
  owner: admin-directory-search

paths:
  /api/v1/admin/staff/search:
    post:
      tags: [Admin]
      operationId: searchAdminStaffAccounts
      x-deskseed-phase: UX-P15
      x-deskseed-requirements: [REQ-PERM-002, REQ-AUD-004]
      summary: 직원과 그룹 구성원 전체 검색
      description: >-
        구현 전 blueprint입니다. Active ADMIN이 직원 표시 이름 또는 이메일을 대소문자 구분 없이
        부분 검색합니다. query는 JSON body로만 전달하고 URL·일반 로그·trace에는 기록하지 않습니다.
        memberOfGroupId는 활성 구성원 관계만, excludeGroupId는 그 관계가 없는 직원만 선택하며
        두 필터를 동시에 지정할 수 없습니다. ADMIN 인가 뒤 그룹 존재와 ACTIVE 상태를 확인하며
        존재하지 않거나 비활성 그룹은 동일한 404입니다. role/status는 선택한 범위 안의 추가 필터입니다.
        정렬은 displayName ASC, id ASC이고 전체 검색 범위의 exact count를 페이지 헤더로 제공합니다.
        결과 반환 전에 ADMIN_STAFF_SEARCH_EXECUTED와 보호 검색어를 같은 transaction에 저장하며
        실패 시 성공 응답을 반환하지 않습니다. 계정·멤버십 변경은 수행하지 않으며 추가 후보가 이후
        멤버십 명령의 성공을 보장하지 않습니다. 원문 query나 search-to-ticket origin은 응답하지 않습니다.
      security: [{staffSession: []}]
      parameters:
      - {$ref: '#/components/parameters/CsrfHeader'}
      - {$ref: '#/components/parameters/ExpectedStaffActorHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminStaffSearchRequest'}
      responses:
        '200':
          description: 전체 조건에 맞는 직원 페이지입니다. 응답은 Cache-Control no-store를 사용합니다.
          headers:
            X-Page-Number: {$ref: '#/components/headers/PageNumber'}
            X-Page-Size: {$ref: '#/components/headers/PageSize'}
            X-Total-Count: {$ref: '#/components/headers/TotalCount'}
            X-Total-Pages: {$ref: '#/components/headers/TotalPages'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StaffAccount'}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '401': {$ref: '#/components/responses/AdminDirectorySearchUnauthorized'}
        '403': {$ref: '#/components/responses/AdminDirectorySearchForbidden'}
        '404': {$ref: '#/components/responses/AdminDirectorySearchGroupNotFound'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
        '503': {$ref: '#/components/responses/AdminDirectorySearchAuditUnavailable'}
  /api/v1/admin/groups/search:
    post:
      tags: [Admin]
      operationId: searchAdminGroups
      x-deskseed-phase: UX-P15
      x-deskseed-requirements: [REQ-PERM-002, REQ-AUD-004]
      summary: 지원 그룹 이름 전체 검색
      description: >-
        구현 전 blueprint입니다. Active ADMIN이 그룹 이름을 대소문자 구분 없이 부분 검색합니다.
        query는 JSON body로만 전달하고 URL·일반 로그·trace에는 기록하지 않습니다.
        정렬은 name ASC, id ASC이고 status가 있으면 전체 DB 범위에서 함께 적용합니다.
        전체 조건에 맞는 exact count를 페이지 헤더로 제공하며 원문 query는 응답하지 않습니다.
        결과 반환 전에 ADMIN_GROUP_SEARCH_EXECUTED와 보호 검색어를 같은 transaction에 저장합니다.
        필수 감사 또는 query 보호 실패는 성공 대신 503이며 그룹·멤버십·티켓은 변경하지 않습니다.
      security: [{staffSession: []}]
      parameters:
      - {$ref: '#/components/parameters/CsrfHeader'}
      - {$ref: '#/components/parameters/ExpectedStaffActorHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminGroupSearchRequest'}
      responses:
        '200':
          description: 전체 조건에 맞는 그룹 페이지입니다. 응답은 Cache-Control no-store를 사용합니다.
          headers:
            X-Page-Number: {$ref: '#/components/headers/PageNumber'}
            X-Page-Size: {$ref: '#/components/headers/PageSize'}
            X-Total-Count: {$ref: '#/components/headers/TotalCount'}
            X-Total-Pages: {$ref: '#/components/headers/TotalPages'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '401': {$ref: '#/components/responses/AdminDirectorySearchUnauthorized'}
        '403': {$ref: '#/components/responses/AdminDirectorySearchForbidden'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
        '503': {$ref: '#/components/responses/AdminDirectorySearchAuditUnavailable'}

components:
  schemas:
    AdminStaffSearchRequest:
      type: object
      additionalProperties: false
      required: [query, interactionId]
      description: >-
        직원 디렉터리, 선택 그룹의 구성원 또는 새 구성원 후보를 검색하는 요청입니다.
        query는 trim 후 1~254자이며 제어 문자를 거부합니다. 공백을 포함한 하나의 literal substring으로
        찾고 SQL wildcard %, _, 역슬래시는 일반 문자로 처리합니다. 빈 검색은 기존 GET 목록으로 복귀합니다.
        그룹 필터는 하나만 허용하며 role/status와 AND로 결합합니다.
      x-deskseed-documentation-review: MANUAL
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 254
          description: 직원의 표시 이름 또는 이메일 일부입니다. 원문은 보호 ciphertext 외에 저장하지 않습니다.
        interactionId:
          type: string
          format: uuid
          description: 명시적 검색 실행 또는 검색 결과 페이지 요청을 구분하는 클라이언트 UUID입니다. 감사 중복 제거 키가 아닙니다.
        role:
          $ref: '#/components/schemas/StaffRole'
        status:
          $ref: '#/components/schemas/StaffStatus'
        memberOfGroupId:
          type: string
          format: uuid
          description: 해당 활성 그룹에 ACTIVE 멤버십을 가진 직원만 검색합니다. excludeGroupId와 동시에 지정할 수 없습니다.
        excludeGroupId:
          type: string
          format: uuid
          description: 해당 활성 그룹에 ACTIVE 멤버십이 없는 직원만 검색합니다. 추가 후보는 status ACTIVE와 함께 요청합니다.
        page:
          type: integer
          minimum: 0
          default: 0
          description: 전체 검색 결과에서 읽을 0부터 시작하는 페이지입니다.
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: 한 번에 반환할 최대 직원 수입니다.
      example:
        query: agent.park@example.test
        interactionId: 44444444-4444-4444-8444-444444444444
        status: ACTIVE
        excludeGroupId: 33333333-3333-4333-8333-333333333333
        page: 0
        size: 25
    AdminGroupSearchRequest:
      type: object
      additionalProperties: false
      required: [query, interactionId]
      description: >-
        관리자 그룹 목록에서 이름 일부를 검색하는 요청입니다. query는 trim 후 1~254자이며 제어 문자를
        거부합니다. 공백을 포함한 literal substring으로 검색하고 SQL wildcard %, _, 역슬래시는
        일반 문자로 처리합니다. 빈 검색은 기존 GET 목록으로 복귀합니다.
      x-deskseed-documentation-review: MANUAL
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 254
          description: 그룹 표시 이름 일부입니다. 원문은 보호 ciphertext 외에 저장하지 않습니다.
        interactionId:
          type: string
          format: uuid
          description: 명시적 검색 실행 또는 검색 결과 페이지 요청을 구분하는 클라이언트 UUID입니다. 감사 중복 제거 키가 아닙니다.
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: 그룹의 현재 활성 상태를 검색어와 함께 제한합니다.
        page:
          type: integer
          minimum: 0
          default: 0
          description: 전체 검색 결과에서 읽을 0부터 시작하는 페이지입니다.
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: 한 번에 반환할 최대 그룹 수입니다.
      example:
        query: 결제
        interactionId: 55555555-5555-4555-8555-555555555555
        status: ACTIVE
        page: 0
        size: 25
  responses:
    AdminDirectorySearchUnauthorized:
      description: 유효한 활성 직원 세션이 없습니다. 검색을 실행하거나 성공 검색 감사를 남기지 않습니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AdminDirectorySearchForbidden:
      description: ADMIN 역할 또는 CSRF 검증에 실패했습니다. 그룹 존재와 검색 결과를 확인하기 전에 거부합니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AdminDirectorySearchGroupNotFound:
      description: 요청한 멤버십 범위의 그룹이 없거나 비활성입니다. 두 상태를 구분하지 않고 ACTIVE_GROUP_NOT_FOUND를 반환합니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AdminDirectorySearchAuditUnavailable:
      description: 필수 감사 또는 검색어 보호 저장에 실패했습니다. audit-write-unavailable 문제만 반환하고 검색 결과나 원문 검색어는 포함하지 않습니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
