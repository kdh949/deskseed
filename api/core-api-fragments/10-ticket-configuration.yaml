        '200': {description: stable category에 매핑된 status 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CustomTicketStatus'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: custom status definition 생성
