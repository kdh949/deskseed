x-deskseed-fragment:
  owner: ticket-configuration

tags:
  - name: Admin Ticket Configuration
    description: ADMIN이 typed custom field, versioned form, tag, custom status를 관리하는 API입니다.
  - name: Ticket Configuration Runtime
    description: 고객과 상담사가 서버가 투영한 form descriptor와 ticket configuration 값을 읽고 command로 변경하는 API입니다.

paths:
  /api/v1/admin/ticket-fields:
    get:
      summary: 티켓 field definition 목록 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 서버에서 확인한 뒤 field definition 목록만 반환합니다.
      operationId: listTicketFieldDefinitions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters:
        - $ref: '#/components/parameters/ExpectedStaffActorHeader'
        - name: active
          in: query
          required: false
          schema: {type: boolean}
      responses:
        '200':
          description: 현재 관리자에게 보이는 bounded field definition 목록입니다.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TicketFieldDefinition'}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: 티켓 field definition 생성
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 생성 및 Admin/Security audit을 같은 transaction으로 처리합니다.
      operationId: createTicketFieldDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTicketFieldDefinitionRequest'}
            example:
              machineKey: payment.method
              type: SINGLE_SELECT
              staffLabel: 결제 수단
              customerLabel: 결제 수단
              customerVisible: true
              customerEditable: true
              agentVisible: true
              agentEditable: true
              searchable: true
              analyticsEligible: true
              sensitive: false
      responses:
        '201':
          description: immutable machine key와 version 1을 가진 draft definition입니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/TicketFieldDefinition'}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-fields/{fieldId}:
    get:
      summary: 티켓 field definition 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 서버에서 확인한 뒤 하나의 field definition을 반환합니다.
      operationId: getTicketFieldDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/TicketFieldId'}]
      responses:
        '200': {description: 요청한 field definition을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketFieldDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    put:
      summary: 티켓 field definition 수정
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 수정과 Admin/Security audit을 원자적으로 처리합니다.
      operationId: updateTicketFieldDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFieldId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateTicketFieldDefinitionRequest'}}
      responses:
        '200': {description: 새 version의 definition, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFieldDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-fields/{fieldId}/activation:
    put:
      summary: 티켓 field definition 활성 상태 변경
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 활성 상태와 감사 기록을 함께 변경합니다.
      operationId: setTicketFieldDefinitionActivation
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFieldId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ActivationRequest'}, example: {active: false}}
      responses:
        '200': {description: 변경된 definition, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFieldDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-fields/{fieldId}/options:
    get:
      summary: single-select field option 목록 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 확인한 뒤 field type에 맞는 option 목록을 반환합니다.
      operationId: listTicketFieldOptions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/TicketFieldId'}]
      responses:
        '200': {description: display order 순서의 option 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketFieldOption'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: single-select field option 생성
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 stable option을 생성하며 감사 기록을 함께 남깁니다.
      operationId: createTicketFieldOption
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFieldId'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateTicketFieldOptionRequest'}, example: {machineKey: card, staffLabel: 카드, customerLabel: 카드, order: 10}}
      responses:
        '201': {description: stable option ID를 가진 option, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFieldOption'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
  /api/v1/admin/ticket-fields/{fieldId}/options/{optionId}:
    put:
      summary: ticket field option 수정 또는 비활성화
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 option lifecycle과 감사 기록을 함께 변경합니다.
      operationId: updateTicketFieldOption
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFieldId'}, {$ref: '#/components/parameters/TicketFieldOptionId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateTicketFieldOptionRequest'}}
      responses:
        '200': {description: 변경된 option, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFieldOption'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-fields/{fieldId}/options/order:
    put:
      summary: ticket field option 표시 순서 재배치
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 전체 option set의 중복 없는 표시 순서를 원자적으로 변경합니다.
      operationId: reorderTicketFieldOptions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFieldId'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ReorderIdsRequest'}, example: {ids: ['76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec']}}
      responses:
        '200': {description: 재배치된 option 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketFieldOption'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}

  /api/v1/admin/ticket-forms:
    get:
      summary: 티켓 form 목록 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 서버에서 확인한 뒤 form lifecycle과 version을 반환합니다.
      operationId: listTicketForms
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: version과 lifecycle을 포함한 form 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketForm'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: 티켓 form draft 생성
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 form draft와 Admin/Security audit을 같은 transaction으로 생성합니다.
      operationId: createTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertTicketFormRequest'}}
      responses:
        '201': {description: 생성된 form draft를 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketForm'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
  /api/v1/admin/ticket-forms/{formId}:
    get:
      summary: 티켓 form 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 확인한 뒤 draft 또는 immutable published form version을 반환합니다.
      operationId: getTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/TicketFormId'}]
      responses:
        '200': {description: form draft 또는 immutable published version, content: {application/json: {schema: {$ref: '#/components/schemas/TicketForm'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    put:
      summary: ticket form draft 수정
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 published version을 바꾸지 않는 draft 수정과 감사를 원자적으로 처리합니다.
      operationId: updateTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFormId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertTicketFormRequest'}}
      responses:
        '200': {description: 수정된 draft form, content: {application/json: {schema: {$ref: '#/components/schemas/TicketForm'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-forms/{formId}/publish:
    post:
      summary: 충돌 없는 form version publish
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 cycle 또는 contradictory effect가 없는 draft만 immutable version으로 publish합니다.
      operationId: publishTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFormId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      responses:
        '200': {description: immutable published form version을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketForm'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-forms/{formId}/archive:
    post:
      summary: 티켓 form archive
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 기존 ticket 해석을 보존한 채 form을 archive합니다.
      operationId: archiveTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFormId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      responses:
        '200': {description: archive된 form, content: {application/json: {schema: {$ref: '#/components/schemas/TicketForm'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-forms/{formId}/preview:
    post:
      summary: actor context에서 form rule preview
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 raw expression 없이 Foundation condition AST의 server-side projection을 preview합니다.
      operationId: previewTicketForm
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketFormId'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TicketFormPreviewRequest'}, example: {actorKind: CUSTOMER, ticketKind: CUSTOMER_REQUEST, statusCategory: NEW, fieldValues: {payment.method: {optionId: '76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec'}}}}
      responses:
        '200': {description: server-side rule evaluation projection을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketFormProjection'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
  /api/v1/admin/ticket-forms/validate:
    post:
      summary: conditional rule set publish 가능성 검증
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 dependency cycle 및 conflicting final effect를 publish 전에 검사합니다.
      operationId: validateTicketFormConditions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertTicketFormRequest'}}
      responses:
        '200': {description: cycle과 contradictory final state 검증 결과, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFormValidationResult'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}

  /api/v1/admin/ticket-tags:
    get:
      summary: tag catalog 목록 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 확인한 뒤 normalized tag catalog만 반환합니다.
      operationId: listTicketTagDefinitions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-012]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: normalized tag definition 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketTagDefinition'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: tag definition 생성
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 normalized canonical value의 tag를 생성하며 감사를 함께 남깁니다.
      operationId: createTicketTagDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-012]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertTicketTagDefinitionRequest'}, example: {value: payment, label: 결제}}
      responses:
        '201': {description: 생성된 normalized tag definition을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketTagDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
  /api/v1/admin/ticket-tags/{tagId}:
    put:
      summary: tag definition 수정 또는 비활성화
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 tag label 또는 lifecycle과 감사를 원자적으로 변경합니다.
      operationId: updateTicketTagDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-012]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketTagId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertTicketTagDefinitionRequest'}}
      responses:
        '200': {description: 갱신된 tag definition을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketTagDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}

  /api/v1/admin/ticket-statuses:
    get:
      summary: custom status definition 목록 조회
      description: ADMIN 권한과 staff actor 일관성 guard를 확인한 뒤 stable category에 매핑된 custom status 목록을 반환합니다.
      operationId: listTicketStatusDefinitions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-013]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: stable category에 매핑된 status 목록, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CustomTicketStatus'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    post:
      summary: custom status definition 생성
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 기존 category state machine을 보존하는 custom status를 생성합니다.
      operationId: createTicketStatusDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-013]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertCustomTicketStatusRequest'}, example: {machineKey: waiting-for-customer, agentLabel: 고객 응답 대기, customerLabel: 추가 정보 필요, statusCategory: PENDING, order: 10, active: true}}
      responses:
        '201': {description: 생성된 custom status definition을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/CustomTicketStatus'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
  /api/v1/admin/ticket-statuses/{statusId}:
    put:
      summary: custom status definition 수정
      description: ADMIN의 CSRF, actor 일관성, If-Match version을 확인하고 status definition과 Admin/Security audit을 원자적으로 변경합니다.
      operationId: updateTicketStatusDefinition
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-013]
      x-deskseed-documentation-review: MANUAL
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketStatusDefinitionId'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpsertCustomTicketStatusRequest'}}
      responses:
        '200': {description: 갱신된 custom status definition을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/CustomTicketStatus'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/ticket-statuses/order:
    put:
      summary: custom status 표시 순서 재배치
      description: ADMIN의 CSRF와 actor 일관성을 확인하고 category compatibility를 바꾸지 않는 custom status 표시 순서를 원자적으로 변경합니다.
      operationId: reorderTicketStatusDefinitions
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-013]
      tags: [Admin Ticket Configuration]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ReorderIdsRequest'}}
      responses:
        '200': {description: 재배치된 custom status definition 목록을 반환합니다., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CustomTicketStatus'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}

  /api/v1/customer/ticket-forms:
    get:
      summary: 고객 제출 context의 form projection 조회
      description: 고객 제출 context에 허용된 active field만 반환하며 staff-only definition, option, value는 응답에 포함하지 않습니다.
      operationId: getCustomerTicketFormProjection
      x-deskseed-contract-status: BLUEPRINT_READY
      x-deskseed-requirements: [REQ-CFG-011]
      tags: [Ticket Configuration Runtime]
      security: [{}]
      parameters:
        - name: formId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: ticketKind
          in: query
          required: true
          schema: {$ref: '#/components/schemas/TicketKind'}
      responses:
        '200': {description: staff-only definition을 포함하지 않는 customer projection, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerTicketFormProjection'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/agent/ticket-configuration/descriptors:
    get:
      summary: 상담사 View/Search/Macro/Rules/Analytics용 configuration descriptor catalog 조회
      description: 상담사 session의 actor 일관성을 확인하고 handler/provider identity만 포함한 bounded descriptor catalog를 반환합니다.
      operationId: listTicketConfigurationDescriptors
      x-deskseed-contract-status: BLUEPRINT_READY
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: handler/provider identity만 제공하는 bounded catalog, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketConfigurationDescriptor'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
  /api/v1/agent/tickets/{ticketNumber}/configuration:
    get:
      summary: 상담사용 ticket field/tag/custom status projection 조회
      description: 상담사 session의 actor 일관성과 ticket read authorization을 확인하고 server-authorized configuration projection을 반환합니다.
      operationId: getAgentTicketConfiguration
      x-deskseed-contract-status: BLUEPRINT_READY
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/TicketConfigurationTicketNumber'}]
      responses:
        '200': {description: 서버 권한 검사를 거친 field value projection을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketConfigurationValues'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    put:
      summary: 정상 ticket command로 field/tag/custom status 변경
      description: 상담사 CSRF, actor 일관성, ticket write authorization, If-Match version, form projection을 확인하고 하나의 TicketAudit으로 변경합니다.
      operationId: updateAgentTicketConfiguration
      x-deskseed-contract-status: BLUEPRINT_READY
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      x-deskseed-documentation-review: MANUAL
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketConfigurationTicketNumber'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTicketConfigurationRequest'}
            example:
              fieldValues:
                payment.method: {optionId: '76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec'}
              addTagIds: ['ccda13be-fd84-485a-a5e9-6c124e2b1235']
              removeTagIds: []
              customStatusId: '11f87c09-ea8d-4b5e-8e5d-81cba5ea37ec'
              clientCommandId: 08a85f1c-9939-43f7-a90a-657ac5acb935
      responses:
        '200': {description: 하나의 TicketAudit와 ordered event를 만든 command 결과를 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketConfigurationCommandResult'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

components:
  parameters:
    TicketConfigurationTicketNumber: {name: ticketNumber, in: path, required: true, description: 변경 또는 조회할 양의 ticket 번호입니다., schema: {type: integer, format: int64, minimum: 1}}
    TicketConfigurationIfMatch: {name: If-Match, in: header, required: true, description: 현재 definition 또는 ticket version과 정확히 일치하지 않으면 기존 값을 덮어쓰지 않도록 하는 strong version precondition입니다., schema: {type: string, minLength: 1, maxLength: 64}}
    TicketFieldId: {name: fieldId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketFieldOptionId: {name: optionId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketFormId: {name: formId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketTagId: {name: tagId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketStatusDefinitionId: {name: statusId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: 권한, validation, lifecycle, version, audit persistence 실패를 RFC 9457 problem detail로 반환합니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    TicketFieldType:
      type: string
      enum: [CHECKBOX, SINGLE_SELECT, NUMBER, SHORT_TEXT, LONG_TEXT]
    TicketFieldDefinition:
      type: object
      required: [id, machineKey, type, staffLabel, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        machineKey: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$', maxLength: 120}
        type: {$ref: '#/components/schemas/TicketFieldType'}
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        staffDescription: {type: string, maxLength: 500}
        customerLabel: {type: string, maxLength: 120}
        customerDescription: {type: string, maxLength: 500}
        active: {type: boolean}
        customerVisible: {type: boolean}
        customerEditable: {type: boolean}
        agentVisible: {type: boolean}
        agentEditable: {type: boolean}
        searchable: {type: boolean}
        analyticsEligible: {type: boolean}
        sensitive: {type: boolean}
        validation: {$ref: '#/components/schemas/TicketFieldValidation'}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateTicketFieldDefinitionRequest:
      description: immutable machine key와 typed validation을 포함하는 새 ticket field definition 생성 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {machineKey: payment.method, type: SINGLE_SELECT, staffLabel: 결제 수단, customerLabel: 결제 수단, customerVisible: true, customerEditable: true, agentVisible: true, agentEditable: true, searchable: true, analyticsEligible: false, sensitive: false}
      allOf:
        - $ref: '#/components/schemas/UpdateTicketFieldDefinitionRequest'
        - type: object
          required: [machineKey, type, staffLabel]
          properties:
            machineKey: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$', maxLength: 120}
            type: {$ref: '#/components/schemas/TicketFieldType'}
    UpdateTicketFieldDefinitionRequest:
      description: type과 machine key를 바꾸지 않고 ticket field label, projection policy, validation을 갱신하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {staffLabel: 결제 수단, customerLabel: 결제 수단, customerVisible: true, customerEditable: true, agentVisible: true, agentEditable: true, searchable: true, analyticsEligible: false, sensitive: false}
      type: object
      properties:
        machineKey: {type: string, readOnly: true}
        type: {$ref: '#/components/schemas/TicketFieldType', readOnly: true}
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        staffDescription: {type: string, maxLength: 500}
        customerLabel: {type: string, maxLength: 120}
        customerDescription: {type: string, maxLength: 500}
        customerVisible: {type: boolean}
        customerEditable: {type: boolean}
        agentVisible: {type: boolean}
        agentEditable: {type: boolean}
        searchable: {type: boolean}
        analyticsEligible: {type: boolean}
        sensitive: {type: boolean}
        validation: {$ref: '#/components/schemas/TicketFieldValidation'}
    TicketFieldValidation:
      type: object
      properties:
        minimum: {type: number}
        maximum: {type: number}
        precision: {type: integer, minimum: 1, maximum: 18}
        scale: {type: integer, minimum: 0, maximum: 12}
        minLength: {type: integer, minimum: 0, maximum: 10000}
        maxLength: {type: integer, minimum: 1, maximum: 10000}
        regex: {type: string, maxLength: 300, description: 서버 allowlist로 승인된 safe regular expression만 허용합니다.}
    TicketFieldOption:
      type: object
      required: [id, machineKey, staffLabel, active, order, version]
      properties:
        id: {type: string, format: uuid}
        machineKey: {type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 80}
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        customerLabel: {type: string, maxLength: 120}
        active: {type: boolean}
        order: {type: integer, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
    CreateTicketFieldOptionRequest:
      description: SINGLE_SELECT field에 stable option ID를 추가하는 생성 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {machineKey: card, staffLabel: 카드, customerLabel: 카드, order: 10}
      type: object
      required: [machineKey, staffLabel, order]
      properties:
        machineKey: {type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 80}
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        customerLabel: {type: string, maxLength: 120}
        order: {type: integer, minimum: 0}
    UpdateTicketFieldOptionRequest:
      description: 기존 field option의 label 또는 active lifecycle을 바꾸는 optimistic update 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {staffLabel: 카드, customerLabel: 카드, active: true}
      type: object
      required: [staffLabel, active]
      properties:
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        customerLabel: {type: string, maxLength: 120}
        active: {type: boolean}
    ActivationRequest:
      description: 기존 configuration definition을 삭제하지 않고 선택 가능 여부만 바꾸는 lifecycle 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {active: false}
      type: object
      required: [active]
      properties: {active: {type: boolean}}
    ReorderIdsRequest:
      description: 하나의 configuration collection에 속하는 모든 stable ID를 중복 없이 원하는 display 순서로 전달하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {ids: ['76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec']}
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items: {type: string, format: uuid}
          uniqueItems: true
    TicketForm:
      type: object
      required: [id, name, lifecycle, version, placements, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 500}
        lifecycle: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}
        defaultForCustomer: {type: boolean}
        defaultForAgent: {type: boolean}
        version: {type: integer, minimum: 1}
        placements: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TicketFormFieldPlacement'}}
        conditionalRules: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TicketFormConditionalRule'}}
        allowedCustomStatusIds: {type: array, maxItems: 50, items: {type: string, format: uuid}, uniqueItems: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpsertTicketFormRequest:
      description: draft ticket form의 field 배치, actor별 base policy, conditional AST rule, 허용 custom status를 저장하는 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {name: 결제 문의, description: 결제 확인에 필요한 항목, defaultForCustomer: true, defaultForAgent: false, placements: [{fieldId: '9a4fc019-2288-4a64-bf76-4ae7b08d713d', order: 10, customer: {visible: true, editable: true, required: false}, agent: {visible: true, editable: true, required: false}}], conditionalRules: [], allowedCustomStatusIds: []}
      type: object
      required: [name, placements]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 500}
        defaultForCustomer: {type: boolean}
        defaultForAgent: {type: boolean}
        placements: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/TicketFormFieldPlacement'}}
        conditionalRules: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TicketFormConditionalRule'}}
        allowedCustomStatusIds: {type: array, maxItems: 50, items: {type: string, format: uuid}, uniqueItems: true}
    TicketFormFieldPlacement:
      type: object
      required: [fieldId, order, customer, agent]
      properties:
        fieldId: {type: string, format: uuid}
        order: {type: integer, minimum: 0}
        customer: {$ref: '#/components/schemas/FieldActorPolicy'}
        agent: {$ref: '#/components/schemas/FieldActorPolicy'}
    FieldActorPolicy:
      type: object
      required: [visible, editable, required]
      properties:
        visible: {type: boolean}
        editable: {type: boolean}
        required: {type: boolean}
    TicketFormConditionalRule:
      type: object
      required: [id, priority, condition, effects]
      properties:
        id: {type: string, format: uuid}
        priority: {type: integer, minimum: 0}
        condition: {$ref: '#/components/schemas/VersionedConditionAst'}
        effects:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/TicketFormFieldEffect'}
    VersionedConditionAst:
      type: object
      required: [schemaVersion, root]
      properties:
        schemaVersion: {type: integer, const: 1}
        root:
          type: object
          description: Foundation workflow AST node입니다. `kind`는 `ALL`/`ANY` (`children`), `NOT` (`child`), 또는 `LEAF` (`typeKey`, `schemaVersion`, object `config`)만 허용하며 raw executable expression은 허용하지 않습니다. LEAF의 typeKey/schemaVersion은 등록된 TICKET_FORM ConditionHandler와 일치해야 합니다.
    TicketFormFieldEffect:
      type: object
      required: [fieldId, behavior]
      properties:
        fieldId: {type: string, format: uuid}
        behavior: {type: string, enum: [SHOW, HIDE, REQUIRED, OPTIONAL, READ_ONLY, EDITABLE]}
    TicketFormPreviewRequest:
      description: raw script 없이 actor와 ticket context의 form conditional effect를 검증하는 preview 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {actorKind: CUSTOMER, ticketKind: CUSTOMER_REQUEST, statusCategory: NEW, fieldValues: {payment.method: {optionId: '76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec'}}}
      type: object
      required: [actorKind, ticketKind, statusCategory]
      properties:
        actorKind: {type: string, enum: [CUSTOMER, AGENT]}
        ticketKind: {$ref: '#/components/schemas/TicketKind'}
        statusCategory: {$ref: '#/components/schemas/TicketStatusCategory'}
        customStatusId: {type: string, format: uuid}
        fieldValues: {type: object, additionalProperties: {$ref: '#/components/schemas/TicketFieldValue'}}
    TicketFormProjection:
      type: object
      required: [formId, formVersion, fields]
      properties:
        formId: {type: string, format: uuid}
        formVersion: {type: integer, minimum: 1}
        fields: {type: array, items: {$ref: '#/components/schemas/ProjectedTicketField'}}
    CustomerTicketFormProjection:
      description: 고객에게 허용된 label, option, projection policy만 반환하며 staff label/description, search/analytics/sensitive metadata는 포함하지 않습니다.
      type: object
      required: [formId, formVersion, fields]
      properties:
        formId: {type: string, format: uuid}
        formVersion: {type: integer, minimum: 1}
        fields: {type: array, items: {$ref: '#/components/schemas/CustomerProjectedTicketField'}}
    CustomerProjectedTicketField:
      type: object
      required: [field, visible, editable, required, options]
      properties:
        field: {$ref: '#/components/schemas/CustomerTicketFieldDefinition'}
        visible: {type: boolean}
        editable: {type: boolean}
        required: {type: boolean}
        options: {type: array, items: {$ref: '#/components/schemas/CustomerTicketFieldOption'}}
    CustomerTicketFieldDefinition:
      type: object
      required: [id, machineKey, type, label]
      properties:
        id: {type: string, format: uuid}
        machineKey: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$', maxLength: 120}
        type: {$ref: '#/components/schemas/TicketFieldType'}
        label: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 500}
    CustomerTicketFieldOption:
      type: object
      required: [id, machineKey, label]
      properties:
        id: {type: string, format: uuid}
        machineKey: {type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 80}
        label: {type: string, minLength: 1, maxLength: 120}
    ProjectedTicketField:
      type: object
      required: [field, visible, editable, required]
      properties:
        field: {$ref: '#/components/schemas/TicketFieldDefinition'}
        visible: {type: boolean}
        editable: {type: boolean}
        required: {type: boolean}
        options: {type: array, items: {$ref: '#/components/schemas/TicketFieldOption'}}
    TicketFormValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid: {type: boolean}
        issues: {type: array, items: {$ref: '#/components/schemas/ConfigurationValidationIssue'}}
    ConfigurationValidationIssue:
      type: object
      required: [code, path, message]
      properties:
        code: {type: string, maxLength: 80}
