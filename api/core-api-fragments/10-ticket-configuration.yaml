          application/json: {schema: {$ref: '#/components/schemas/ReorderIdsRequest'}}
      responses:
        '200': {description: 재배치된 custom status definition 목록을 반환합니다., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CustomTicketStatus'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}

  /api/v1/customer/ticket-forms:
    get:
      summary: 고객 제출 context의 form projection 조회
      description: 공개 surface는 ticket kind 입력을 받지 않고 항상 CUSTOMER_REQUEST context의 current published customer form 초기 projection만 반환합니다. staff-only definition, option, value는 응답에 포함하지 않습니다. editable은 form state와 field의 전역 customerEditable capability가 모두 허용할 때만 true입니다. 이 응답은 authorization token이 아니며 최종 문의 생성은 current form snapshot을 다시 검증합니다.
      operationId: getCustomerTicketFormProjection
      x-deskseed-requirements: [REQ-CFG-011, REQ-CFG-014]
      tags: [Ticket Configuration Runtime]
      security: [{}]
      parameters:
        - name: formId
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: staff-only definition을 포함하지 않는 current customer projection입니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTicketFormProjection'}
              example: &customerTicketFormProjectionExample
                formId: 00000000-0000-4000-8000-000000000001
                formVersion: 3
                fields:
                  - field:
                      id: 00000000-0000-4000-8000-000000000011
                      machineKey: request.type
                      type: SINGLE_SELECT
                      label: 문의 유형
                      description: 합성 테스트 문의의 유형을 선택합니다.
                      validation: {}
                    visible: true
                    editable: true
                    required: true
                    options:
                      - {id: 00000000-0000-4000-8000-000000000101, machineKey: order, label: 주문, order: 10}
        '404': {$ref: '#/components/responses/CustomerTicketFormUnavailable'}
        '503': {$ref: '#/components/responses/CustomerRequestConfigurationUnavailable'}
  /api/v1/customer/ticket-form-projections:
    post:
      summary: 고객 후보 field 값으로 form projection 재계산
      description: allowlisted typed field machine key와 값만 평가해 current published customer form의 고객 공개 projection을 반환합니다. staff-only/unknown definition은 존재를 누출하지 않는 validation 또는 unavailable problem으로 처리합니다. 이 preview is not an authorization token이며 문의 생성 transaction은 current form/version, visibility, editability, requiredness, type과 option을 다시 검증합니다.
      operationId: projectCustomerTicketForm
      x-deskseed-requirements: [REQ-CFG-014]
      x-deskseed-side-effects: NONE
      x-deskseed-semantic-ticket-view: NONE
      x-deskseed-documentation-review: MANUAL
      tags: [Ticket Configuration Runtime]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerTicketFormProjectionRequest'}
            example:
              ticketKind: CUSTOMER_REQUEST
              formId: 00000000-0000-4000-8000-000000000001
              formVersion: 3
              fieldValues:
                request.type: {optionId: 00000000-0000-4000-8000-000000000101}
      responses:
        '200':
          description: candidate 값에 조건을 적용한 customer-safe projection입니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerTicketFormProjection'}
              example: *customerTicketFormProjectionExample
        '400': {$ref: '#/components/responses/CustomerTicketFormValidation'}
        '404': {$ref: '#/components/responses/CustomerTicketFormUnavailable'}
        '409': {$ref: '#/components/responses/CustomerTicketFormVersionConflict'}
        '503': {$ref: '#/components/responses/CustomerRequestConfigurationUnavailable'}
  /api/v1/agent/ticket-configuration/descriptors:
    get:
      summary: 상담사 View/Search/Macro/Rules/Analytics용 configuration descriptor catalog 조회
      description: 상담사 session의 actor 일관성을 확인하고 handler/provider identity만 포함한 bounded descriptor catalog를 반환합니다.
      operationId: listTicketConfigurationDescriptors
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}]
      responses:
        '200': {description: handler/provider identity만 제공하는 bounded catalog, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TicketConfigurationDescriptor'}}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
  /api/v1/agent/tickets/{ticketNumber}/configuration:
    get:
      summary: 상담사용 ticket field/tag/custom status projection 조회
      description: 상담사 session의 actor 일관성과 ticket read authorization을 확인하고 server-authorized configuration projection을 반환합니다.
      operationId: getAgentTicketConfiguration
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/TicketConfigurationTicketNumber'}]
      responses:
        '200': {description: 서버 권한 검사를 거친 field value projection을 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketConfigurationValues'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatch'}
    put:
      summary: 정상 ticket command로 field/tag/custom status 변경
      description: 상담사 CSRF, actor 일관성, ticket write authorization, If-Match version, form projection을 확인하고 하나의 TicketAudit으로 변경합니다.
      operationId: updateAgentTicketConfiguration
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-CFG-010, REQ-CFG-012, REQ-CFG-013]
      x-deskseed-documentation-review: MANUAL
      tags: [Ticket Configuration Runtime]
      security: [{staffSession: []}]
      parameters: [{$ref: '#/components/parameters/ExpectedStaffActorHeader'}, {$ref: '#/components/parameters/CsrfHeader'}, {$ref: '#/components/parameters/TicketConfigurationTicketNumber'}, {$ref: '#/components/parameters/TicketConfigurationIfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTicketConfigurationRequest'}
            example:
              fieldValues:
                payment.method: {optionId: '76f77c09-ea8d-4b5e-8e5d-81cba5ea37ec'}
              addTagIds: ['ccda13be-fd84-485a-a5e9-6c124e2b1235']
              removeTagIds: []
              customStatusId: '11f87c09-ea8d-4b5e-8e5d-81cba5ea37ec'
              clientCommandId: 08a85f1c-9939-43f7-a90a-657ac5acb935
      responses:
        '200': {description: 하나의 TicketAudit와 ordered event를 만든 command 결과를 반환합니다., content: {application/json: {schema: {$ref: '#/components/schemas/TicketConfigurationCommandResult'}}}}
        '400': {$ref: '#/components/responses/InvalidExpectedStaffActorOrBadRequest'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/StaffSessionActorMismatchOrConflict'}
        '412': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

components:
  parameters:
    TicketConfigurationTicketNumber: {name: ticketNumber, in: path, required: true, description: 변경 또는 조회할 양의 ticket 번호입니다., schema: {type: integer, format: int64, minimum: 1}}
    TicketConfigurationIfMatch: {name: If-Match, in: header, required: true, description: 현재 definition 또는 ticket version과 정확히 일치하지 않으면 기존 값을 덮어쓰지 않도록 하는 strong version precondition입니다., schema: {type: string, minLength: 1, maxLength: 64}}
    TicketFieldId: {name: fieldId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketFieldOptionId: {name: optionId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketFormId: {name: formId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketTagId: {name: tagId, in: path, required: true, schema: {type: string, format: uuid}}
    TicketStatusDefinitionId: {name: statusId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: 권한, validation, lifecycle, version, audit persistence 실패를 RFC 9457 problem detail로 반환합니다.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CustomerTicketFormValidation:
      description: candidate 값의 key/type/option이 customer-safe form 입력으로 유효하지 않습니다. 보호된 definition의 존재 여부는 반환하지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerTicketFormValidationProblem'}
          example: {type: /problems/customer-ticket-form-validation-failed, title: Customer ticket form validation failed, status: 400, detail: The candidate field values are invalid., requestId: req-form-400}
    CustomerTicketFormUnavailable:
      description: 요청한 ID의 부재, 비공개, 비활성, staff-only 상태를 구별하지 않는 customer form 응답입니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerTicketFormUnavailableProblem'}
          example: {type: /problems/customer-ticket-form-unavailable, title: Customer ticket form unavailable, status: 404, detail: The customer ticket form is unavailable., requestId: req-form-404}
    CustomerTicketFormVersionConflict:
      description: projection 입력 version이 current published customer form version과 달라 새 projection 조회가 필요합니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerTicketFormVersionConflictProblem'}
          example: {type: /problems/customer-ticket-form-version-conflict, title: Customer ticket form version changed, status: 409, detail: Refresh the customer ticket form before continuing., currentVersion: 4, requestId: req-form-409}
    CustomerRequestValidation:
      description: requester mode, form/version pair, typed field 값, attachment 또는 accepted policy 입력이 유효하지 않습니다. unknown/staff-only resource의 존재는 반환하지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerRequestValidationProblem'}
          example: {type: /problems/customer-request-validation-failed, title: Customer request validation failed, status: 400, detail: The customer request is invalid., requestId: req-request-400}
    CustomerRequestForbidden:
      description: 현재 customer access mode, session/CSRF 또는 requester identity 규칙이 문의 제출을 허용하지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerRequestForbiddenProblem'}
          example: {type: /problems/customer-request-not-allowed, title: Customer request not allowed, status: 403, detail: The customer request is not allowed., requestId: req-request-403}
    CustomerRequestConflict:
      description: current form/policy가 바뀌었거나 같은 scoped clientCommandId가 다른 canonical payload에 재사용되었습니다. 별도 rate-limit budget 외 business mutation은 남기지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/CustomerRequestConfigurationConflictProblem'}
              - {$ref: '#/components/schemas/CustomerRequestCommandConflictProblem'}
          examples:
            configurationChanged:
              value: {type: /problems/customer-request-configuration-conflict, title: Customer request configuration changed, status: 409, detail: Refresh the form and policies before submitting again., requestId: req-request-409}
            commandReused:
              value: {type: /problems/customer-request-command-conflict, title: Customer request command conflicts, status: 409, detail: Reuse clientCommandId only for the exact same request., requestId: req-request-command-409}
    CustomerRequestRateLimited:
      description: 이메일·신뢰된 client 주소·전체 요청 고정 창 중 하나가 초과되었습니다. 어떤 bucket인지 또는 원문 식별자는 반환하지 않습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
        Retry-After: {description: 다음 고정 창까지의 양의 초 수입니다., schema: {type: integer, minimum: 1}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerRequestRateLimitedProblem'}
          example: {type: /problems/customer-request-rate-limited, title: Customer request rate limited, status: 429, detail: Try again later., requestId: req-request-429}
    CustomerRequestConfigurationUnavailable:
      description: form/policy projection 또는 required audit persistence를 사용할 수 없어 문의나 preview 성공을 반환할 수 없습니다.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/CustomerRequestConfigurationUnavailableProblem'}
          example: {type: /problems/customer-request-configuration-unavailable, title: Customer request configuration unavailable, status: 503, detail: Try again later., requestId: req-request-503}
  schemas:
    CustomerTicketFormValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-ticket-form-validation-failed}
            title: {type: string, const: Customer ticket form validation failed}
            status: {type: integer, const: 400}
    CustomerTicketFormUnavailableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-ticket-form-unavailable}
            title: {type: string, const: Customer ticket form unavailable}
            status: {type: integer, const: 404}
    CustomerTicketFormVersionConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status, currentVersion]
          properties:
            type: {type: string, const: /problems/customer-ticket-form-version-conflict}
            title: {type: string, const: Customer ticket form version changed}
            status: {type: integer, const: 409}
            currentVersion: {type: integer, minimum: 1}
    CustomerRequestValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-validation-failed}
            title: {type: string, const: Customer request validation failed}
            status: {type: integer, const: 400}
    CustomerRequestForbiddenProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-not-allowed}
            title: {type: string, const: Customer request not allowed}
            status: {type: integer, const: 403}
    CustomerRequestConfigurationConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-configuration-conflict}
            title: {type: string, const: Customer request configuration changed}
            status: {type: integer, const: 409}
    CustomerRequestCommandConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-command-conflict}
            title: {type: string, const: Customer request command conflicts}
            status: {type: integer, const: 409}
    CustomerRequestRateLimitedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-rate-limited}
            title: {type: string, const: Customer request rate limited}
            status: {type: integer, const: 429}
    CustomerRequestConfigurationUnavailableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status]
          properties:
            type: {type: string, const: /problems/customer-request-configuration-unavailable}
            title: {type: string, const: Customer request configuration unavailable}
            status: {type: integer, const: 503}
    TicketFieldType:
      type: string
      enum: [CHECKBOX, SINGLE_SELECT, NUMBER, SHORT_TEXT, LONG_TEXT]
    TicketFieldDefinition:
      type: object
      required: [id, machineKey, type, staffLabel, active, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        machineKey: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$', maxLength: 120}
        type: {$ref: '#/components/schemas/TicketFieldType'}
        staffLabel: {type: string, minLength: 1, maxLength: 120}
        staffDescription: {type: string, maxLength: 500}
        customerLabel: {type: string, maxLength: 120}
        customerDescription: {type: string, maxLength: 500}
        active: {type: boolean}
        customerVisible: {type: boolean}
        customerEditable: {type: boolean}
        agentVisible: {type: boolean}
        agentEditable: {type: boolean}
        searchable: {type: boolean}
        analyticsEligible: {type: boolean}
        sensitive: {type: boolean}
        validation: {$ref: '#/components/schemas/TicketFieldValidation'}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateTicketFieldDefinitionRequest:
      description: immutable machine key와 typed validation을 포함하는 새 ticket field definition 생성 요청입니다.
      x-deskseed-documentation-review: MANUAL
      example: {machineKey: payment.method, type: SINGLE_SELECT, staffLabel: 결제 수단, customerLabel: 결제 수단, customerVisible: true, customerEditable: true, agentVisible: true, agentEditable: true, searchable: true, analyticsEligible: false, sensitive: false}
      allOf:
        - $ref: '#/components/schemas/UpdateTicketFieldDefinitionRequest'
        - type: object
          required: [machineKey, type, staffLabel]
          properties:
            machineKey: {type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$', maxLength: 120}
            type: {$ref: '#/components/schemas/TicketFieldType'}
    UpdateTicketFieldDefinitionRequest:
