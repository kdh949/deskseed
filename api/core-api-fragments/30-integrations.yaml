x-deskseed-fragment:
  owner: integrations-webhooks-api
paths:
  /api/v1/admin/integration-clients/{clientId}/rate-policy:
    get:
      operationId: getIntegrationClientRatePolicy
      summary: 연동 클라이언트 요청 한도와 사용 현황 조회
      description: ADMIN이 기존 Platform API client의 현재 분당 한도, 인증된 요청 누계와 마지막 사용 시각을 조회합니다. API key, secret hash, IP allowlist 원문과 credential secret는 이 projection에 포함하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-001, REQ-INT-002]
      tags: [Integration Clients]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/IntegrationClientId'
      responses:
        '200':
          description: 현재 client version에 결합된 no-store 정책 projection입니다. PATCH는 이 응답의 ETag를 If-Match로 사용합니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            ETag: {schema: {type: string}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/IntegrationClientRatePolicy'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
    patch:
      operationId: updateIntegrationClientRatePolicy
      summary: 연동 클라이언트 분당 요청 한도 변경
      description: ADMIN이 current IntegrationClient ETag와 CSRF를 제시해 다음 Platform request부터 적용할 분당 한도를 변경합니다. 설정 변경과 `INTEGRATION_CLIENT_RATE_LIMIT_UPDATED` admin/security audit는 함께 commit되며 audit persistence 실패 시 변경을 반환하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-001, REQ-INT-002]
      tags: [Integration Clients]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/IntegrationClientId'
      - $ref: '#/components/parameters/IntegrationClientRatePolicyIfMatch'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateIntegrationClientRatePolicy'}}
      responses:
        '200':
          description: 새 한도와 version입니다. 새 ETag로 다음 변경을 조건부로 수행합니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            ETag: {schema: {type: string}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/IntegrationClientRatePolicy'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '412': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks:
    get:
      operationId: listWebhookEndpoints
      summary: 웹훅 엔드포인트 목록 조회
      description: ADMIN이 secret와 body를 제외한 endpoint 상태와 health snapshot을 조회합니다. 이 조회는 browser staff session actor consistency를 확인하고 no-store 응답을 사용합니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      responses:
        '200':
          description: endpoint health와 최근 delivery 요약을 포함한 ADMIN 전용 목록입니다. secret와 요청/응답 본문은 반환하지 않습니다.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WebhookEndpoint'}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
    post:
      operationId: createWebhookEndpoint
      summary: 웹훅 엔드포인트 생성
      description: ADMIN이 HTTPS endpoint와 안정된 event subscription을 생성하고 one-time HMAC secret를 발급합니다. endpoint와 admin/security audit는 함께 commit되며 raw secret는 그 응답 외에 저장·조회되지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWebhookEndpoint'}
      responses:
        '201':
          description: endpoint와 최초 one-time HMAC secret입니다. 이 response만 raw secret를 포함하고 no-store여야 합니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEndpointIssue'}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}:
    get:
      operationId: getWebhookEndpoint
      summary: 웹훅 엔드포인트 상세 조회
      description: ADMIN이 endpoint의 현재 subscription, target class, health와 version을 읽습니다. plaintext secret, request payload와 downstream response body는 projection에 포함하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '200':
          description: endpoint 설정과 health snapshot입니다. secret plaintext, request body, response body는 반환하지 않습니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookEndpoint'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
    patch:
      operationId: updateWebhookEndpoint
      summary: 웹훅 엔드포인트 설정 변경
      description: ADMIN이 If-Match version으로 endpoint URL, subscription 또는 enabled 상태를 변경합니다. URL은 생성·test·delivery와 같은 SSRF resolver policy로 검증하고 audit persistence 실패 시 변경을 반환하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      - $ref: '#/components/parameters/WebhookEndpointIfMatch'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/UpdateWebhookEndpoint'}}
      responses:
        '200':
          description: endpoint 설정과 대응 admin/security audit가 함께 갱신되었습니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookEndpoint'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '412': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/deactivate:
    post:
      operationId: deactivateWebhookEndpoint
      summary: 웹훅 엔드포인트 비활성화
      description: ADMIN이 reason을 남기고 endpoint를 비활성화합니다. hard delete는 제공하지 않으며 pending delivery는 취소되고 history는 보존됩니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WebhookReason'}}
      responses:
        '200':
          description: endpoint가 disabled 상태로 전환되어 신규 delivery를 만들지 않습니다. 기존 delivery history는 보존됩니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookEndpoint'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: 웹훅 서명 secret 회전
      description: ADMIN이 제한된 overlap과 reason으로 endpoint signing secret를 회전합니다. 새 raw secret는 no-store response에서 한 번만 제공하고 audit에는 저장하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RotateWebhookSecret'}}
      responses:
        '200':
          description: 새 secret는 단 한 번만 raw로 반환하고 이전 key version은 제한된 overlap 동안만 검증에 사용됩니다.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookEndpointIssue'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/test-deliveries:
    post:
      operationId: createWebhookTestDelivery
      summary: 웹훅 test delivery 요청
      description: ADMIN이 synthetic metadata-only delivery intent를 요청합니다. test는 같은 endpoint resolver/SSRF policy를 사용하고 committed ticket mutation을 만들거나 재실행하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WebhookReason'}}
      responses:
        '202':
          description: administrator가 요청한 synthetic metadata-only delivery intent입니다. endpoint validation과 self-audit이 같은 transaction에서 보장됩니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookDelivery'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: 웹훅 delivery history 조회
      description: ADMIN이 canonical audit와 분리된 endpoint delivery 상태를 조회합니다. payload, secret와 response body가 아니라 status, attempt count와 error category만 반환합니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      responses:
        '200':
          description: canonical audit와 분리된 delivery log입니다. body와 secret는 redacted summary로도 반환하지 않습니다.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WebhookDelivery'}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/deliveries/{deliveryId}:
    get:
      operationId: getWebhookDelivery
      summary: 웹훅 delivery 상세 조회
      description: ADMIN이 stable delivery ID의 current status와 bounded attempt metadata를 조회합니다. downstream response body와 raw header value는 반환하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      - $ref: '#/components/parameters/WebhookDeliveryId'
      responses:
        '200':
          description: response status, bounded header names, error category, latency만 포함하는 attempt history입니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookDelivery'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
  /api/v1/admin/integrations/webhooks/{endpointId}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: dead-letter 웹훅 delivery 재시도 요청
      description: ADMIN이 reason을 남기고 DEAD_LETTERED delivery를 새 attempt로 재queue합니다. stable event ID는 보존하고 원 ticket command나 audit를 재실행하지 않습니다.
      x-deskseed-contract-status: FROZEN
      x-deskseed-requirements: [REQ-INT-006]
      tags: [Integration Webhooks]
      security: [{staffSession: []}]
      parameters:
      - $ref: '#/components/parameters/ExpectedStaffActorHeader'
      - $ref: '#/components/parameters/CsrfHeader'
      - $ref: '#/components/parameters/WebhookEndpointId'
      - $ref: '#/components/parameters/WebhookDeliveryId'
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WebhookReason'}}
      responses:
        '202':
          description: FAILED 또는 DEAD_LETTER delivery만 새 attempt sequence로 재queue합니다. stable event ID는 변경하지 않습니다.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WebhookDelivery'}}
        '400': {$ref: '#/components/responses/NoStoreProblem'}
        '403': {$ref: '#/components/responses/NoStoreProblem'}
        '404': {$ref: '#/components/responses/NoStoreProblem'}
        '409': {$ref: '#/components/responses/NoStoreProblem'}
        '503': {$ref: '#/components/responses/NoStoreProblem'}
components:
  parameters:
    IntegrationClientRatePolicyIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 3, maxLength: 100}
    WebhookEndpointId:
      name: endpointId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebhookDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WebhookEndpointIfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 3, maxLength: 100}
  responses:
    NoStoreProblem:
      description: authentication, authorization, validation, concurrency 또는 required admin/security audit persistence 실패를 나타내는 RFC 9457 problem입니다.
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        application/problem+json:
          schema:
            oneOf:
            - {$ref: '#/components/schemas/Problem'}
            - {$ref: '#/components/schemas/InvalidExpectedStaffActorProblem'}
            - {$ref: '#/components/schemas/StaffSessionActorMismatchProblem'}
  schemas:
    IntegrationClientRatePolicy:
      type: object
      additionalProperties: false
      required: [clientId, rateLimitPerMinute, usageCount, version, updatedAt]
      properties:
        clientId: {type: string, format: uuid}
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 10000}
        usageCount: {type: integer, format: int64, minimum: 0}
        lastUsedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        updatedAt: {type: string, format: date-time}
      description: API key raw secret, verifier, IP allowlist 원문과 credential secret를 제외한 client rate-limit 운영 projection입니다. usageCount는 성공 인증 뒤 누적되며 rate-limited request도 포함합니다.
    UpdateIntegrationClientRatePolicy:
      type: object
      additionalProperties: false
      required: [rateLimitPerMinute]
      properties:
        rateLimitPerMinute: {type: integer, minimum: 1, maximum: 10000}
      x-deskseed-documentation-review: MANUAL
      example: {rateLimitPerMinute: 120}
      description: 서버 운영자가 허용한 범위 안에서 다음 Platform request부터 적용할 client별 분당 요청 한도입니다.
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, name, url, enabled, subscriptions, targetClass, health, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        url: {type: string, format: uri}
        enabled: {type: boolean}
        subscriptions:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/WebhookSubscription'}
        targetClass: {type: string, enum: [PUBLIC, PRIVATE_APPROVED]}
        health: {$ref: '#/components/schemas/WebhookHealth'}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      description: Secret raw value 및 secret hash/ciphertext를 포함하지 않는 ADMIN projection입니다.
    WebhookEndpointIssue:
      type: object
      additionalProperties: false
      required: [endpoint, secret, secretKeyVersion]
      properties:
        endpoint: {$ref: '#/components/schemas/WebhookEndpoint'}
        secret: {type: string, writeOnly: true, minLength: 32, maxLength: 200}
        secretKeyVersion: {type: integer, minimum: 1}
      description: one-time secret issue response입니다. secret은 response 이후 retrieval API로 조회할 수 없습니다.
    CreateWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [name, url, subscriptions]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        url: {type: string, format: uri, maxLength: 2048}
        subscriptions:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/WebhookSubscription'}
        privateTargetApproval: {$ref: '#/components/schemas/PrivateTargetApproval'}
      x-deskseed-documentation-review: MANUAL
      example:
        name: 주문 상태 알림
        url: https://automation.example.test/deskseed/tickets
        subscriptions: [{eventType: ticket.created, version: 1, payloadPolicy: METADATA_ONLY}]
      description: public target은 HTTPS 443과 public DNS result만 허용합니다. private target은 별도 high-risk capability와 hostname·port·CIDR 승인 snapshot이 없으면 거부됩니다.
    UpdateWebhookEndpoint:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        subscriptions:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/WebhookSubscription'}
        url: {type: string, format: uri, maxLength: 2048}
        privateTargetApproval: {$ref: '#/components/schemas/PrivateTargetApproval'}
      x-deskseed-documentation-review: MANUAL
      example:
        enabled: false
      description: ADMIN이 If-Match version과 함께 endpoint 설정 일부를 변경할 때 쓰는 요청입니다. URL 또는 private approval을 바꾸면 동일한 SSRF validation을 다시 통과해야 합니다.
    WebhookSubscription:
      type: object
      additionalProperties: false
      required: [eventType, version, payloadPolicy]
      properties:
        eventType: {type: string, enum: [ticket.created, ticket.updated, ticket.comment.created, ticket.status.changed, ticket.sla.changed, attachment.ready]}
        version: {type: integer, const: 1}
        payloadPolicy: {type: string, enum: [METADATA_ONLY, PUBLIC_CONTENT]}
      description: INTERNAL comment body, raw search query, secret와 attachment bytes는 어떤 subscription에도 포함하지 않습니다.
    PrivateTargetApproval:
      type: object
      additionalProperties: false
      required: [hostname, port, cidrs, reason]
      properties:
        hostname: {type: string, minLength: 3, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        cidrs:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 2, maxLength: 64}
        reason: {type: string, minLength: 3, maxLength: 500}
      description: endpoint별 private target 승인입니다. loopback, link-local, multicast, unspecified 주소는 이 allowlist로도 허용되지 않습니다.
    RotateWebhookSecret:
      type: object
      additionalProperties: false
      required: [overlapSeconds, reason]
      properties:
        overlapSeconds: {type: integer, minimum: 0, maximum: 86400}
        reason: {type: string, minLength: 3, maxLength: 500}
      x-deskseed-documentation-review: MANUAL
      example:
        overlapSeconds: 3600
        reason: 수신 시스템의 key rotation window를 보장합니다.
      description: ADMIN이 endpoint HMAC secret를 회전할 때 쓰는 요청입니다. overlap 종료 후 이전 secret는 signing에 사용되지 않습니다.
    WebhookReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
      x-deskseed-documentation-review: MANUAL
      example:
        reason: 운영자가 dead letter delivery 재시도를 확인했습니다.
      description: endpoint 비활성화, test delivery 또는 replay처럼 admin/security audit가 필요한 webhook 작업의 사유입니다.
    WebhookHealth:
      type: object
      additionalProperties: false
      required: [state, consecutiveFailures]
      properties:
        state: {type: string, enum: [CLOSED, OPEN, HALF_OPEN]}
        cooldownUntil: {type: [string, 'null'], format: date-time}
        consecutiveFailures: {type: integer, minimum: 0}
        lastSucceededAt: {type: [string, 'null'], format: date-time}
        lastFailedAt: {type: [string, 'null'], format: date-time}
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, eventId, endpointId, status, attemptCount, createdAt]
      properties:
        id: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        endpointId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, IN_FLIGHT, SUCCEEDED, RETRY_SCHEDULED, DEAD_LETTERED, CANCELLED]}
        attemptCount: {type: integer, minimum: 0}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
        errorCategory: {type: [string, 'null'], maxLength: 100}
        createdAt: {type: string, format: date-time}
tags:
- name: Integration Clients
  description: ADMIN이 scoped Platform API client의 non-secret 운영 정책을 관리하는 contract surface입니다.
- name: Integration Webhooks
  description: ADMIN이 signed outbound webhook endpoint와 delivery log를 운영하는 contract surface입니다. Platform API와 분리됩니다.
