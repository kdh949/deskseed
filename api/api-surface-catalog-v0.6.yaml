version: "0.6"
surfaces:
  customer:
    source: api/core-api-outline-v1.yaml
    actor: [anonymous, customer]
    phase: core_mvp_and_p1
    endpoints:
      - method: POST
        path: "/api/v1/requests"
        command: CreateAnonymousRequest
        audit: TICKET_CREATED
      - method: GET
        path: "/api/v1/requests/{ticketNumber}"
        query: CustomerRequestProjection
        audit: optional_customer_access
      - method: POST
        path: "/api/v1/requests/{ticketNumber}/comments"
        phase: p1
        command: AddCustomerPublicComment
      - method: POST
        path: "/api/v1/customer/auth/magic-link-requests"
        phase: p1
        command: RequestCustomerMagicLink
      - method: POST
        path: "/api/v1/customer/auth/magic-link-sessions"
        phase: p1
        command: ConsumeCustomerMagicLink
      - method: GET
        path: "/api/v1/customer/requests"
        phase: p1
        query: CustomerRequestList
      - method: POST
        path: "/api/v1/customer/requests/{ticketNumber}/claim"
        phase: p1
        command: ClaimAnonymousRequest
  agent:
    source: api/core-api-outline-v1.yaml
    actor: [agent, admin]
    phase: core_mvp
    endpoints:
      - method: GET
        path: "/api/v1/agent/views/{viewKey}/tickets"
        query: TicketViewPage
      - method: POST
        path: "/api/v1/agent/tickets"
        command: CreateAgentTicket
      - method: GET
        path: "/api/v1/agent/tickets/{ticketNumber}"
        query: AgentTicketProjection
        audit: TICKET_VIEWED
      - method: PATCH
        path: "/api/v1/agent/tickets/{ticketNumber}"
        command: UpdateTicket
        audit: structured_ticket_audit
      - method: POST
        path: "/api/v1/agent/tickets/{ticketNumber}/transfer"
        command: TransferTicket
      - method: POST
        path: "/api/v1/agent/tickets/{ticketNumber}/children"
        command: CreateChildTicket
      - method: GET
        path: "/api/v1/agent/tickets/{ticketNumber}/external-references"
        phase: integration_i2
        query: ExternalReferenceContext
        audit: API_RESOURCE_READ
      - method: POST
        path: "/api/v1/agent/tickets/{ticketNumber}/external-references"
        phase: integration_i2
        command: CreateExternalReference
        audit: structured_ticket_audit
      - method: DELETE
        path: "/api/v1/agent/tickets/{ticketNumber}/external-references/{referenceId}"
        phase: integration_i2
        command: DeleteExternalReference
        audit: structured_ticket_audit
      - method: POST
        path: "/api/v1/agent/search"
        query: AgentSearch
        audit: SEARCH_EXECUTED
  audit:
    source: api/core-api-outline-v1.yaml
    actor: [security_auditor, authorized_admin]
    phase: portfolio_gate
    endpoints:
      - method: GET
        path: "/api/v1/audit/activities"
        query: UnifiedAuditExplorer
        audit: AUDIT_LOG_VIEWED
      - method: POST
        path: "/api/v1/audit/activities/{id}/reveal"
        command: RevealProtectedAuditData
        audit: AUDIT_SENSITIVE_CONTENT_REVEALED
      - method: POST
        path: "/api/v1/audit/exports"
        command: RequestAuditExport
        audit: AUDIT_EXPORT_REQUESTED
  integration_admin:
    source: api/core-api-outline-v1.yaml
    actor: [admin]
    authority: integration:clients:manage
    phase: integration_i1
    endpoints:
      - method: GET
        path: "/api/v1/admin/integration-clients"
        query: IntegrationClientList
      - method: POST
        path: "/api/v1/admin/integration-clients"
        command: CreateIntegrationClient
        audit: INTEGRATION_CLIENT_CREATED
      - method: GET
        path: "/api/v1/admin/integration-clients/{clientId}"
        query: IntegrationClientDetail
      - method: POST
        path: "/api/v1/admin/integration-clients/{clientId}/disable"
        command: DisableIntegrationClient
        audit: INTEGRATION_CLIENT_DISABLED
      - method: POST
        path: "/api/v1/admin/integration-clients/{clientId}/revoke"
        command: RevokeIntegrationClient
        audit: INTEGRATION_CLIENT_REVOKED
      - method: POST
        path: "/api/v1/admin/integration-clients/{clientId}/rotate"
        command: RotateIntegrationClientCredential
        audit: INTEGRATION_CLIENT_ROTATED
  external_system_admin:
    source: api/core-api-outline-v1.yaml
    actor: [admin]
    authority: integration:systems:manage
    phase: integration_i2
    endpoints:
      - method: GET
        path: "/api/v1/admin/external-systems"
        query: ExternalSystemList
      - method: POST
        path: "/api/v1/admin/external-systems"
        command: CreateExternalSystem
        audit: EXTERNAL_SYSTEM_CREATED
      - method: PUT
        path: "/api/v1/admin/external-systems/{systemId}"
        command: UpdateExternalSystem
        audit: EXTERNAL_SYSTEM_UPDATED
  admin_schedule_sla:
    source: api/core-api-outline-v1.yaml
    actor: [admin]
    phase: p3
    endpoints:
      - method: POST
        path: "/api/v1/admin/business-schedules"
        command: CreateBusinessSchedule
      - method: PATCH
        path: "/api/v1/admin/business-schedules/{scheduleId}"
        command: VersionBusinessSchedule
      - method: POST
        path: "/api/v1/admin/business-schedules/{scheduleId}/preview"
        command: PreviewBusinessTime
      - method: POST
        path: "/api/v1/admin/sla-policies"
        command: CreateSlaPolicy
      - method: POST
        path: "/api/v1/admin/sla-policies/{policyId}/activate"
        command: ActivateSlaPolicy
  platform:
    actor: [integration_client]
    phase: integration_v1
    source: api/platform-api-outline-v1.yaml
  automation:
    actor: [admin]
    phase: p4
    endpoints:
      - method: GET
        path: "/api/v1/admin/triggers"
        query: TriggerList
      - method: POST
        path: "/api/v1/admin/triggers"
        command: CreateTriggerDraft
      - method: POST
        path: "/api/v1/admin/triggers/{id}/simulate"
        command: SimulateTrigger
  analytics:
    actor: [agent, admin]
    phase: p5
    endpoints:
      - method: GET
        path: "/api/v1/analytics/overview"
        query: AnalyticsOverview
      - method: POST
        path: "/api/v1/exports"
        command: RequestSnapshotExport
