name: Build personal staging images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-staging-images-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate personal staging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment contracts
        run: |
          bash -n scripts/deploy-personal-server.sh
          bash scripts/test-personal-staging-deploy.sh
          bash scripts/test-production-compose-contract.sh

  build:
    name: Build ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-tagged image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kdh949/deskseed-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=personal-staging-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=personal-staging-${{ matrix.service }}
