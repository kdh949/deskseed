name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-contracts:
    name: Documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-docs.txt
      - run: python scripts/verify_seed.py
      - run: PYTHONDONTWRITEBYTECODE=1 python scripts/test_api_documentation_quality.py
      - run: python scripts/validate_documentation.py --write
      - run: git diff --exit-code -- api/core-api-outline-v1.yaml api/customer-identity-api-v1.yaml api/platform-api-outline-v1.yaml VALIDATION-REPORT.md FILE-MANIFEST.txt

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        working-directory: backend
        run: ./gradlew --no-daemon test

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Format
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Design system boundaries
        working-directory: frontend
        run: npm run check:design-system-boundaries
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Install Chromium for Storybook tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Storybook tests
        working-directory: frontend
        run: npm run test:storybook
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-browser-e2e:
    name: Frontend browser E2E
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify development-only browser fixtures and mocked flows
        working-directory: frontend
        run: npm run test:e2e:dev
      - name: Preserve Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-e2e-failure
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  compose-smoke:
    name: Compose health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify run-owned Docker cleanup boundary
        run: bash scripts/test-e2e-compose-ownership.sh
      - name: Start stack and check backend health
        run: bash scripts/compose-smoke.sh
