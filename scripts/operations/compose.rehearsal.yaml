services:
  db:
    image: ${DESKSEED_REHEARSAL_POSTGRES_IMAGE:?DESKSEED_REHEARSAL_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${DATABASE_MIGRATION_USERNAME:?DATABASE_MIGRATION_USERNAME is required}
      POSTGRES_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      DESKSEED_RUNTIME_ROLE: ${DATABASE_RUNTIME_USERNAME:?DATABASE_RUNTIME_USERNAME is required}
      DESKSEED_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
    volumes:
      - ./scripts/operations/postgres-init-runtime-role.sh:/docker-entrypoint-initdb.d/20-deskseed-runtime-role.sh:ro
      - ./scripts/postgres:/opt/deskseed/postgres:ro
      - ./scripts/operations:/opt/deskseed/operations:ro

  backend:
    image: ${DESKSEED_REHEARSAL_BACKEND_IMAGE:?DESKSEED_REHEARSAL_BACKEND_IMAGE is required}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_USERNAME: ${DATABASE_RUNTIME_USERNAME:?DATABASE_RUNTIME_USERNAME is required}
      DATABASE_PASSWORD: ${DATABASE_RUNTIME_PASSWORD:?DATABASE_RUNTIME_PASSWORD is required}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_FLYWAY_USER: ${DATABASE_MIGRATION_USERNAME:?DATABASE_MIGRATION_USERNAME is required}
      SPRING_FLYWAY_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?DATABASE_MIGRATION_PASSWORD is required}
      SPRING_FLYWAY_TARGET: ${DESKSEED_REHEARSAL_FLYWAY_TARGET:?DESKSEED_REHEARSAL_FLYWAY_TARGET is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DESKSEED_REHEARSAL_DDL_AUTO:?DESKSEED_REHEARSAL_DDL_AUTO is required}
      DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1: ${DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1:?DESKSEED_ACCESS_AUDIT_KEY_LOCAL_V1 is required}
      DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY: ${DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY:?DESKSEED_AGENT_TICKET_CURSOR_SIGNING_KEY is required}
      DESKSEED_AUDIT_CURSOR_SIGNING_KEY: ${DESKSEED_AUDIT_CURSOR_SIGNING_KEY:?DESKSEED_AUDIT_CURSOR_SIGNING_KEY is required}

  frontend:
    image: ${DESKSEED_REHEARSAL_FRONTEND_IMAGE:?DESKSEED_REHEARSAL_FRONTEND_IMAGE is required}
