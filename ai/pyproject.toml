[project]
name = "deskseed-ai"
version = "0.1.0"
description = "Isolated Deskseed AI V1 execution service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "langfuse>=4,<5",
  "langgraph>=1.1,<2",
  "litellm>=1.82,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "redis>=7.4,<8",
  "tiktoken>=0.14,<0.15",
  "uvicorn[standard]>=0.42,<0.43",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
  "testcontainers[postgres,redis]>=4.14,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires real PostgreSQL and Redis containers",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "src/deskseed_ai/config.py",
  "src/deskseed_ai/evaluation.py",
  "src/deskseed_ai/observability.py",
  "src/deskseed_ai/pricing.py",
  "src/deskseed_ai/prompt_cache.py",
  "src/deskseed_ai/routing.py",
  "src/deskseed_ai/schemas.py",
  "src/deskseed_ai/security.py",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskseed_ai"]
